<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jakob — Vorschau Scroll-Intro</title>
<style>
  :root {
    --ground:      #0E0712;
    --violet:      #6C0BA9;
    --violet-lift: #A939EF;
    --amber:       #FAA52E;
    --text:        #F3EEF8;
    --text-muted:  #A297AE;

    --stage-h: 100svh;

    /* Hoehe der festen Leiste. Startwert fuer den Fall ohne JS; resize() setzt
       den gemessenen Wert. Verlauf, Shop-Abstand und Sternenfeld haengen alle
       an dieser einen Zahl - vorher standen dafuer 110, 118 und 90 nebeneinander. */
    --nav-h: 118px;

    /* Platzhalter für die Navigationsschrift. shihiko.com nutzt NB Architekt Std
       (Neubau, kostenpflichtig) — die liegt hier bewusst nicht bei. Sobald die
       echte Schrift da ist: selbst hosten und nur diese Zeile tauschen. */
    --font-nav: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }

  /* Metal Mania — dieselbe Schriftart wie unter dem Stern in der Animation.
     SIL Open Font License 1.1, Rodrigo Fuenzalida. Liegt selbst im Projekt,
     wird nicht von Google nachgeladen: ein Hotlink auf fonts.gstatic.com
     überträgt die IP jedes Besuchers (LG München I, 3 O 17493/20). */
  @font-face {
    font-family: "Metal Mania";
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url("fonts/metal-mania-latin.woff2") format("woff2");
  }

  * { box-sizing: border-box; }

  /* Kein scroll-padding-top: jeder Abschnitt bringt oben selbst genug Abstand
     mit, um unter der festen Leiste hervorzukommen (siehe .shop). Beides
     zusammen zaehlte den Versatz doppelt. Ein kuenftiger Abschnitt ohne
     eigenen Abstand braucht ein scroll-margin-top. */
  html { scroll-behavior: auto; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--text);
    font-family: "Helvetica Neue", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Animierter Verlauf hinter der ganzen Seite (Stage und Shop lassen ihn
     durchscheinen). --ground als Hintergrund der Canvas selbst: so bleibt es
     bei genau diesem dunklen Grund, falls WebGL fehlt oder noch laedt. */
  #bgfx, #bgfx2d {
    position: fixed;
    inset: 0;
    z-index: -1;
    width: 100vw;
    height: 100vh;
    display: block;
    background: var(--ground);
  }

  /* PROTOTYP - Vergleichsleiste fuer die drei Hintergrund-Varianten. Nach der
     Entscheidung fuer eine Variante wieder raus, siehe Skript-Kommentar unten. */
  #bgSwitcher {
    position: fixed;
    left: 50%; bottom: 18px;
    transform: translateX(-50%);
    z-index: 999;
    display: flex; align-items: center; gap: 12px;
    padding: 8px 14px;
    background: #000c;
    border: 1px solid #fff3;
    border-radius: 999px;
    color: var(--text);
    font: 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    box-shadow: 0 4px 24px #0008;
  }
  #bgSwitcher button {
    all: unset;
    cursor: pointer;
    padding: 2px 8px;
    font: inherit;
    color: var(--amber);
  }
  #bgSwitcher button:hover { color: var(--text); }

  /* ---------- Intro ---------- */

  /* Höhe des Spacers = wie weit man scrollt, um die Sequenz durchzuspielen.
     360 statt 520: fuenf volle Wischer auf dem Handy sind zu viel Weg bis zum
     ersten Artikel. Eine Zahl, kein Umbau.
     svh statt vh: die Buehne ist 100svh. Mit vh (= grosser Viewport) waere der
     Scrollweg auf dem Handy rund 17 % laenger als am Desktop, weil lvh dort
     etwa 12 % ueber svh liegt. */
  .intro { height: 360svh; position: relative; }

  /* Kein eigener Hintergrund mehr: #bgfx liegt fest hinter der ganzen Seite,
     die Stage laesst ihn durchscheinen. */
  .stage {
    position: sticky;
    top: 0;
    height: var(--stage-h);
    overflow: hidden;
    display: grid;
    place-items: center;
    background: transparent;
  }

  /* Sternenfeld: der Hintergrund des Shops, deckt dessen ganze Box ab.
     Erst war das sticky mit fester Fensterhoehe. Gemessen war das falsch: der
     Shop liess nur 88 px Scrollspielraum, ein sticky Element ohne Spielraum
     klebt nicht, und durch das padding-top begann das Canvas 309 px zu tief -
     oben blieb ein sternenloser Streifen.
     ponytail: der Puffer ist so hoch wie der Shop. Bei drei Artikeln ist das
     unkritisch; wird der Shop mehrere Bildschirme lang, wieder auf ein
     fensterhohes Canvas mit eigener Scrollverrechnung umbauen. */
  .starfield {
    position: absolute;
    inset: 0;
    z-index: 0;
    display: block;
    width: 100%;
    height: 100%;
    opacity: 0;
    pointer-events: none;
  }
  /* Der Inhalt muss positioniert sein, sonst malt das Canvas darueber:
     innerhalb eines Stapelkontexts liegen positionierte Elemente mit z-index 0
     ueber dem Text nicht positionierter Bloecke. */
  .shop > :not(.starfield) { position: relative; z-index: 1; }

  /* Liegt vor dem Sternenfeld und hinter dem Schriftzug. Die Deckkraft setzt
     die Schleife: das Video blendet ab, statt zur Karte zu werden. */
  .seq {
    position: relative;
    z-index: 2;
    display: block;
    width: 100%;
    height: 100%;
  }

  /* Kommt erst zum Vorschein, wenn das Video am Ende der Sequenz ausblendet
     (siehe FADE_START im Script). Deckt sich mit dem Video, liegt aber
     dahinter. */
  .stage-stars {
    position: absolute;
    inset: 0;
    z-index: 1;
    width: 100%;
    height: 100%;
    opacity: 0;
    pointer-events: none;
  }

  /* Standbild, solange die Sequenz lädt — nie eine leere Seite */
  .poster {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    /* contain, nicht cover: das Canvas schneidet hochkant ebenfalls nicht mehr
       voll zu, ein cover-Poster würde beim Wechsel sichtbar springen. */
    object-fit: contain;
    transition: opacity .4s ease;
  }
  .ready .poster { opacity: 0; }

  .hint {
    position: absolute;
    left: 50%; bottom: 3svh;
    transform: translateX(-50%);
    font-size: .75rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--text-muted);
    transition: opacity .3s;
  }

  /* ---------- Menüleiste ---------- */

  /* Nach meinhardtaxer.com: kein Balken, keine Kerbe. Die Navigation steht
     nackt auf dem Grund, Wortmarke links, gruppierte Spalten rechts, alles
     klein geschrieben und eng laufend statt versal und gesperrt.
     Fest verankert, ab dem ersten Pixel sichtbar. */
  .navbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: clamp(16px, 4vw, 64px);
    padding: 26px clamp(16px, 2.2vw, 34px) 0;
    color: #D9D9D9;                    /* wie die Referenz: nicht Reinweiß */
    pointer-events: none;              /* der Verlauf faengt sonst Klicks ab */
  }
  .navbar a { pointer-events: auto; }

  /* Den Verlauf hat die Referenz nicht — sie braucht ihn auch nicht, weil dort
     meist Schwarz unter der Leiste liegt. Bei uns laeuft ein Video darunter.
     Ueber alle 176 Frames gemessen: OHNE Verlauf faellt der Kontrast auf 1,00,
     die Navigation waere stellenweise unsichtbar.
     Die Staerke ist gerechnet, nicht geschaetzt: Schrift rgb(217) auf einem
     reinweissen Pixel haelt 4,5:1 erst ab 63 % Schwaerzung. Deshalb bleibt der
     Verlauf bis 60 % seiner Hoehe bei rund .70 und faellt erst darunter ab.
     Das Plateau muss unter den tiefsten Link reichen: bei einem Abfall ab 44 %
     lag 'warenkorb' schon im duenner werdenden Teil, und genau dort fielen
     noch 3 Frames durch.
     Nach der Korrektur: 0 von 176 Frames unter 4,5:1. */
  .navbar::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    /* Die Stopps haengen an --nav-h, nicht an Prozenten: die Leiste ist auf
       320 px 138 px hoch und bricht um, auf dem Desktop ist sie 118 px flach.
       Mit festen Prozenten sass die unterste Linkzeile auf 320 px im
       auslaufenden Teil des Verlaufs — dort fielen 16 von 88 Frames durch. */
    height: calc(var(--nav-h) + 110px);
    background: linear-gradient(to bottom,
      rgb(0 0 0 / .74) 0,
      rgb(0 0 0 / .70) var(--nav-h),
      rgb(0 0 0 / .22) calc(var(--nav-h) + 70px),
      transparent 100%);
    pointer-events: none;
    z-index: -1;
  }

  .wordmark {
    font-family: "Metal Mania", var(--font-nav);
    font-size: clamp(24px, 2.1vw, 34px);
    line-height: 1;
    font-weight: 400;
    color: inherit;
    text-decoration: none;
    white-space: nowrap;
  }

  .navcols { display: flex; gap: clamp(18px, 3.2vw, 60px); }
  .navcol  { display: flex; flex-direction: column; }

  /* Rubrik und Links unterscheiden sich nur in der Groesse, nicht in Farbe oder
     Schnitt — genau wie in der Referenz (11 px gegen 16 px, beide 400). */
  /* Leichte Spanne statt fester px: 15 px wirken auf 2560 verloren. Nach oben
     eng begrenzt, damit die Leiste Bedienelement bleibt und nicht zu Inhalt wird. */
  .navlabel { font-size: clamp(11px, .62vw, 13px); opacity: .62; margin-bottom: 9px; }
  .navbar a:not(.wordmark) { font-size: clamp(14px, .85vw, 18px); line-height: 1.42; }

  .navbar :where(.navlabel, a:not(.wordmark)) {
    font-family: var(--font-nav);
    letter-spacing: -.01em;            /* eng, nicht gesperrt */
    text-transform: none;              /* klein geschrieben */
  }
  .navbar a { color: inherit; text-decoration: none; }
  .navbar a:not(.wordmark):hover { opacity: .6; }
  .cart { margin-top: 6px; }

  /* Handy: drei Spalten passen nicht auf 320 px. Die Rubriken fallen weg, die
     Links stehen in einer Zeile — mehr traegt die Breite nicht, und ein
     Aufklappmenue waere neue Mechanik fuer drei Handvoll Links. */
  /* Auch nach Hoehe, nicht nur nach Breite: bei 844x390 im Querformat greift
     eine reine Breitenabfrage nicht, und die dreispaltige Leiste frisst dort
     118 von 390 px - fast ein Drittel des Bildschirms. */
  @media (max-width: 700px), (max-height: 500px) {
    .navbar { padding-top: 18px; gap: 12px; }
    .navlabel { display: none; }
    .navcol  { flex-direction: row; gap: 14px; }
    .navcols { gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
    .navbar a:not(.wordmark) { font-size: clamp(13px, 3.4vw, 15px); }
    .cart { margin-top: 0; }
  }

  /* ---------- Shop ---------- */

  .shop {
    position: relative;
    z-index: 2;
    min-height: 100svh;
    /* Oben zusaetzlich die Leistenhoehe, sonst laeuft die Ueberschrift darunter. */
    padding: calc(var(--nav-h) + clamp(2rem, 6svh, 5rem))
             clamp(1.25rem, 5vw, 5rem)
             clamp(3rem, 10svh, 8rem);
    /* Kein eigener Hintergrund: #bgfx liegt fest hinter der ganzen Seite und
       scheint durch. */
    background: transparent;
    /* Startwert ohne JS: vollständig sichtbar. Verstecken darf nur JS. */
    opacity: 1;
    will-change: transform, opacity;
  }

  .shop h2 {
    margin: 0 0 .6em;
    font-size: clamp(1.75rem, 5vw, 3.5rem);
    letter-spacing: -.03em;
    text-transform: uppercase;
  }
  .shop p { color: var(--text-muted); max-width: 48ch; line-height: 1.6; margin: 0 0 clamp(1rem, 3svh, 2.5rem); }

  .grid {
    display: grid;
    gap: clamp(1rem, 2.5vw, 2rem);
    grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr));
    max-width: 1200px;
  }
  /* Deckend, nicht durchscheinend: mit dem Sternenfeld dahinter wuerden sonst
     Sterne durch die Produktkacheln ziehen. */
  .card {
    border: 1px solid color-mix(in srgb, var(--violet-lift) 25%, transparent);
    border-radius: 4px;
    padding: 1.25rem;
    background: color-mix(in srgb, var(--violet) 8%, var(--ground));
  }
  .card .ph {
    aspect-ratio: 4/5;
    background:
      radial-gradient(ellipse at 50% 40%, color-mix(in srgb, var(--violet-lift) 35%, transparent), transparent 70%),
      var(--ground);
    border-radius: 2px;
    margin-bottom: 1rem;
  }
  .card h3 { margin: 0 0 .35rem; font-size: 1rem; font-weight: 600; letter-spacing: .01em; }
  .card .price { color: var(--text-muted); font-size: .9rem; }
  .buy {
    margin-top: 1rem; width: 100%;
    background: var(--amber); color: var(--ground);
    border: 0; border-radius: 3px; padding: .8rem 1rem;
    font: inherit; font-weight: 700; letter-spacing: .02em;
    cursor: pointer;
  }

  /* ---------- Dev-Anzeige ---------- */
  .hud {
    position: fixed; right: 10px; bottom: 10px; z-index: 99;
    font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #000a; color: var(--amber);
    padding: 6px 9px; border-radius: 3px;
    border: 1px solid #fff2;
    pointer-events: none;
    white-space: pre;
  }
  .hud.off { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .hint { display: none; }
  }
</style>
</head>
<body>

<canvas id="bgfx" aria-hidden="true"></canvas>

<!-- Steht ab dem ersten Pixel und bleibt stehen. Deshalb braucht die Seite
     keine Vorschaltseite: die Identität ist sofort da, das Video ist
     Kopfbereich statt Tor. -->
<header class="navbar" id="navbar">
  <a class="wordmark" href="#top">Rutger</a>
  <!-- ponytail: alle Ziele ausser dem Shop sind Platzhalter und zeigen auf
       sich selbst. Sobald die Seitenstruktur steht, bekommen sie echte Ziele. -->
  <nav class="navcols">
    <div class="navcol">
      <span class="navlabel">shop</span>
      <a href="#shop">alle artikel</a>
      <a href="#shop">kategorien</a>
      <a href="#shop">drops</a>
    </div>
    <div class="navcol">
      <span class="navlabel">mehr</span>
      <a href="#">archiv</a>
      <a href="#">vip</a>
    </div>
    <div class="navcol">
      <span class="navlabel">kontakt</span>
      <a href="#">instagram</a>
      <a href="#">e-mail</a>
      <a href="#" class="cart">warenkorb (0)</a>
    </div>
  </nav>
</header>

<section class="intro" id="intro">
  <div class="stage" id="stage">
    <img class="poster" id="poster" src="frames/001.jpg" alt="">
    <canvas class="stage-stars" id="stageStars" aria-hidden="true"></canvas>
    <canvas class="seq" id="seq"></canvas>
    <div class="hint" id="hint">scrollen</div>
  </div>
</section>

<section class="shop" id="shop">
  <!-- Sternenfeld liegt jetzt hier, hinter dem Shop-Inhalt. -->
  <canvas class="starfield" id="starfield" aria-hidden="true"></canvas>
  <h2>Shop</h2>
  <p>Platzhalter. Hier stehen später 2–3 Artikel mit Größen, angebunden an Stripe Checkout.</p>
  <div class="grid">
    <div class="card"><div class="ph"></div><h3>Shirt — Tour</h3><div class="price">30,00 €</div><button class="buy">In den Warenkorb</button></div>
    <div class="card"><div class="ph"></div><h3>Hoodie</h3><div class="price">65,00 €</div><button class="buy">In den Warenkorb</button></div>
    <div class="card"><div class="ph"></div><h3>Vinyl</h3><div class="price">25,00 €</div><button class="buy">In den Warenkorb</button></div>
  </div>
</section>


<div class="hud" id="hud">–</div>

<script>
(() => {
  // ---- Stellschrauben ---------------------------------------------------
  const FRAME_COUNT = 176;
  const FRAME_PATH  = i => `frames/${String(i).padStart(3, '0')}.jpg`;

  const DAMPING  = 0.085;  // kleiner = schwerer/träger
  const CAM_PUSH = 0.06;   // Hineinfahrt. Klein halten: das Material fährt schon selbst

  // Ab hier (Anteil des Scrollwegs) blendet das Video aus statt als Standbild
  // stehen zu bleiben. Die Frames sind bei FADE_START fertig durchgespielt,
  // der Rest bis 1 ist reine Ausblendzeit.
  const FADE_START = 0.85;

  // Die Sequenz läuft über den ganzen Scrollweg der Intro und bleibt dabei
  // formatfüllend. Sie wird nicht zur Karte und blendet nicht in einen Titel:
  // das Menü steht ab dem ersten Pixel, die Seite braucht also kein
  // Vorschaltbild. Am Ende schiebt sich der Shop einfach darüber.
  // Frühere Zustände hängen am Tag `stand-video-als-karte`.

  // Wie viel Bildbreite mindestens stehen bleiben muss. Das Material ist quer
  // (16:9), ein Handy hochkant ist 9:19,5 — ohne Grenze schneidet `cover` 74 %
  // der Breite weg und zieht den Rest 3,7× auf. Statt dessen füllt --ground
  // oben und unten auf.
  const MIN_VIS = 0.55;

  const SHOP_RISE  = 80;   // px, aus denen der Shop hochkommt
  const SHOP_SCALE = 0.94; // Startgröße des Shops

  // Sterne. Werte sind an einer 1920 breiten Bühne festgelegt und werden unten
  // mit der tatsächlichen Bildbreite heruntergerechnet. Sie sind jetzt der
  // Hintergrund des Shops, nicht mehr das Endbild der Intro.
  const ST_SRC    = 'stars.webp';
  const ST_COLS   = 12, ST_ROWS = 10, ST_TILE = 224;
  const ST_FRAMES = ST_COLS * ST_ROWS;   // 120 Bilder = eine volle Umdrehung
  const ST_FPS    = 15;
  const ST_N      = 25;        // Anzahl bei 1920×945
  const ST_MAX    = 250;       // Größe des größten Sterns bei 1920 breit
  const ST_DEPTH  = 0.75;      // 0 = alle gleich groß, 1 = fast alle winzig
  const ST_DRIFT  = 2.3;
  const ST_AXIS   = 26 * Math.PI / 180;   // gemeinsame Driftachse
  const ST_GAP    = 16;        // Mindestluft zwischen zwei Sternbahnen
  const ST_SEED   = 20260825;
  // Dunkler Hof hinter jedem Stern, Radius als Vielfaches der Sterngröße. Haelt
  // den Kontrast am Stern fest, egal wie hell --ground gerade steht. Per
  // Regler-Prototyp gegen die helle Variante D abgeglichen - 0.3 war der
  // Sweet Spot, gross genug fuer Kontrast, klein genug um nicht als eigener
  // Kreis aufzufallen.
  const ST_HALO = 0.3;
  // Gemessen, nicht geschätzt: der weiteste undurchsichtige Punkt einer Kachel
  // liegt bei 0.523 × Kachelbreite vom Mittelpunkt.
  const ST_RADIUS = 0.53;
  // -----------------------------------------------------------------------

  const canvas = document.getElementById('seq');
  const ctx    = canvas.getContext('2d', { alpha: true });
  const intro  = document.getElementById('intro');
  const stage  = document.getElementById('stage');
  const shop   = document.getElementById('shop');
  const navbar = document.getElementById('navbar');
  const hint   = document.getElementById('hint');
  const hud    = document.getElementById('hud');

  const clamp01 = v => Math.min(1, Math.max(0, v));
  const reduce  = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const frames = [];
  let loaded = 0, ready = false;
  let target = 0, eased = 0;
  let iw = 0, ih = 0;
  // Maße in CSS-Pixeln plus das dpr, mit dem der Puffer angelegt wurde. Nicht in
  // draw() neu auslesen — sonst driften Puffer und Anzeige auseinander, sobald
  // sich Fenstergröße oder Zoom ändern.
  let cssW = 0, cssH = 0, dprUsed = 1;

  // ---- Sterne -----------------------------------------------------------
  // Zwei Instanzen desselben Feldes: eine liegt im Stage-Canvas und blendet auf,
  // wenn das Video ausklingt; die andere wie bisher hinter dem Shop. Gleicher
  // Seed in layout() -> beide zeigen dasselbe Muster, wirkt wie ein
  // durchgehendes Sternenfeld statt zwei zufällig verschiedenen.
  const sky      = document.getElementById('starfield');
  const stageSky = document.getElementById('stageStars');
  const sheet    = new Image();
  let sheetOk = false;

  const rand = seed => () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;

  function createStarfield(canvasEl) {
    const c = canvasEl.getContext('2d');
    let w = 0, h = 0, stars = [], info = '–';

    function layout() {
      if (!w || !h) return;

      // Alles hängt an der Bildbreite: auf dem Handy weniger und kleinere Sterne,
      // sonst stehen 25 Stück auf 390 px übereinander.
      const k    = Math.min(1, Math.max(0.42, w / 1920));
      const dens = Math.min(1, Math.max(0.35, (w * h) / (1920 * 945)));
      const n    = Math.max(4, Math.round(ST_N * dens));
      const maxS = ST_MAX * k;

      // Einzige Sperrfläche ist das Menü. Der Inhalt darüber (Shop-Kacheln,
      // Video) ist deckend, dort dürfen die Sterne also durchziehen.
      const navH = (navbar.offsetHeight || 90) + 16;

      const r = rand(ST_SEED);
      const expo = 1 + ST_DEPTH * 4;
      const cand = Array.from({ length: n }, (_, i) => {
        const u    = r();
        const f    = 0.14 + 0.86 * Math.pow(u, expo);   // Potenzverteilung: viele winzige
        const size = maxS * f;
        // Parallaxe: groß = nah = legt mehr Weg zurück. Gedeckelt auf 70 % der
        // eigenen Größe — darüber wandert ein Stern nicht mehr, er hüpft.
        const amp  = Math.min(ST_DRIFT * k * (6 + size * 0.34), size * 0.70);

        // Einmal pro Layout gebaut statt pro Frame: ein Gradient haengt nur an
        // der (fixen) Groesse, nicht an der Position. Frisch erzeugt bei jedem
        // draw() waren das bei 25 Sternen ueber 1000 CanvasGradient-Objekte pro
        // Sekunde - GC-Ruckler im Sekundentakt statt einmalig beim Resize.
        const haloR = size * ST_HALO;
        const halo = c.createRadialGradient(0, 0, 0, 0, 0, haloR);
        halo.addColorStop(0, 'rgba(0,0,0,.15)');
        halo.addColorStop(1, 'rgba(0,0,0,0)');

        return {
          i, size, amp, haloR, halo,
          R:     size * ST_RADIUS + amp,      // Bahnradius: Stern plus sein ganzer Weg
          alpha: 0.40 + 0.60 * f,             // klein = hinten = blasser
          rot:   (r() * 2 - 1) * 0.45,
          spin:  (r() * 2 - 1) * 0.04,
          flip:  r() < 0.5 ? -1 : 1,
          ph:    r() * Math.PI * 2,
          per:   16 + r() * 26,
          off:   Math.floor(r() * ST_FRAMES)  // Frameversatz: kein Gleichschritt
        };
      });
      cand.sort((a, b) => b.R - a.R);         // Große zuerst, die sind am schwersten unterzubringen

      const out = [];
      for (const cd of cand) {
        const pr = rand(ST_SEED + cd.i * 7919);
        let ok = false;
        for (let gap = ST_GAP; gap >= 0 && !ok; gap -= 4) {   // notfalls Luft verkleinern
          for (let tries = 0; tries < 400; tries++) {
            // Mittelpunkt liegt immer im Bild, der Stern darf über den Rand
            // hinausragen — angeschnitten am Rand sieht gut aus und schafft Platz.
            const x = pr() * w;
            const y = navH + pr() * (h - navH);
            // Abstand zu allen schon gesetzten. Die Bahnen sind geschlossen, also
            // reicht diese eine Prüfung, damit sich nie zwei Sterne überlappen.
            let hit = false;
            for (const o of out) {
              const need = cd.R + o.R + gap;
              if ((x - o.x) ** 2 + (y - o.y) ** 2 < need * need) { hit = true; break; }
            }
            if (hit) continue;
            out.push(Object.assign({}, cd, { x, y })); ok = true; break;
          }
        }
        // Kein Platz gefunden -> der Stern fällt weg. Lieber einer weniger als zwei übereinander.
      }
      stars = out;

      // Selbstprüfung: die Bahnen dürfen sich nie schneiden. Fällt das durch,
      // stimmt die Platzierungslogik nicht — und man sieht es nur zufällig.
      let worst = Infinity;
      for (let a = 0; a < out.length; a++)
        for (let b = a + 1; b < out.length; b++)
          worst = Math.min(worst, Math.hypot(out[a].x - out[b].x, out[a].y - out[b].y)
                                  - (out[a].R + out[b].R));
      info = `Sterne ${out.length}/${n}, Luft ${out.length > 1 ? Math.round(worst) : '–'} px`;
      if (out.length > 1 && worst < 0) console.error('Sternbahnen überlappen:', worst);
    }

    function draw(t) {
      if (!sheetOk) return;
      c.clearRect(0, 0, w, h);
      // Frac-Ueberblendung zwischen zwei Sprite-Frames wieder raus: zwei
      // unterschiedliche Frames uebereinander erzeugten ein wechselndes
      // Doppelbild, das als Flimmern auffiel - schlechter als der harte Cut.
      const base = Math.floor(t * ST_FPS);
      const ca = Math.cos(ST_AXIS), sa = Math.sin(ST_AXIS);
      for (const st of stars) {
        // Geschlossene Ellipsenbahn, lang entlang der gemeinsamen Achse, flach quer
        // dazu. Geschlossen heißt: der Stern verlässt seinen Radius nie.
        const a = t / st.per * Math.PI * 2 + st.ph;
        const u = Math.cos(a) * st.amp, wv = Math.sin(a) * st.amp * 0.32;
        const fi = (base + st.off) % ST_FRAMES;
        const sx = (fi % ST_COLS) * ST_TILE, sy = ((fi / ST_COLS) | 0) * ST_TILE;

        c.save();
        c.globalAlpha = st.alpha;
        c.translate(st.x + u * ca - wv * sa, st.y + u * sa + wv * ca);
        c.rotate(st.rot + t * st.spin);

        // Weicher dunkler Hof vor dem Stern: haelt den Kontrast am Stern fest,
        // unabhaengig davon, wie hell --ground gerade steht. Gradient kommt
        // fertig aus layout() - hier nur noch gezeichnet, nicht neu gebaut.
        c.fillStyle = st.halo;
        c.beginPath();
        c.arc(0, 0, st.haloR, 0, Math.PI * 2);
        c.fill();

        c.scale(st.flip, 1);
        c.drawImage(sheet, sx, sy, ST_TILE, ST_TILE, -st.size / 2, -st.size / 2, st.size, st.size);
        c.restore();
      }
    }

    return {
      resize(cw, ch) {
        w = cw; h = ch;
        canvasEl.width  = Math.round(w * dprUsed);
        canvasEl.height = Math.round(h * dprUsed);
        c.setTransform(dprUsed, 0, 0, dprUsed, 0, 0);
        layout();
      },
      draw,
      get info() { return info; }
    };
  }

  const skyField   = createStarfield(sky);
  const stageField = createStarfield(stageSky);

  sheet.decoding = 'async';
  sheet.onload = () => { sheetOk = true; skyField.draw(0); stageField.draw(0); };
  sheet.src = ST_SRC;

  // ---- Laden ------------------------------------------------------------
  for (let i = 1; i <= FRAME_COUNT; i++) {
    const img = new Image();
    img.decoding = 'async';
    img.src = FRAME_PATH(i);
    img.onload = () => {
      if (!iw) {
        iw = img.naturalWidth; ih = img.naturalHeight;
        resize();
        stage.classList.add('ready');   // Poster weg, sobald EIN Frame steht
      }
      if (++loaded === FRAME_COUNT) ready = true;
    };
    frames.push(img);
  }

  // ---- Zeichnen ---------------------------------------------------------
  function resize() {
    dprUsed = Math.min(devicePixelRatio || 1, 2);   // bei 2 gedeckelt
    // Gemessen statt geschaetzt: die Leiste ist auf dem Handy flacher, und
    // Shop-Abstand wie Ankerziel haengen beide an dieser einen Zahl.
    // Ueberschreibt den Startwert aus :root mit der gemessenen Hoehe. Die Leiste
    // bricht auf schmalen Bildschirmen um und ist dann hoeher.
    document.documentElement.style.setProperty('--nav-h', navbar.offsetHeight + 'px');
    const r = stage.getBoundingClientRect();
    cssW = r.width; cssH = r.height;
    canvas.width  = Math.round(cssW * dprUsed);
    canvas.height = Math.round(cssH * dprUsed);
    ctx.setTransform(dprUsed, 0, 0, dprUsed, 0, 0);

    // Das Sternenfeld hinter dem Shop hat eine eigene Größe: es klebt im Shop
    // und ist immer nur fensterhoch, egal wie lang der Shop wird. Das im Stage
    // deckt sich mit dem Video, bekommt also cssW/cssH.
    const s = sky.getBoundingClientRect();
    skyField.resize(s.width, s.height);
    stageField.resize(cssW, cssH);
    // Das Resize hat die Canvases geleert. In Bewegung zeichnet die Schleife im
    // nächsten Bild nach — bei reduzierter Bewegung niemand, deshalb hier.
    // Dort mit fester Zeit 0, sonst haengt das Standbild an der Uhr und ein
    // spaeteres resize() zeichnet eine andere Sternstellung.
    const t0 = reduce ? 0 : performance.now() / 1000;
    skyField.draw(t0);
    stageField.draw(t0);

    draw(eased);
  }

  function draw(t) {
    if (!iw || !cssW) return;

    // Die Frames sind bei FADE_START fertig durchgespielt; danach hält der
    // letzte Frame, während tick() das Canvas darüber ausblendet.
    const seqT = Math.min(t, FADE_START) / FADE_START;
    const idx = Math.min(FRAME_COUNT - 1, Math.max(0, Math.round(seqT * (FRAME_COUNT - 1))));
    const img = frames[idx];
    if (!img.complete || !img.naturalWidth) return;

    // Volle Breite, Höhe nur so weit, dass MIN_VIS der Bildbreite stehen bleibt.
    const asp = iw / ih;
    const bw = cssW;
    const bh = Math.min(cssH, cssW / (MIN_VIS * asp));
    const bx = 0, by = (cssH - bh) / 2;

    const sc = Math.max(bw / iw, bh / ih) * (1 + CAM_PUSH * seqT);
    const w = iw * sc, h = ih * sc;

    ctx.clearRect(0, 0, cssW, cssH);
    ctx.save();
    ctx.beginPath();
    ctx.rect(bx, by, bw, bh);
    ctx.clip();
    ctx.drawImage(img, bx + (bw - w) / 2, by + (bh - h) / 2, w, h);
    ctx.restore();

    hud.textContent =
      'Frame ' + (idx + 1) + ' / ' + FRAME_COUNT + '\n' +
      'Sequenz ' + (t * 100).toFixed(1) + ' %\n' +
      (ready ? 'geladen' : 'lädt ' + loaded + '/' + FRAME_COUNT) + '\n' +
      skyField.info + '\n' +
      'h = Anzeige';
  }

  // ---- Scroll ----------------------------------------------------------
  function readScroll() {
    const rect = intro.getBoundingClientRect();
    const total = intro.offsetHeight - stage.offsetHeight;
    target = total <= 0 ? 0 : Math.min(1, Math.max(0, -rect.top / total));
  }

  function tick() {
    eased += (target - eased) * DAMPING;
    if (Math.abs(target - eased) < 0.0002) eased = target;

    draw(eased);
    hint.style.opacity = String(Math.max(0, 1 - eased * 6));

    // Letztes Stück des Scrollwegs: das Video blendet aus, statt als Standbild
    // zu bleiben, und gibt den Blick auf das Sternenfeld dahinter frei.
    const fadeT = clamp01((eased - FADE_START) / (1 - FADE_START));
    canvas.style.opacity = String(1 - fadeT);
    stageSky.style.opacity = String(fadeT);
    if (fadeT > 0) stageField.draw(performance.now() / 1000);

    // Shop kommt von unten hoch, die Sterne blenden mit ihm auf.
    const r = shop.getBoundingClientRect();
    const p = clamp01(1 - r.top / innerHeight);
    if (p >= 1) {
      shop.style.transform = 'none';        // scharf und bedienbar, sobald angekommen
      shop.style.opacity = '1';
    } else {
      shop.style.transform =
        `translateY(${(1 - p) * SHOP_RISE}px) scale(${SHOP_SCALE + p * (1 - SHOP_SCALE)})`;
      shop.style.opacity = String(Math.max(0.15, p));
    }

    // Nur zeichnen, wenn der Shop überhaupt im Bild ist. Sonst liefe die
    // Sternenschleife die ganze Intro über mit und kostete durchgehend Akku.
    const sichtbar = r.top < innerHeight && r.bottom > 0;
    sky.style.opacity = String(p);
    if (sichtbar && p > 0) skyField.draw(performance.now() / 1000);

    requestAnimationFrame(tick);
  }

  addEventListener('scroll', readScroll, { passive: true });   // kein preventDefault
  // ResizeObserver statt nur window.resize: fängt auch Layout- und Zoomänderungen,
  // die kein resize-Event auslösen.
  new ResizeObserver(() => { resize(); readScroll(); }).observe(stage);
  addEventListener('keydown', e => { if (e.key === 'h') hud.classList.toggle('off'); });

  readScroll();
  resize();

  if (reduce) {
    intro.style.height = '100svh';
    // eased mitsetzen, nicht nur einmal zeichnen: das erste draw() läuft, bevor
    // ein Frame geladen ist, und der resize() danach zeichnet sonst wieder mit
    // eased = 0.
    target = eased = 1;
    draw(1);                              // letztes Bild, keine Bewegung
    // Ohne Scroll-Animation direkt den Endzustand zeigen: Video weg, Sterne da.
    canvas.style.opacity = '0';
    stageSky.style.opacity = '1';
    stageField.draw(0);
    sky.style.opacity = '1';
    skyField.draw(0);                     // Sterne stehen still, keine Bahn, kein Drehen
    shop.style.transform = 'none';
    shop.style.opacity = '1';
  } else {
    eased = target;
    requestAnimationFrame(tick);
  }
})();

// ---- Hintergrund: PROTOTYP, drei Varianten im Vergleich -------------------
// Frage: "wie bekommen wir den Grund heller als das alte Schwarz, ohne den
// Sternen-Kontrast zu verlieren, und was sieht dabei am meisten nach etwas
// aus?" Drei strukturell verschiedene Answers, per ?bg=a|b|c oder der Leiste
// unten umschaltbar. Wegwerfcode: nach der Entscheidung Gewinner behalten,
// die anderen zwei Varianten plus die Leiste wieder raus (siehe /prototype-
// Skill). Kein neues Build-Tooling, keine Lib - alles Vanilla Canvas/WebGL.
(() => {
  const VARIANTS = ['a', 'b', 'c', 'd'];
  const LABELS = {
    a: 'glaenzend — WebGL-Shader',
    b: 'Nebel — gemalte Blobs',
    c: 'minimal — Spotlicht',
    d: '21st.dev-Export — statisches CSS',
  };
  const params = new URLSearchParams(location.search);
  let variant = VARIANTS.includes(params.get('bg')) ? params.get('bg') : 'a';

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const glCanvas = document.getElementById('bgfx');
  const c2d = document.createElement('canvas');
  c2d.id = 'bgfx2d';
  c2d.setAttribute('aria-hidden', 'true');
  glCanvas.after(c2d);
  const ctx2d = c2d.getContext('2d');

  // ==== Variante A: glaenzender WebGL-Shader ================================
  // Ersatz fuer die shadergradient.co-Vorlage (React + Three.js): eigener,
  // abhaengigkeitsfreier WebGL-Shader statt der grossen Lib, weil die Seite
  // sonst kein Build-Tooling braucht. Farben sind aus der Vorlage uebernommen,
  // die Bewegung (Simplex-Noise, domain warp) ist eine eigene Annaeherung, kein
  // Nachbau der 3D-Plane mit Env-Reflexion.
  const FX_SPEED = 0.06;   // Zeit-Multiplikator, klein = ruhiger Fluss
  const FX_FREQ  = 1.6;    // Rauschfrequenz, groesser = kleinteiligere Blasen
  const FX_WARP  = 1.15;   // Staerke der Verzerrung durch das zweite Rauschfeld
  const FX_GRAIN = 0.035;  // Korn-Anteil, 0 = aus
  const FX_COLOR1 = [0x6c, 0x0b, 0xa9];   // --violet, aus der Vorlage
  const FX_COLOR2 = [0xc1, 0x42, 0xdb];
  const FX_COLOR3 = [0xba, 0x44, 0xe1];

  const canvas = glCanvas;
  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  const toUnit = c => c.map(v => v / 255);
  let glReady = false, glResize = () => {}, glFrame = () => {};

  if (gl) setupGl();

  function setupGl() {

  const vsSrc = `
    attribute vec2 aPos;
    void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
  `;

  // Simplex-Noise 3D nach Ian McEwan / Ashima Arts (webgl-noise, MIT-Lizenz,
  // https://github.com/ashima/webgl-noise) - Standardbaustein, keine eigene Erfindung.
  const fsSrc = `
    precision highp float;
    uniform vec2  uRes;
    uniform float uTime;
    uniform vec3  uColor1;
    uniform vec3  uColor2;
    uniform vec3  uColor3;

    vec3 mod289(vec3 x){return x - floor(x * (1.0/289.0)) * 289.0;}
    vec4 mod289(vec4 x){return x - floor(x * (1.0/289.0)) * 289.0;}
    vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
    vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}

    float snoise(vec3 v){
      const vec2 C = vec2(1.0/6.0, 1.0/3.0);
      const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
      vec3 i  = floor(v + dot(v, C.yyy));
      vec3 x0 = v - i + dot(i, C.xxx);
      vec3 g = step(x0.yzx, x0.xyz);
      vec3 l = 1.0 - g;
      vec3 i1 = min(g.xyz, l.zxy);
      vec3 i2 = max(g.xyz, l.zxy);
      vec3 x1 = x0 - i1 + C.xxx;
      vec3 x2 = x0 - i2 + C.yyy;
      vec3 x3 = x0 - D.yyy;
      i = mod289(i);
      vec4 p = permute(permute(permute(
                i.z + vec4(0.0, i1.z, i2.z, 1.0))
              + i.y + vec4(0.0, i1.y, i2.y, 1.0))
              + i.x + vec4(0.0, i1.x, i2.x, 1.0));
      float n_ = 0.142857142857;
      vec3 ns = n_ * D.wyz - D.xzx;
      vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
      vec4 x_ = floor(j * ns.z);
      vec4 y_ = floor(j - 7.0 * x_);
      vec4 x = x_ * ns.x + ns.yyyy;
      vec4 y = y_ * ns.x + ns.yyyy;
      vec4 h = 1.0 - abs(x) - abs(y);
      vec4 b0 = vec4(x.xy, y.xy);
      vec4 b1 = vec4(x.zw, y.zw);
      vec4 s0 = floor(b0)*2.0 + 1.0;
      vec4 s1 = floor(b1)*2.0 + 1.0;
      vec4 sh = -step(h, vec4(0.0));
      vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
      vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
      vec3 p0 = vec3(a0.xy, h.x);
      vec3 p1 = vec3(a0.zw, h.y);
      vec3 p2 = vec3(a1.xy, h.z);
      vec3 p3 = vec3(a1.zw, h.w);
      vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
      p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
      vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
      m = m * m;
      return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
    }

    void main(){
      vec2 uv = gl_FragCoord.xy / uRes.xy;
      vec2 p = (uv - 0.5) * vec2(uRes.x / uRes.y, 1.0);

      vec2 warp = vec2(
        snoise(vec3(p * ${FX_FREQ.toFixed(3)}, uTime)),
        snoise(vec3(p * ${FX_FREQ.toFixed(3)} + 5.2, uTime))
      ) * ${FX_WARP.toFixed(3)};

      float n = snoise(vec3((p + warp) * ${(FX_FREQ * 0.6).toFixed(3)}, uTime * 0.7));
      n = n * 0.5 + 0.5;

      // Schaerfere Kanten statt weichem Verlauf - wirkt eher nach glaenzender
      // Flaeche (shadergradient-Vorlage) als nach Wolke.
      vec3 col = mix(uColor1, uColor2, smoothstep(0.32, 0.42, n));
      col = mix(col, uColor3, smoothstep(0.58, 0.66, n));
      // Taeler im Rauschen selbst gehen auf Schwarz, nicht nur der Rand -
      // sonst wirkt die Flaeche wie eingefaerbt statt wie ein Glow im Dunkeln.
      col *= smoothstep(-0.3, 0.3, n);

      // Glanzlicht auf den Rauschkaemmen, wie eine Reflexion auf einer
      // gewoelbten Flaeche - ohne echtes 3D-Licht simuliert.
      float spec = pow(max(n, 0.0), 6.0);
      col += vec3(1.0, 0.96, 1.0) * spec * 0.6;

      // Verlauf zur schwarzen Vorlage: Glow links der Mitte, blendet zum Rand aus.
      float mask = smoothstep(0.62, 0.0, length(p - vec2(-0.25, 0.05)));
      col *= mask;

      float grain = fract(sin(dot(gl_FragCoord.xy + uTime * 60.0, vec2(12.9898, 78.233))) * 43758.5453);
      col += (grain - 0.5) * ${FX_GRAIN.toFixed(3)};

      gl_FragColor = vec4(col, 1.0);
    }
  `;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(s));
      return null;
    }
    return s;
  }

  const vs = compile(gl.VERTEX_SHADER, vsSrc);
  const fs = compile(gl.FRAGMENT_SHADER, fsSrc);
  if (!vs || !fs) return;

  const prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(prog));
    return;
  }
  gl.useProgram(prog);

  // Ein Dreieck ueber den ganzen Clip-Space, kein Rechteck aus zwei Dreiecken noetig.
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const uRes    = gl.getUniformLocation(prog, 'uRes');
  const uTime   = gl.getUniformLocation(prog, 'uTime');
  const uColor1 = gl.getUniformLocation(prog, 'uColor1');
  const uColor2 = gl.getUniformLocation(prog, 'uColor2');
  const uColor3 = gl.getUniformLocation(prog, 'uColor3');
  gl.uniform3fv(uColor1, toUnit(FX_COLOR1));
  gl.uniform3fv(uColor2, toUnit(FX_COLOR2));
  gl.uniform3fv(uColor3, toUnit(FX_COLOR3));

  glResize = function () {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width  = Math.round(innerWidth * dpr);
    canvas.height = Math.round(innerHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(uRes, canvas.width, canvas.height);
  };

  glFrame = function (tSec) {
    gl.uniform1f(uTime, tSec * FX_SPEED);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  };

  glReady = true;
  } // Ende setupGl()

  // ==== Variante B: gemalter Nebel (Canvas 2D) ==============================
  // Weiche, langsam driftende Blobs statt einer Formel - wirkt eher gemalt
  // als berechnet. 'lighter' laesst Ueberlappungen aufhellen wie echtes Licht.
  const NEB_BLOBS = [
    { color: '108,11,169', x: .32, y: .38, r: .48, ax: .07, ay: .05, per: 23, ph: 0 },
    { color: '193,66,219', x: .62, y: .52, r: .40, ax: .05, ay: .06, per: 31, ph: 2.1 },
    { color: '186,68,225', x: .48, y: .28, r: .34, ax: .04, ay: .07, per: 19, ph: 4.4 },
  ];

  function drawB(t) {
    const w = innerWidth, h = innerHeight;
    ctx2d.globalCompositeOperation = 'source-over';
    ctx2d.fillStyle = '#0E0712';
    ctx2d.fillRect(0, 0, w, h);
    ctx2d.globalCompositeOperation = 'lighter';
    for (const b of NEB_BLOBS) {
      const cx = (b.x + Math.sin(t / b.per + b.ph) * b.ax) * w;
      const cy = (b.y + Math.cos(t / b.per * 1.3 + b.ph) * b.ay) * h;
      const r = b.r * Math.min(w, h);
      const g = ctx2d.createRadialGradient(cx, cy, 0, cx, cy, r);
      g.addColorStop(0, `rgba(${b.color},.55)`);
      g.addColorStop(1, `rgba(${b.color},0)`);
      ctx2d.fillStyle = g;
      ctx2d.fillRect(cx - r, cy - r, r * 2, r * 2);
    }
    ctx2d.globalCompositeOperation = 'source-over';
  }

  // ==== Variante C: minimales Spotlicht (Canvas 2D) =========================
  // Ein einzelner weicher Lichtkegel, der langsam driftet und atmet - naeher
  // am alten Schwarz als A/B, aber nicht mehr flach.
  function drawC(t) {
    const w = innerWidth, h = innerHeight;
    ctx2d.fillStyle = '#0E0712';
    ctx2d.fillRect(0, 0, w, h);
    const cx = w * 0.5 + Math.sin(t / 40) * w * 0.08;
    const cy = h * 0.35 + Math.cos(t / 55) * h * 0.06;
    const pulse = 0.85 + Math.sin(t / 6) * 0.15;
    const r = Math.min(w, h) * 0.42 * pulse;
    const g = ctx2d.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, 'rgba(108,11,169,.5)');
    g.addColorStop(1, 'rgba(108,11,169,0)');
    ctx2d.fillStyle = g;
    ctx2d.fillRect(0, 0, w, h);
  }

  // ==== Variante D: 21st.dev-Gradient-Builder-Export (statisches CSS) =======
  // 1:1 aus dem gelieferten React-Snippet (Copy-CSS-Export von 21st.dev),
  // nur ohne React: zwei Elemente statt einer Komponente. Per JS erzeugt und
  // als style-Objekt gesetzt statt in die <style> zu schreiben - eine .css-
  // Datei parst das '%' in der Data-URI (width='100%') sonst als Fehler,
  // inline per style-Property (wie im React-Original) geht das Zeichen einfach
  // durch. Keine Animation: die Vorlage selbst ist ein statischer Verlauf.
  const dWrap = document.createElement('div');
  dWrap.id = 'bgfxD';
  dWrap.setAttribute('aria-hidden', 'true');
  Object.assign(dWrap.style, {
    position: 'fixed', inset: '0', zIndex: '-1',
    width: '100vw', height: '100vh',
    overflow: 'hidden', display: 'none',
  });

  const dGrad = document.createElement('div');
  Object.assign(dGrad.style, {
    position: 'absolute', inset: '0',
    backgroundColor: '#D7D5D5',
    backgroundImage:
      "url(\"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.280'/></svg>\"), radial-gradient(circle at 66.94% 46.43%, rgba(215, 213, 213, 1) 0%, rgba(215, 213, 213, 0.844) 19.02%, rgba(215, 213, 213, 0.5) 38.05%, rgba(215, 213, 213, 0.156) 57.07%, rgba(215, 213, 213, 0) 76.1%), radial-gradient(circle at 34.69% 66.31%, rgba(49, 5, 39, 1) 0%, rgba(49, 5, 39, 0.844) 12.73%, rgba(49, 5, 39, 0.5) 25.45%, rgba(49, 5, 39, 0.156) 38.18%, rgba(49, 5, 39, 0) 50.9%), radial-gradient(circle at 48.93% 19.32%, rgba(57, 5, 31, 1) 0%, rgba(57, 5, 31, 0.844) 16.75%, rgba(57, 5, 31, 0.5) 33.5%, rgba(57, 5, 31, 0.156) 50.25%, rgba(57, 5, 31, 0) 67%), radial-gradient(circle at 80.23% 87.54%, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0.844) 10.28%, rgba(255, 255, 255, 0.5) 20.55%, rgba(255, 255, 255, 0.156) 30.83%, rgba(255, 255, 255, 0) 41.1%)",
    backgroundSize: '120px 120px, auto, auto, auto, auto',
    backgroundBlendMode: 'overlay, normal, normal, normal, normal',
  });
  dWrap.appendChild(dGrad);

  const SVGNS = 'http://www.w3.org/2000/svg';
  const dSvg = document.createElementNS(SVGNS, 'svg');
  dSvg.setAttribute('aria-hidden', 'true');
  Object.assign(dSvg.style, {
    position: 'absolute', inset: '0', width: '100%', height: '100%',
    opacity: '0.280', mixBlendMode: 'overlay',
  });
  const dFilter = document.createElementNS(SVGNS, 'filter');
  dFilter.setAttribute('id', 'bgfx-d-grain');
  const dTurb = document.createElementNS(SVGNS, 'feTurbulence');
  dTurb.setAttribute('type', 'fractalNoise');
  dTurb.setAttribute('baseFrequency', '0.8');
  dTurb.setAttribute('numOctaves', '2');
  dTurb.setAttribute('stitchTiles', 'stitch');
  dFilter.appendChild(dTurb);
  const dColorMatrix = document.createElementNS(SVGNS, 'feColorMatrix');
  dColorMatrix.setAttribute('type', 'saturate');
  dColorMatrix.setAttribute('values', '0');
  dFilter.appendChild(dColorMatrix);
  dSvg.appendChild(dFilter);
  const dRect = document.createElementNS(SVGNS, 'rect');
  dRect.setAttribute('width', '100%');
  dRect.setAttribute('height', '100%');
  dRect.setAttribute('filter', 'url(#bgfx-d-grain)');
  dSvg.appendChild(dRect);
  dWrap.appendChild(dSvg);

  document.body.appendChild(dWrap);

  // ==== Umschalten + gemeinsame Schleife =====================================
  function resize2d() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    c2d.width  = Math.round(innerWidth * dpr);
    c2d.height = Math.round(innerHeight * dpr);
    ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function applyVariant() {
    const useGl = variant === 'a' && glReady;
    const useCss = variant === 'd';
    glCanvas.style.display = useGl ? 'block' : 'none';
    c2d.style.display = (!useGl && !useCss) ? 'block' : 'none';
    dWrap.style.display = useCss ? 'block' : 'none';
  }

  function resizeAll() {
    if (glReady) glResize();
    resize2d();
  }

  function frame(tSec) {
    if (variant === 'a' && glReady) glFrame(tSec);
    else if (variant === 'b') drawB(tSec);
    else if (variant === 'c') drawC(tSec);
    // 'd' ist statisches CSS, hier gibt es nichts zu zeichnen.
  }

  addEventListener('resize', resizeAll, { passive: true });
  resizeAll();
  applyVariant();

  if (reduce) {
    frame(0);   // Standbild, keine Bewegung
  } else {
    // Pausiert im Hintergrund-Tab: spart Akku, ohne dass es irgendwer sieht.
    (function loop(t) {
      if (!document.hidden) frame(t / 1000);
      requestAnimationFrame(loop);
    })(0);
  }

  // ---- Vergleichsleiste (PROTOTYP, siehe Kommentar oben) -------------------
  const bar = document.createElement('div');
  bar.id = 'bgSwitcher';
  bar.innerHTML = '<button id="bgPrev" aria-label="vorherige Variante">‹</button>' +
                  '<span id="bgLabel"></span>' +
                  '<button id="bgNext" aria-label="naechste Variante">›</button>';
  document.body.appendChild(bar);
  const bgLabel = document.getElementById('bgLabel');

  function updateLabel() {
    bgLabel.textContent = variant.toUpperCase() + ' — ' + LABELS[variant];
  }

  function setVariant(v) {
    variant = v;
    history.replaceState(null, '', '?bg=' + v + location.hash);
    applyVariant();
    updateLabel();
  }

  function cycle(dir) {
    const i = VARIANTS.indexOf(variant);
    setVariant(VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length]);
  }

  document.getElementById('bgPrev').onclick = () => cycle(-1);
  document.getElementById('bgNext').onclick = () => cycle(1);
  addEventListener('keydown', e => {
    const t = document.activeElement.tagName;
    if (t === 'INPUT' || t === 'TEXTAREA' || document.activeElement.isContentEditable) return;
    if (e.key === 'ArrowLeft') cycle(-1);
    if (e.key === 'ArrowRight') cycle(1);
  });
  updateLabel();
})();
</script>
</body>
</html>
