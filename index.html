<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jakob — Vorschau Scroll-Intro</title>
<style>
  :root {
    --ground:      #0E0712;
    --violet:      #6C0BA9;
    --violet-lift: #A939EF;
    --amber:       #FAA52E;
    --text:        #F3EEF8;
    --text-muted:  #A297AE;

    --stage-h: 100svh;

    /* Hoehe der festen Leiste. Startwert fuer den Fall ohne JS; resize() setzt
       den gemessenen Wert. Verlauf, Shop-Abstand und Sternenfeld haengen alle
       an dieser einen Zahl - vorher standen dafuer 110, 118 und 90 nebeneinander. */
    --nav-h: 118px;

    /* Bühnenlicht hinter der Sequenz. 0 = aus, schwarzer Grund wie in der
       Sternen-Vorschau. Zurück auf .55 holt den violetten Wash wieder. */
    --wash: 0;

    /* Platzhalter für die Navigationsschrift. shihiko.com nutzt NB Architekt Std
       (Neubau, kostenpflichtig) — die liegt hier bewusst nicht bei. Sobald die
       echte Schrift da ist: selbst hosten und nur diese Zeile tauschen. */
    --font-nav: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }

  /* Metal Mania — dieselbe Schriftart wie unter dem Stern in der Animation.
     SIL Open Font License 1.1, Rodrigo Fuenzalida. Liegt selbst im Projekt,
     wird nicht von Google nachgeladen: ein Hotlink auf fonts.gstatic.com
     überträgt die IP jedes Besuchers (LG München I, 3 O 17493/20). */
  @font-face {
    font-family: "Metal Mania";
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url("fonts/metal-mania-latin.woff2") format("woff2");
  }

  * { box-sizing: border-box; }

  /* Kein scroll-padding-top: jeder Abschnitt bringt oben selbst genug Abstand
     mit, um unter der festen Leiste hervorzukommen (siehe .shop). Beides
     zusammen zaehlte den Versatz doppelt. Ein kuenftiger Abschnitt ohne
     eigenen Abstand braucht ein scroll-margin-top. */
  html { scroll-behavior: auto; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--text);
    font-family: "Helvetica Neue", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Intro ---------- */

  /* Höhe des Spacers = wie weit man scrollt, um die Sequenz durchzuspielen.
     360 statt 520: fuenf volle Wischer auf dem Handy sind zu viel Weg bis zum
     ersten Artikel. Eine Zahl, kein Umbau.
     svh statt vh: die Buehne ist 100svh. Mit vh (= grosser Viewport) waere der
     Scrollweg auf dem Handy rund 17 % laenger als am Desktop, weil lvh dort
     etwa 12 % ueber svh liegt. */
  .intro { height: 360svh; position: relative; }

  .stage {
    position: sticky;
    top: 0;
    height: var(--stage-h);
    overflow: hidden;
    display: grid;
    place-items: center;
    background: var(--ground);
  }

  /* Violettes Bühnenlicht hinter der Sequenz — füllt jede Bildbreite,
     weil es CSS ist und nicht Teil des Videos */
  .stage::before {
    content: "";
    position: absolute;
    inset: -20%;
    background:
      radial-gradient(ellipse 50% 40% at 50% 45%, color-mix(in srgb, var(--violet) 55%, transparent), transparent 70%),
      radial-gradient(ellipse 70% 50% at 50% 100%, color-mix(in srgb, var(--violet) 30%, transparent), transparent 70%);
    filter: blur(40px);
    opacity: var(--wash);
    pointer-events: none;
  }

  /* Sternenfeld: der Hintergrund des Shops, deckt dessen ganze Box ab.
     Erst war das sticky mit fester Fensterhoehe. Gemessen war das falsch: der
     Shop liess nur 88 px Scrollspielraum, ein sticky Element ohne Spielraum
     klebt nicht, und durch das padding-top begann das Canvas 309 px zu tief -
     oben blieb ein sternenloser Streifen.
     ponytail: der Puffer ist so hoch wie der Shop. Bei drei Artikeln ist das
     unkritisch; wird der Shop mehrere Bildschirme lang, wieder auf ein
     fensterhohes Canvas mit eigener Scrollverrechnung umbauen. */
  .starfield {
    position: absolute;
    inset: 0;
    z-index: 0;
    display: block;
    width: 100%;
    height: 100%;
    opacity: 0;
    pointer-events: none;
  }
  /* Der Inhalt muss positioniert sein, sonst malt das Canvas darueber:
     innerhalb eines Stapelkontexts liegen positionierte Elemente mit z-index 0
     ueber dem Text nicht positionierter Bloecke. */
  .shop > :not(.starfield) { position: relative; z-index: 1; }

  /* Liegt vor dem Sternenfeld und hinter dem Schriftzug. Die Deckkraft setzt
     die Schleife: das Video blendet ab, statt zur Karte zu werden. */
  .seq {
    position: relative;
    z-index: 2;
    display: block;
    width: 100%;
    height: 100%;
  }

  /* Standbild, solange die Sequenz lädt — nie eine leere Seite */
  .poster {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    /* contain, nicht cover: das Canvas schneidet hochkant ebenfalls nicht mehr
       voll zu, ein cover-Poster würde beim Wechsel sichtbar springen. */
    object-fit: contain;
    transition: opacity .4s ease;
  }
  .ready .poster { opacity: 0; }

  .hint {
    position: absolute;
    left: 50%; bottom: 3svh;
    transform: translateX(-50%);
    font-size: .75rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--text-muted);
    transition: opacity .3s;
  }

  /* ---------- Menüleiste ---------- */

  /* Nach meinhardtaxer.com: kein Balken, keine Kerbe. Die Navigation steht
     nackt auf dem Grund, Wortmarke links, gruppierte Spalten rechts, alles
     klein geschrieben und eng laufend statt versal und gesperrt.
     Fest verankert, ab dem ersten Pixel sichtbar. */
  .navbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: clamp(16px, 4vw, 64px);
    padding: 26px clamp(16px, 2.2vw, 34px) 0;
    color: #D9D9D9;                    /* wie die Referenz: nicht Reinweiß */
    pointer-events: none;              /* der Verlauf faengt sonst Klicks ab */
  }
  .navbar a { pointer-events: auto; }

  /* Den Verlauf hat die Referenz nicht — sie braucht ihn auch nicht, weil dort
     meist Schwarz unter der Leiste liegt. Bei uns laeuft ein Video darunter.
     Ueber alle 176 Frames gemessen: OHNE Verlauf faellt der Kontrast auf 1,00,
     die Navigation waere stellenweise unsichtbar.
     Die Staerke ist gerechnet, nicht geschaetzt: Schrift rgb(217) auf einem
     reinweissen Pixel haelt 4,5:1 erst ab 63 % Schwaerzung. Deshalb bleibt der
     Verlauf bis 60 % seiner Hoehe bei rund .70 und faellt erst darunter ab.
     Das Plateau muss unter den tiefsten Link reichen: bei einem Abfall ab 44 %
     lag 'warenkorb' schon im duenner werdenden Teil, und genau dort fielen
     noch 3 Frames durch.
     Nach der Korrektur: 0 von 176 Frames unter 4,5:1. */
  .navbar::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    /* Die Stopps haengen an --nav-h, nicht an Prozenten: die Leiste ist auf
       320 px 138 px hoch und bricht um, auf dem Desktop ist sie 118 px flach.
       Mit festen Prozenten sass die unterste Linkzeile auf 320 px im
       auslaufenden Teil des Verlaufs — dort fielen 16 von 88 Frames durch. */
    height: calc(var(--nav-h) + 110px);
    background: linear-gradient(to bottom,
      rgb(0 0 0 / .74) 0,
      rgb(0 0 0 / .70) var(--nav-h),
      rgb(0 0 0 / .22) calc(var(--nav-h) + 70px),
      transparent 100%);
    pointer-events: none;
    z-index: -1;
  }

  .wordmark {
    font-family: "Metal Mania", var(--font-nav);
    font-size: clamp(24px, 2.1vw, 34px);
    line-height: 1;
    font-weight: 400;
    color: inherit;
    text-decoration: none;
    white-space: nowrap;
  }

  .navcols { display: flex; gap: clamp(18px, 3.2vw, 60px); }
  .navcol  { display: flex; flex-direction: column; }

  /* Rubrik und Links unterscheiden sich nur in der Groesse, nicht in Farbe oder
     Schnitt — genau wie in der Referenz (11 px gegen 16 px, beide 400). */
  /* Leichte Spanne statt fester px: 15 px wirken auf 2560 verloren. Nach oben
     eng begrenzt, damit die Leiste Bedienelement bleibt und nicht zu Inhalt wird. */
  .navlabel { font-size: clamp(11px, .62vw, 13px); opacity: .62; margin-bottom: 9px; }
  .navbar a:not(.wordmark) { font-size: clamp(14px, .85vw, 18px); line-height: 1.42; }

  .navbar :where(.navlabel, a:not(.wordmark)) {
    font-family: var(--font-nav);
    letter-spacing: -.01em;            /* eng, nicht gesperrt */
    text-transform: none;              /* klein geschrieben */
  }
  .navbar a { color: inherit; text-decoration: none; }
  .navbar a:not(.wordmark):hover { opacity: .6; }
  .cart { margin-top: 6px; }

  /* Handy: drei Spalten passen nicht auf 320 px. Die Rubriken fallen weg, die
     Links stehen in einer Zeile — mehr traegt die Breite nicht, und ein
     Aufklappmenue waere neue Mechanik fuer drei Handvoll Links. */
  /* Auch nach Hoehe, nicht nur nach Breite: bei 844x390 im Querformat greift
     eine reine Breitenabfrage nicht, und die dreispaltige Leiste frisst dort
     118 von 390 px - fast ein Drittel des Bildschirms. */
  @media (max-width: 700px), (max-height: 500px) {
    .navbar { padding-top: 18px; gap: 12px; }
    .navlabel { display: none; }
    .navcol  { flex-direction: row; gap: 14px; }
    .navcols { gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
    .navbar a:not(.wordmark) { font-size: clamp(13px, 3.4vw, 15px); }
    .cart { margin-top: 0; }
  }

  /* ---------- Shop ---------- */

  .shop {
    position: relative;
    z-index: 2;
    min-height: 100svh;
    /* Oben zusaetzlich die Leistenhoehe, sonst laeuft die Ueberschrift darunter. */
    padding: calc(var(--nav-h) + clamp(2rem, 6svh, 5rem))
             clamp(1.25rem, 5vw, 5rem)
             clamp(3rem, 10svh, 8rem);
    background: var(--ground);
    /* Startwert ohne JS: vollständig sichtbar. Verstecken darf nur JS. */
    opacity: 1;
    will-change: transform, opacity;
  }

  .shop h2 {
    margin: 0 0 .6em;
    font-size: clamp(1.75rem, 5vw, 3.5rem);
    letter-spacing: -.03em;
    text-transform: uppercase;
  }
  .shop p { color: var(--text-muted); max-width: 48ch; line-height: 1.6; margin: 0 0 clamp(1rem, 3svh, 2.5rem); }

  .grid {
    display: grid;
    gap: clamp(1rem, 2.5vw, 2rem);
    grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr));
    max-width: 1200px;
  }
  /* Deckend, nicht durchscheinend: mit dem Sternenfeld dahinter wuerden sonst
     Sterne durch die Produktkacheln ziehen. */
  .card {
    border: 1px solid color-mix(in srgb, var(--violet-lift) 25%, transparent);
    border-radius: 4px;
    padding: 1.25rem;
    background: color-mix(in srgb, var(--violet) 8%, var(--ground));
  }
  .card .ph {
    aspect-ratio: 4/5;
    background:
      radial-gradient(ellipse at 50% 40%, color-mix(in srgb, var(--violet-lift) 35%, transparent), transparent 70%),
      var(--ground);
    border-radius: 2px;
    margin-bottom: 1rem;
  }
  .card h3 { margin: 0 0 .35rem; font-size: 1rem; font-weight: 600; letter-spacing: .01em; }
  .card .price { color: var(--text-muted); font-size: .9rem; }
  .buy {
    margin-top: 1rem; width: 100%;
    background: var(--amber); color: var(--ground);
    border: 0; border-radius: 3px; padding: .8rem 1rem;
    font: inherit; font-weight: 700; letter-spacing: .02em;
    cursor: pointer;
  }

  /* ---------- Dev-Anzeige ---------- */
  .hud {
    position: fixed; right: 10px; bottom: 10px; z-index: 99;
    font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #000a; color: var(--amber);
    padding: 6px 9px; border-radius: 3px;
    border: 1px solid #fff2;
    pointer-events: none;
    white-space: pre;
  }
  .hud.off { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .hint { display: none; }
  }
</style>
</head>
<body>

<!-- Steht ab dem ersten Pixel und bleibt stehen. Deshalb braucht die Seite
     keine Vorschaltseite: die Identität ist sofort da, das Video ist
     Kopfbereich statt Tor. -->
<header class="navbar" id="navbar">
  <a class="wordmark" href="#top">Rutger</a>
  <!-- ponytail: alle Ziele ausser dem Shop sind Platzhalter und zeigen auf
       sich selbst. Sobald die Seitenstruktur steht, bekommen sie echte Ziele. -->
  <nav class="navcols">
    <div class="navcol">
      <span class="navlabel">shop</span>
      <a href="#shop">alle artikel</a>
      <a href="#shop">kategorien</a>
      <a href="#shop">drops</a>
    </div>
    <div class="navcol">
      <span class="navlabel">mehr</span>
      <a href="#">archiv</a>
      <a href="#">vip</a>
    </div>
    <div class="navcol">
      <span class="navlabel">kontakt</span>
      <a href="#">instagram</a>
      <a href="#">e-mail</a>
      <a href="#" class="cart">warenkorb (0)</a>
    </div>
  </nav>
</header>

<section class="intro" id="intro">
  <div class="stage" id="stage">
    <img class="poster" id="poster" src="frames/001.jpg" alt="">
    <canvas class="seq" id="seq"></canvas>
    <div class="hint" id="hint">scrollen</div>
  </div>
</section>

<section class="shop" id="shop">
  <!-- Sternenfeld liegt jetzt hier, hinter dem Shop-Inhalt. -->
  <canvas class="starfield" id="starfield" aria-hidden="true"></canvas>
  <h2>Shop</h2>
  <p>Platzhalter. Hier stehen später 2–3 Artikel mit Größen, angebunden an Stripe Checkout.</p>
  <div class="grid">
    <div class="card"><div class="ph"></div><h3>Shirt — Tour</h3><div class="price">30,00 €</div><button class="buy">In den Warenkorb</button></div>
    <div class="card"><div class="ph"></div><h3>Hoodie</h3><div class="price">65,00 €</div><button class="buy">In den Warenkorb</button></div>
    <div class="card"><div class="ph"></div><h3>Vinyl</h3><div class="price">25,00 €</div><button class="buy">In den Warenkorb</button></div>
  </div>
</section>


<div class="hud" id="hud">–</div>

<script>
(() => {
  // ---- Stellschrauben ---------------------------------------------------
  const FRAME_COUNT = 176;
  const FRAME_PATH  = i => `frames/${String(i).padStart(3, '0')}.jpg`;

  const DAMPING  = 0.085;  // kleiner = schwerer/träger
  const CAM_PUSH = 0.06;   // Hineinfahrt. Klein halten: das Material fährt schon selbst

  // Die Sequenz läuft über den ganzen Scrollweg der Intro und bleibt dabei
  // formatfüllend. Sie wird nicht zur Karte und blendet nicht in einen Titel:
  // das Menü steht ab dem ersten Pixel, die Seite braucht also kein
  // Vorschaltbild. Am Ende schiebt sich der Shop einfach darüber.
  // Frühere Zustände hängen am Tag `stand-video-als-karte`.

  // Wie viel Bildbreite mindestens stehen bleiben muss. Das Material ist quer
  // (16:9), ein Handy hochkant ist 9:19,5 — ohne Grenze schneidet `cover` 74 %
  // der Breite weg und zieht den Rest 3,7× auf. Statt dessen füllt --ground
  // oben und unten auf.
  const MIN_VIS = 0.55;

  const SHOP_RISE  = 80;   // px, aus denen der Shop hochkommt
  const SHOP_SCALE = 0.94; // Startgröße des Shops

  // Sterne. Werte sind an einer 1920 breiten Bühne festgelegt und werden unten
  // mit der tatsächlichen Bildbreite heruntergerechnet. Sie sind jetzt der
  // Hintergrund des Shops, nicht mehr das Endbild der Intro.
  const ST_SRC    = 'stars.webp';
  const ST_COLS   = 12, ST_ROWS = 10, ST_TILE = 224;
  const ST_FRAMES = ST_COLS * ST_ROWS;   // 120 Bilder = eine volle Umdrehung
  const ST_FPS    = 15;
  const ST_N      = 25;        // Anzahl bei 1920×945
  const ST_MAX    = 250;       // Größe des größten Sterns bei 1920 breit
  const ST_DEPTH  = 0.75;      // 0 = alle gleich groß, 1 = fast alle winzig
  const ST_DRIFT  = 2.3;
  const ST_AXIS   = 26 * Math.PI / 180;   // gemeinsame Driftachse
  const ST_GAP    = 16;        // Mindestluft zwischen zwei Sternbahnen
  const ST_SEED   = 20260825;
  // Gemessen, nicht geschätzt: der weiteste undurchsichtige Punkt einer Kachel
  // liegt bei 0.523 × Kachelbreite vom Mittelpunkt.
  const ST_RADIUS = 0.53;
  // -----------------------------------------------------------------------

  const canvas = document.getElementById('seq');
  const ctx    = canvas.getContext('2d', { alpha: true });
  const intro  = document.getElementById('intro');
  const stage  = document.getElementById('stage');
  const shop   = document.getElementById('shop');
  const navbar = document.getElementById('navbar');
  const hint   = document.getElementById('hint');
  const hud    = document.getElementById('hud');

  const clamp01 = v => Math.min(1, Math.max(0, v));
  const reduce  = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const frames = [];
  let loaded = 0, ready = false;
  let target = 0, eased = 0;
  let iw = 0, ih = 0;
  // Maße in CSS-Pixeln plus das dpr, mit dem der Puffer angelegt wurde. Nicht in
  // draw() neu auslesen — sonst driften Puffer und Anzeige auseinander, sobald
  // sich Fenstergröße oder Zoom ändern.
  let cssW = 0, cssH = 0, dprUsed = 1;

  // ---- Sterne -----------------------------------------------------------
  const sky    = document.getElementById('starfield');
  const skyCtx = sky.getContext('2d');
  const sheet  = new Image();
  let sheetOk = false, stars = [], starInfo = '–';
  let skyW = 0, skyH = 0;

  sheet.decoding = 'async';
  sheet.onload = () => { sheetOk = true; drawStars(0); };
  sheet.src = ST_SRC;

  const rand = seed => () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;

  function layoutStars() {
    if (!skyW || !skyH) return;

    // Alles hängt an der Bildbreite: auf dem Handy weniger und kleinere Sterne,
    // sonst stehen 25 Stück auf 390 px übereinander.
    const k    = Math.min(1, Math.max(0.42, skyW / 1920));
    const dens = Math.min(1, Math.max(0.35, (skyW * skyH) / (1920 * 945)));
    const n    = Math.max(4, Math.round(ST_N * dens));
    const maxS = ST_MAX * k;

    // Einzige Sperrfläche ist das Menü. Der Shop-Inhalt liegt darüber und die
    // Kacheln sind deckend, dort dürfen die Sterne also durchziehen.
    const navH = (navbar.offsetHeight || 90) + 16;

    const r = rand(ST_SEED);
    const expo = 1 + ST_DEPTH * 4;
    const cand = Array.from({ length: n }, (_, i) => {
      const u    = r();
      const f    = 0.14 + 0.86 * Math.pow(u, expo);   // Potenzverteilung: viele winzige
      const size = maxS * f;
      // Parallaxe: groß = nah = legt mehr Weg zurück. Gedeckelt auf 70 % der
      // eigenen Größe — darüber wandert ein Stern nicht mehr, er hüpft.
      const amp  = Math.min(ST_DRIFT * k * (6 + size * 0.34), size * 0.70);
      return {
        i, size, amp,
        R:     size * ST_RADIUS + amp,      // Bahnradius: Stern plus sein ganzer Weg
        alpha: 0.40 + 0.60 * f,             // klein = hinten = blasser
        rot:   (r() * 2 - 1) * 0.45,
        spin:  (r() * 2 - 1) * 0.04,
        flip:  r() < 0.5 ? -1 : 1,
        ph:    r() * Math.PI * 2,
        per:   16 + r() * 26,
        off:   Math.floor(r() * ST_FRAMES)  // Frameversatz: kein Gleichschritt
      };
    });
    cand.sort((a, b) => b.R - a.R);         // Große zuerst, die sind am schwersten unterzubringen

    const out = [];
    for (const c of cand) {
      const pr = rand(ST_SEED + c.i * 7919);
      let ok = false;
      for (let gap = ST_GAP; gap >= 0 && !ok; gap -= 4) {   // notfalls Luft verkleinern
        for (let tries = 0; tries < 400; tries++) {
          // Mittelpunkt liegt immer im Bild, der Stern darf über den Rand
          // hinausragen — angeschnitten am Rand sieht gut aus und schafft Platz.
          const x = pr() * skyW;
          const y = navH + pr() * (skyH - navH);
          // Abstand zu allen schon gesetzten. Die Bahnen sind geschlossen, also
          // reicht diese eine Prüfung, damit sich nie zwei Sterne überlappen.
          let hit = false;
          for (const o of out) {
            const need = c.R + o.R + gap;
            if ((x - o.x) ** 2 + (y - o.y) ** 2 < need * need) { hit = true; break; }
          }
          if (hit) continue;
          out.push(Object.assign({}, c, { x, y })); ok = true; break;
        }
      }
      // Kein Platz gefunden -> der Stern fällt weg. Lieber einer weniger als zwei übereinander.
    }
    stars = out;

    // Selbstprüfung: die Bahnen dürfen sich nie schneiden. Fällt das durch,
    // stimmt die Platzierungslogik nicht — und man sieht es nur zufällig.
    let worst = Infinity;
    for (let a = 0; a < out.length; a++)
      for (let b = a + 1; b < out.length; b++)
        worst = Math.min(worst, Math.hypot(out[a].x - out[b].x, out[a].y - out[b].y)
                                - (out[a].R + out[b].R));
    starInfo = `Sterne ${out.length}/${n}, Luft ${out.length > 1 ? Math.round(worst) : '–'} px`;
    if (out.length > 1 && worst < 0) console.error('Sternbahnen überlappen:', worst);
  }

  function drawStars(t) {
    if (!sheetOk) return;
    skyCtx.clearRect(0, 0, skyW, skyH);
    const base = Math.floor(t * ST_FPS);
    const ca = Math.cos(ST_AXIS), sa = Math.sin(ST_AXIS);
    for (const st of stars) {
      // Geschlossene Ellipsenbahn, lang entlang der gemeinsamen Achse, flach quer
      // dazu. Geschlossen heißt: der Stern verlässt seinen Radius nie.
      const a = t / st.per * Math.PI * 2 + st.ph;
      const u = Math.cos(a) * st.amp, w = Math.sin(a) * st.amp * 0.32;
      const fi = (base + st.off) % ST_FRAMES;
      const sx = (fi % ST_COLS) * ST_TILE, sy = ((fi / ST_COLS) | 0) * ST_TILE;

      skyCtx.save();
      skyCtx.globalAlpha = st.alpha;
      skyCtx.translate(st.x + u * ca - w * sa, st.y + u * sa + w * ca);
      skyCtx.rotate(st.rot + t * st.spin);
      skyCtx.scale(st.flip, 1);
      skyCtx.drawImage(sheet, sx, sy, ST_TILE, ST_TILE, -st.size / 2, -st.size / 2, st.size, st.size);
      skyCtx.restore();
    }
  }

  // ---- Laden ------------------------------------------------------------
  for (let i = 1; i <= FRAME_COUNT; i++) {
    const img = new Image();
    img.decoding = 'async';
    img.src = FRAME_PATH(i);
    img.onload = () => {
      if (!iw) {
        iw = img.naturalWidth; ih = img.naturalHeight;
        resize();
        stage.classList.add('ready');   // Poster weg, sobald EIN Frame steht
      }
      if (++loaded === FRAME_COUNT) ready = true;
    };
    frames.push(img);
  }

  // ---- Zeichnen ---------------------------------------------------------
  function resize() {
    dprUsed = Math.min(devicePixelRatio || 1, 2);   // bei 2 gedeckelt
    // Gemessen statt geschaetzt: die Leiste ist auf dem Handy flacher, und
    // Shop-Abstand wie Ankerziel haengen beide an dieser einen Zahl.
    // Ueberschreibt den Startwert aus :root mit der gemessenen Hoehe. Die Leiste
    // bricht auf schmalen Bildschirmen um und ist dann hoeher.
    document.documentElement.style.setProperty('--nav-h', navbar.offsetHeight + 'px');
    const r = stage.getBoundingClientRect();
    cssW = r.width; cssH = r.height;
    canvas.width  = Math.round(cssW * dprUsed);
    canvas.height = Math.round(cssH * dprUsed);
    ctx.setTransform(dprUsed, 0, 0, dprUsed, 0, 0);

    // Das Sternenfeld hat eine eigene Größe: es klebt im Shop und ist immer nur
    // fensterhoch, egal wie lang der Shop wird.
    const s = sky.getBoundingClientRect();
    skyW = s.width; skyH = s.height;
    sky.width  = Math.round(skyW * dprUsed);
    sky.height = Math.round(skyH * dprUsed);
    skyCtx.setTransform(dprUsed, 0, 0, dprUsed, 0, 0);
    layoutStars();
    // Das Setzen von sky.width hat das Canvas geleert. In Bewegung zeichnet die
    // Schleife im nächsten Bild nach — bei reduzierter Bewegung niemand, deshalb hier.
    // Dort mit fester Zeit 0, sonst haengt das Standbild an der Uhr und ein
    // spaeteres resize() zeichnet eine andere Sternstellung.
    drawStars(reduce ? 0 : performance.now() / 1000);

    draw(eased);
  }

  function draw(t) {
    if (!iw || !cssW) return;

    const idx = Math.min(FRAME_COUNT - 1, Math.max(0, Math.round(t * (FRAME_COUNT - 1))));
    const img = frames[idx];
    if (!img.complete || !img.naturalWidth) return;

    // Volle Breite, Höhe nur so weit, dass MIN_VIS der Bildbreite stehen bleibt.
    const asp = iw / ih;
    const bw = cssW;
    const bh = Math.min(cssH, cssW / (MIN_VIS * asp));
    const bx = 0, by = (cssH - bh) / 2;

    const sc = Math.max(bw / iw, bh / ih) * (1 + CAM_PUSH * t);
    const w = iw * sc, h = ih * sc;

    ctx.clearRect(0, 0, cssW, cssH);
    ctx.save();
    ctx.beginPath();
    ctx.rect(bx, by, bw, bh);
    ctx.clip();
    ctx.drawImage(img, bx + (bw - w) / 2, by + (bh - h) / 2, w, h);
    ctx.restore();

    hud.textContent =
      'Frame ' + (idx + 1) + ' / ' + FRAME_COUNT + '\n' +
      'Sequenz ' + (t * 100).toFixed(1) + ' %\n' +
      (ready ? 'geladen' : 'lädt ' + loaded + '/' + FRAME_COUNT) + '\n' +
      starInfo + '\n' +
      'h = Anzeige';
  }

  // ---- Scroll ----------------------------------------------------------
  function readScroll() {
    const rect = intro.getBoundingClientRect();
    const total = intro.offsetHeight - stage.offsetHeight;
    target = total <= 0 ? 0 : Math.min(1, Math.max(0, -rect.top / total));
  }

  function tick() {
    eased += (target - eased) * DAMPING;
    if (Math.abs(target - eased) < 0.0002) eased = target;

    draw(eased);
    hint.style.opacity = String(Math.max(0, 1 - eased * 6));

    // Shop kommt von unten hoch, die Sterne blenden mit ihm auf.
    const r = shop.getBoundingClientRect();
    const p = clamp01(1 - r.top / innerHeight);
    if (p >= 1) {
      shop.style.transform = 'none';        // scharf und bedienbar, sobald angekommen
      shop.style.opacity = '1';
    } else {
      shop.style.transform =
        `translateY(${(1 - p) * SHOP_RISE}px) scale(${SHOP_SCALE + p * (1 - SHOP_SCALE)})`;
      shop.style.opacity = String(Math.max(0.15, p));
    }

    // Nur zeichnen, wenn der Shop überhaupt im Bild ist. Sonst liefe die
    // Sternenschleife die ganze Intro über mit und kostete durchgehend Akku.
    const sichtbar = r.top < innerHeight && r.bottom > 0;
    sky.style.opacity = String(p);
    if (sichtbar && p > 0) drawStars(performance.now() / 1000);

    requestAnimationFrame(tick);
  }

  addEventListener('scroll', readScroll, { passive: true });   // kein preventDefault
  // ResizeObserver statt nur window.resize: fängt auch Layout- und Zoomänderungen,
  // die kein resize-Event auslösen.
  new ResizeObserver(() => { resize(); readScroll(); }).observe(stage);
  addEventListener('keydown', e => { if (e.key === 'h') hud.classList.toggle('off'); });

  readScroll();
  resize();

  if (reduce) {
    intro.style.height = '100svh';
    // eased mitsetzen, nicht nur einmal zeichnen: das erste draw() läuft, bevor
    // ein Frame geladen ist, und der resize() danach zeichnet sonst wieder mit
    // eased = 0.
    target = eased = 1;
    draw(1);                              // letztes Bild, keine Bewegung
    sky.style.opacity = '1';
    drawStars(0);                         // Sterne stehen still, keine Bahn, kein Drehen
    shop.style.transform = 'none';
    shop.style.opacity = '1';
  } else {
    eased = target;
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
