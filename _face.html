      glU[nm] = gl.getUniformLocation(glProg, nm);
    glU.uAcc   = gl.getUniformLocation(glVoll, 'uAcc');
    glU.uRampe = gl.getUniformLocation(glVoll, 'uRampe');

    // Farbrampe als 256x1-Textur. `rampe` liegt als 0xAABBGGRR vor.
    const rgba = new Uint8Array(256 * 4);
    for (let i = 0; i < 256; i++) {
      const v = rampe[i];
      rgba[i * 4]     =  v         & 255;
      rgba[i * 4 + 1] = (v >>> 8)  & 255;
      rgba[i * 4 + 2] = (v >>> 16) & 255;
      rgba[i * 4 + 3] = 255;
    }
    const glatt = (t) => {
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    };
    glRampe = gl.createTexture();
    glatt(glRampe);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 256, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, rgba);
    glSpur = gl.createTexture(); glatt(glSpur);

    for (const nm of ['aPos', 'aVar', 'aPh']) glBuf[nm] = gl.createBuffer();
    gl.disable(gl.DEPTH_TEST);
    return true;
  }

  // Groesse der Zeichenflaeche und das Ziel fuer den ersten Durchgang.
  function glMasse(w, h) {
    if (glW === w && glH === h) return;
    glW = w; glH = h; gcv.width = w; gcv.height = h;
    if (glTex) { gl.deleteTexture(glTex); gl.deleteFramebuffer(glFbo); }
    glTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, glTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R16F, w, h, 0, gl.RED, gl.HALF_FLOAT, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    glFbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, glFbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, glTex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  // EINMAL je Aufbau: die statischen Punktdaten in die Puffer.
  function glFuellen() {
    const P = new Float32Array(n * 4), V = new Float32Array(n * 4), Ph = new Float32Array(n * 2);
    for (let i = 0; i < n; i++) {
      P[i * 4] = Dx[i]; P[i * 4 + 1] = Dy[i]; P[i * 4 + 2] = Dzc[i]; P[i * 4 + 3] = DzcB[i];
      V[i * 4] = Dh[i]; V[i * 4 + 1] = Dd[i]; V[i * 4 + 2] = Dr1[i]; V[i * 4 + 3] = Dr2[i];
      Ph[i * 2] = Ep[i] / 1024; Ph[i * 2 + 1] = Ee[i] / 255;
    }
    gl.useProgram(glProg);
    const lade = (nm, feld, gr) => {
      gl.bindBuffer(gl.ARRAY_BUFFER, glBuf[nm]);
      gl.bufferData(gl.ARRAY_BUFFER, feld, gl.STATIC_DRAW);
      const l = gl.getAttribLocation(glProg, nm);
      gl.enableVertexAttribArray(l);
      gl.vertexAttribPointer(l, gr, gl.FLOAT, false, 0, 0);
    };
    lade('aPos', P, 4); lade('aVar', V, 4); lade('aPh', Ph, 2);
    glLeer = new Float32Array(gw * gh);
  }

  function glZeichnen(dis, ein, wi) {
    gl.useProgram(glProg);
    gl.bindFramebuffer(gl.FRAMEBUFFER, glFbo);
    gl.viewport(0, 0, glW, glH);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);        // reines Addieren, wie `acc` im CPU-Pfad

    const spur = spurAktiv ? SPUR : 0;
    gl.uniform2f(glU.uSchirm, glW, glH);
    gl.uniform2f(glU.uDreh, Math.cos(wi), Math.sin(wi));
    gl.uniform4f(glU.uKamera, pBx, pYh, pZax, pXax);
    gl.uniform1f(glU.uBrenn, BRENN);
    gl.uniform1f(glU.uEin, ein);
    gl.uniform1f(glU.uDis, dis);
    gl.uniform1f(glU.uAtem, reduce ? 0 : ATEM);
    gl.uniform1f(glU.uT, (atemTick & 1023) / 1024);
    gl.uniform1f(glU.uGroesse, PGROESSE);
    // Ein Sprite der Groesse s deckt rund 0.16*s*s Pixel mit Gewicht — gemessen
    // am Integral des Abfalls oben. Ohne diesen Ausgleich waere der GL-Pfad bei
    // gleichem ?hell= um ein Vielfaches heller als der CPU-Pfad.
    gl.uniform1f(glU.uPegel, 1 / (PGROESSE * PGROESSE * 0.16));
    gl.uniform4f(glU.uFlug, EINFLUG, EIN_VERZ, DRIFT, SPREAD);
    gl.uniform1f(glU.uRichtung, LINKS ? -1 : 1);
    gl.uniform1f(glU.uSpurStaerke, spur);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, glSpur);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R16F, gw, gh, 0, gl.RED, gl.FLOAT,
                  spur > 0 ? F : glLeer);
    gl.uniform1i(glU.uSpur, 1);
    gl.drawArrays(gl.POINTS, 0, n);

    // Zweiter Durchgang: Helligkeit durch die Farbrampe auf den Schirm.
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.disable(gl.BLEND);
    gl.useProgram(glVoll);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, glTex);
    gl.uniform1i(glU.uAcc, 0);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, glRampe);
    gl.uniform1i(glU.uRampe, 2);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function punkte(dis, ein, wi) {
    const kante = dis * (1 + SPREAD);
    const richtung = LINKS ? -1 : 1;
    const einAktiv = ein < 1;
    const einSpanne = 1 - EIN_VERZ;
    const atem = reduce ? 0 : ATEM;
    const t16 = atemTick & 1023;
    const spur = spurAktiv ? SPUR : 0;
    // Schwenken. Die Punkte liegen in Bildschirmpixeln; zusammen mit der
    // Kameratiefe laesst sich daraus die Weltposition EXAKT zurueckrechnen
    // (Lochkamera), also ist das keine Naeherung fuer kleine Winkel:
    //   X  = (x - bx) · Z / BRENN
    //   X' = X·cos + (Z - ZAX)·sin
    //   Z' = ZAX + (Z - ZAX)·cos - X·sin
    // Gedreht wird um eine senkrechte Achse in der Tiefe der Figur, damit sie
    // stehen bleibt und der Boden unter ihr wegzieht. Bei Winkel 0 kostet der
    // ganze Block nichts — wie die Spur auch.
    const dreht = wi !== 0;
    const co = Math.cos(wi), si = Math.sin(wi);

    for (let i = 0; i < n; i++) {
      let x = Dx[i], y = Dy[i], a = 1;
      const z0 = Dzc[i];
      let zc = z0;

      if (dreht) {
        const dX = (x - pBx) * DzcB[i] - pXax;   // Ruecktransformation, exakt
        const dZ = zc - pZax;
        const Xr = pXax + dX * co + dZ * si;
        zc = pZax - dX * si + dZ * co;
        if (zc < 0.05) continue;                 // hinter der Kamera gelandet
        const s = 1 / zc;                        // die EINE Division je Punkt und Bild
        x = pBx + Xr * BRENN * s;
        y = pYh + (y - pYh) * z0 * s;
      }


      // Einflug: der Punkt kommt aus einer zufaelligen Richtung herein und
      // bremst in seine Position hinein. Richtung aus der Sinustabelle, Betrag
      // je Punkt verschieden — sonst laege der Startzustand auf einem Kreis.
      if (einAktiv) {
        const g = (ein - (Ee[i] / 255) * EIN_VERZ) / einSpanne;
        if (g <= 0) continue;                    // dieser Punkt startet spaeter
        if (g < 1) {
          const r = 1 - g, rest = r * r * r;     // ausklingend, nicht gleichfoermig
          const w = (Dr1[i] * 1024) | 0;
          const d = rest * EINFLUG * (0.3 + Dr2[i] * 1.4);
          x += d * SIN[(w + 256) & 1023];        // +256 = Kosinus
          y += d * SIN[w];
          // Helligkeit zieht schneller an als der Fortschritt. Linear war der
          // halbe Einflug praktisch unsichtbar: wenige Punkte, und die dunkel.
          a = g * (2 - g);
        }
      }

      // Wer zerfaellt, steht schon beim Aufbau fest (Dd = 99 heisst: steht).
      // An der Ursprungsposition entschieden, nicht an der aktuellen — sonst
      // frieren Punkte ein, sobald sie die Mitte ueberqueren.
      let p = 0;
      if (dis > 0 && Dd[i] < 90) {
        p = clamp01(kante - Dd[i] * SPREAD);
        if (p >= 1) continue;            // verloschen
        const e = p * p;                 // beschleunigt statt gleichfoermig
        x += richtung * e * DRIFT * (0.35 + Dr1[i] * 1.3);
        y += e * DRIFT * 0.55 * (Dr2[i] - 0.65);   // leicht nach oben versetzt
        a *= 1 - p;
      }

      // Ganzzahlige Position nur noch fuer die Spur (Feldindex) und die
      // Randpruefung. Die Nachkommastellen werden unten gebraucht — sie
      // sind der Unterschied zwischen einem Raster und Licht.
      let xi = x | 0, yi = y | 0;
      if (xi < 0 || xi >= W - 1 || yi < 0 || yi >= H - 1) continue;

      // Beruehrungsspur. Das Feld gibt nur die STAERKE; die Richtung ist der
      // eigene Zufallswinkel des Punktes — wie im Vorbild cos(angle)/sin(angle)
      // mit einem Zufallswert je Partikel. Deshalb stiebt jeder woandershin und
      // es fizzelt, statt eine saubere Furche zu ziehen.
      // Abgefragt an der RUHEposition, wie dort auch. Und nur, wenn ueberhaupt
      // etwas im Feld steht: im Ruhezustand kostet die Spur exakt nichts.
      if (spur > 0) {
        const f = F[(yi >> 3) * gw + (xi >> 3)];
        if (f > 0) {
          const w = (Dr1[i] * 1024) | 0;
          const d = f * spur;
          x += d * SIN[(w + 256) & 1023];
          y += d * SIN[w];
          xi = x | 0; yi = y | 0;
          if (xi < 0 || xi >= W - 1 || yi < 0 || yi >= H - 1) continue;
          a += f;    // im Vorbild kommen sie dabei nach vorn, hier: heller
        }
      }

      // Die Strichstaerke (Ds, ?dicke=) ist raus: sie war der Ersatz dafuer,
      // dass ein Punkt nur ein ganzes Pixel treffen konnte — helle Punkte
      // wurden zu 2x2-Kloetzen, um die Rasterluecken zu schliessen. Das
      // Subpixel-Splatting unten macht das von selbst und ohne Schwelle, an
      // der Punkte hin- und herkippen konnten.


      // Eigenbewegung, ganz zuletzt und nur auf die Helligkeit.
      if (atem > 0) a += atem * SIN[(Ep[i] + t16) & 1023];
      // ADDIEREN, nicht ueberschreiben. Ein Hologramm glueht: wo sich Punkte
      // ueberlagern, wird es heller. Damit entfaellt die ganze Verdeckungsfrage
      // — kein Tiefenpuffer, keine Abdichtung der Rasterluecken, und die
      // Reihenfolge der Punkte ist egal.
      //
      // Gesammelt wird nur eine HELLIGKEIT je Pixel, nicht drei Farbkanaele.
      // Das geht, weil das Bild einfarbig ist: die Farbe kommt erst ganz zum
      // Schluss aus einer Rampe. Ein Feld statt dreien.
      //
      // SUBPIXEL. Vorher stand hier `acc[yi*W + xi] += h` mit `xi = x|0` —
      // jeder Punkt rastete auf ein ganzes Pixel und wurde als harter Klotz
      // gemalt. Daher der Rasterlook (Licht hat keine Kanten) und daher das
      // Flimmern beim Schwenken: +-10 Grad verschieben einen Punkt um
      // Bruchteile eines Pixels, und die sprangen dann.
      // Jetzt wird die Helligkeit bilinear auf die vier Nachbarn verteilt.
      // Das ist die CPU-Fassung dessen, was auf der GPU ein weicher Sprite
      // waere: vier Additionen statt einer, dafuer Position mit
      // Nachkommastellen.
      const h = Dh[i] * (a > 0 ? a : 0);
      const fx = x - xi, fy = y - yi;
      const o = yi * W + xi;
      const oben = h * (1 - fy), unten = h * fy;
      acc[o]         += oben * (1 - fx);
      acc[o + 1]     += oben * fx;
      acc[o + W]     += unten * (1 - fx);
      acc[o + W + 1] += unten * fx;
    }

    // Helligkeit in Farbe uebersetzen — und im selben Durchgang den Speicher
    // fuer das naechste Bild leeren.
    //
    // Gemessen, und das Ergebnis geht in BEIDE Richtungen: auf Handymassen
    // ist ein Durchgang klar besser (390x844: 7,3 -> 4,2 ms), auf grossen
    // Schirmen klar schlechter (2560x1440: 37,6 -> 59,7 ms). Die Vermutung,
    // zwei Durchgaenge seien einfach doppelt so teuer, war also falsch: ein
    // `fill(0)` ist ein vektorisierter Blockschreibvorgang, waehrend diese
    // Schleife je Pixel verzweigt und bedingt zurueckschreibt. Solange der
    // Speicher in den Cache passt, gewinnt der gesparte Durchgang; darueber
    // gewinnt das schnellere fill.
    // Der Effekt ist fuers Handy gebaut, deshalb steht es so. Muss er je auf
    // grosse Schirme, ist die Umkehrung eine Zeile — und der Puffer zu
    // deckeln (siehe ponytail-Kommentar) waere ohnehin der bessere Weg.
    for (let o = 0; o < acc.length; o++) {
      const v = acc[o];
      if (v <= 0) { buf32[o] = 0; continue; }
      buf32[o] = rampe[v >= 1 ? 255 : (v * 255) | 0];
      acc[o] = 0;
    }
    pctx.putImageData(pimg, 0, 0);
  }

  function draw(t) {
    if (!bereit) return;

    // Der Zerfall ist gebaut, aber aus: erst steht der Raum, dann wird
    // entschieden, was das Scrollen ausloesen soll. `?zerfall=an` holt ihn zurueck.
    const dis = ZERFALL ? clamp01((t - DIS_FROM) / (DIS_TO - DIS_FROM)) : 0;

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, SW, SH);

    // Winkel des Schwenks. Fest, wenn ?winkel= gesetzt ist (Standbilder und
    // Messungen), sonst ein langsames Eigenschwenken ueber die Sinustabelle.
    // Was der SCROLLWEG treibt, ist noch nicht entschieden — deshalb haengt
    // hier bewusst nur die Zeit dran.
    winkelJetzt = WINKEL !== null ? WINKEL
                : reduce ? 0
                : SCHWENK * SIN[schwenkTick & 1023];
    if (glBereit) glZeichnen(dis, ein, winkelJetzt * RAD);
    else punkte(dis, ein, winkelJetzt * RAD);

    // Querfahrt: das Fenster wandert ueber den breiteren Puffer. Eine eigene
    // Daempfung braucht es nicht — t ist bereits der gedaempfte Scrollwert.
    panX = W > SW ? -Math.round(panVon + (panBis - panVon) * clamp01(t)) : 0;
    ctx.drawImage(glBereit ? gcv : pcv, panX, 0);   // 1:1, kein Punkt geht verloren
  }

  // ---- Schleife ---------------------------------------------------------
  // laeuft: nur fuer Standbilder von aussen. Ohne das ueberschreibt der naechste
  // Bilddurchlauf jeden von Hand gesetzten Zwischenstand, bevor der Screenshot
  // ausgeloest ist.
  let laeuft = true;
  const zeiten = [];
  function tick() {
    // Nach halt() ist meist noch ein Bild angemeldet. Ohne diese Zeile laeuft
    // es durch und ueberschreibt genau den Zwischenstand, fuer den angehalten
    // wurde.
    if (!laeuft) return;
    const t0 = performance.now();

    // Der Einflug laeuft ueber die ZEIT, nicht ueber den Scrollweg: er ist das
    // Erscheinen der Figur, nicht Teil der Erzaehlung. Er beginnt mit dem
    // ersten Bild nach dem Aufbau.
    if (einStart === 0) einStart = t0;
    // Vorn gestaucht (1-(1-x)^2): der Anfang ist die Zeit, in der auf dem Handy
    // sonst nichts zu sehen waere, also passiert dort am meisten. Gemessen an
    // Standbildern: die Figur wird bei rund einem Drittel der Dauer lesbar
    // statt erst bei gut der Haelfte.
    const roh = (reduce || EIN_MS <= 0) ? 1 : clamp01((t0 - einStart) / EIN_MS);
    ein = roh * (2 - roh);
    // 1024 Tabellenschritte sind ein voller Umlauf; bei Tempo 1 sind das rund
    // 17 s — langsam genug, dass es als Atmen liest und nicht als Flimmern.
    atemTick += reduce ? 0 : TEMPO;
    if (atemTick >= 1024) atemTick -= 1024;
    // Deutlich langsamer als der Puls: ein voller Hin-und-Her-Schwenk dauert
    // bei Tempo 1 rund 34 Sekunden. Schneller wirkt es wie ein Karussell.
    schwenkTick += reduce ? 0 : SCHWENKTEMPO * 0.5;
    if (schwenkTick >= 1024) schwenkTick -= 1024;
    spurFeld();

    eased += (target - eased) * (reduce ? 1 : DAMPING);
    if (Math.abs(target - eased) < 0.0002) eased = target;
    draw(eased);
    hint.style.opacity = String(Math.max(0, 1 - eased * 6));

    // Gemessen, nicht geschaetzt: Median statt Mittelwert, damit ein einzelner
    // Ausreisser (Speicherbereinigung) das Bild nicht faelscht.
    zeiten.push(performance.now() - t0);
    if (zeiten.length > 200) zeiten.shift();
    if (zeiten.length > 20 && (zeiten.length & 15) === 0) {
      const s = [...zeiten].sort((a, b) => a - b);
      const b = bauPhasen || {};
      hud.textContent =
        'Fortschritt ' + (eased * 100).toFixed(1) + ' %' +
          '   Einflug ' + (ein * 100).toFixed(0) + ' %\n' +
        'Muster ' + (KREISE ? 'Ringe' : 'Zeilen') +
          '   Punkte ' + n.toLocaleString('de') + '\n' +
        'Linie ' + LINIEN + '  Punkt ' + PUNKTE +
          '  Relief ' + RELIEF + '  Atem ' + ATEM +
          '  Spur ' + (spurAktiv ? 'an' : 'aus') + '\n' +
        'Bildzeit Median ' + s[s.length >> 1].toFixed(2) + ' ms\n' +
        '          95 %   ' + s[Math.floor(s.length * 0.95)].toFixed(2) + ' ms\n' +
        'Flaeche ' + W + '×' + H + '  Aufbau ' + bauZeit.toFixed(0) + ' ms\n' +
        '  davon Vorlage ' + b.vorlage + '  Maske ' + b.maske + '  Tiefe ' + b.tiefe + '\n' +
        '        Schaerfe ' + b.schaerfe + '  Raster ' + b.raster +
          '  Felder ' + b.felder + '\n' +
        'h = Anzeige aus';
    }
    if (laeuft) requestAnimationFrame(tick);
  }

  addEventListener('scroll', readScroll, { passive: true });
  // Ein Zeiger genuegt — pointermove deckt Maus, Stift und Finger ab. Kein
  // preventDefault: auf dem Handy zieht derselbe Wisch die Seite weiter und
  // hinterlaesst nebenbei die Spur.
  const zeiger = e => {
    const r = stage.getBoundingClientRect();
    stempeln(e.clientX - r.left, e.clientY - r.top);
  };
  stage.addEventListener('pointermove', zeiger, { passive: true });
  stage.addEventListener('pointerdown', zeiger, { passive: true });
  new ResizeObserver(() => { resize(); readScroll(); }).observe(stage);
  addEventListener('keydown', e => { if (e.key === 'h') hud.classList.toggle('off'); });
  readScroll();

  // Fuer die Messung von aussen (Screenshots an festen Punkten).
  window.__face = {
    // e = Stand des Einflugs; fuer Standbilder ist 1 (fertig) das Richtige.
    springe(v, e = 1) { target = clamp01(v); eased = target; ein = clamp01(e);
                        draw(eased); },
    // Spur von aussen setzen, um sie ohne echte Hand pruefen zu koennen.
    // Zwei Aufrufe hintereinander noetig: die Staerke kommt aus der Strecke
    // zwischen zwei Positionen, ein einzelner Punkt hat noch keine.
    tupfen(x, y) { stempeln(x, y); spurFeld(); draw(eased); },
    halt()   { laeuft = false; },
    weiter() { if (!laeuft) { laeuft = true; requestAnimationFrame(tick); } },
    // Baut das Raster sofort neu, ohne die 120-ms-Entprellung abzuwarten.
    // Nur fuer Messungen: im Hintergrund-Tab streckt der Browser jeden Timer
    // auf eine Sekunde, und die Abnahme ueber sieben Breiten lief damit in
    // die Zeitgrenze der Fernsteuerung.
    neuAufbau() { messen(); aufbauen(); draw(eased);
                  return { n, W, H, aufbauMs: Math.round(bauZeit) }; },
    // Mittlere Tiefe der FIGURpunkte in einem Rechteck (Anteile des
    // Puffers). Damit laesst sich mit einem einzigen Instrument belegen, ob
    // die Hand naeher steht als die Brust — vor und nach dem Wechsel der
    // Tiefenquelle, auf denselben Koordinaten.
    // Nur zum Messen: mit dem Kontext laesst sich per readPixels die GPU
    // zum Fertigwerden zwingen. Ohne das misst man beim GL-Pfad nur das
    // ABSENDEN der Befehle — derselbe Fallstrick wie gl.finish() unter ANGLE.
    glKontext() { return gl; },
    tiefe(x0, y0, x1, y1) {
      const ax = x0 * W, ay = y0 * H, bx = x1 * W, by = y1 * H;
      let s = 0, z = 0;
      for (let i = 0; i < n; i++) {
        if (Dart[i] !== 0) continue;         // nur die Figur, kein Boden/Staub
        if (Dx[i] < ax || Dx[i] >= bx || Dy[i] < ay || Dy[i] >= by) continue;
        s += Dz[i]; z++;
      }
      return { punkte: z, mittel: z ? +(s / z).toFixed(3) : null };
    },
    zahlen() {
      const s = [...zeiten].sort((a, b) => a - b);
      return { n, W, H, muster: KREISE ? 'ringe' : 'zeilen',
               skala: +skala.toFixed(2), freigestelltProzent: +(freiAnteil*100).toFixed(1),
               kasten: letzterKasten, buehne: SW + 'x' + SH, puffer: W + 'x' + H,
               fahrt: Math.round(panVon) + '..' + Math.round(panBis),
               linien: Math.round(LINIEN * skala), punkte: Math.round(PUNKTE * skala),
               aufbauMs: Math.round(bauZeit), phasen: bauPhasen, sorten,
               // Zeit vom Laden der Seite bis zum ersten gezeichneten Bild.
               // Das ist die Zahl, die auf dem Handy zaehlt.
               ersteBildMs: Math.round(einStart),
               pfad: glBereit ? 'webgl2' : (glAus ? 'cpu (' + glAus + ')' : 'cpu'),
               ein: +ein.toFixed(2), spur: spurAktiv,
               tiefenkarte: tiefeDa, winkel: +winkelJetzt.toFixed(2),
               raum: raumWerte,
               median: s[s.length >> 1], p95: s[Math.floor(s.length * .95)] };
    }
  };
})();
</script>
</body>
</html>
