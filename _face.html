<title>Gesichts-Intro — Prototyp</title>

<!-- Prototyp, nicht Teil der Seite. Wie _bands.html: hier wird der Look
     entschieden, index.html wird erst angefasst, wenn er sitzt.

     DIE FIGUR STEHT IN EINEM RAUM (seit 29.08.2026). Die Fassung davor —
     Linienbild vor der hellen Wand des Fotos — liegt eingefroren in
     _face-wand.html und wird nicht mehr weiterentwickelt.

     Drei Sorten Punkte, eine gemeinsame Bildschleife:

       1. FIGUR. Dichtes Zeilenraster, nur wo die Maske "Person" sagt.
          Ausgelenkt nach Helligkeit. Dazu ein RANDLICHT: jedes Pixel, das zur
          Person gehoert und einen Hintergrundnachbarn hat, wird voll hell und
          voll dick. Das ist die Kontur — und der Grund, warum die Figur jetzt
          als Koerper steht und nicht als Linienfeld.
       2. BODEN. Ringe in echter Perspektive, ohne Bildmodulation.
       3. STAUB. Duenn gestreute Punkte auf derselben Ebene.

     TIEFE kommt aus einer TIEFENKARTE, die einmal offline gebacken wurde:
     `rutger2-voll-tiefe.png` neben dem Foto, 48 KB, aus Depth Anything V2
     Small (Skript im Scratchpad, im Browser laeuft davon nichts). Hell = nah.
     Normiert wird nur ueber die Figur, sonst bestimmt die Wand die Skala.

     Warum nicht mehr das Aufblasen der Silhouette (Distanztransformation):
     es lag an der interessantesten Stelle des Fotos falsch herum. Gemessen
     mit __face.tiefe() auf denselben Rechtecken —
        Aufblasen:    Brust 1,000 (gesaettigt) · Hand 0,938 · Kopf 0,811
        Tiefenkarte:  Hand 0,677 (vorn) · Kopf 0,431 · Brust 0,418
     Tatsaechlich ist die vorgestreckte Hand das Naechste im ganzen Bild; das
     Aufblasen schickt duenne Dinge nach hinten, weil es nur die Silhouette
     kennt. Beim Schieben um 12 px faellt das nicht auf, beim Drehen sofort.
     Der Rueckfall ist geblieben (`?tiefenkarte=aus`) und ist ehrlicher als
     vorher: `aufblas` eicht sich jetzt selbst an der halben Figurbreite statt
     auf feste 42 px, gemessen 0,47..0,89 statt 0,81..1,00. Die Reihenfolge
     bleibt dort trotzdem falsch — das kann das Verfahren nicht.

     SCHWENKEN. Jeder Punkt traegt seine Entfernung zur Kamera (`Dzc`, in den
     Einheiten von FERNE), und damit laesst sich aus der Bildschirmposition die
     Weltposition EXAKT zurueckrechnen — Lochkamera, keine Kleinwinkelnaeherung.
     Gedreht wird um eine senkrechte Achse durch den Schwerpunkt der Figur:
     sie steht praktisch still, der Boden zieht um sie herum. Kosten gemessen:
     0,1 ms. Ein TIEFENPUFFER entscheidet, welcher Punkt vorn liegt (0,6 ms);
     dabei muss die Figur ueber ihre Rasterluecken hinweg ABGEDICHTET werden,
     sonst schienen die Bodenringe durch die zwei leeren Zeilen zwischen den
     Figurzeilen — quer ueber Brust und Schulter.

     Ehrliche Grenze: das ist ein Relief, kein Modell. Es gibt keine
     Rueckseite und nichts hinter der Hand. Bei ±20 Grad faellt das nicht auf,
     darueber schon — deshalb schwenkt es und dreht sich nicht.

     Zweiter Kniff: Linien und Partikel sind DASSELBE. Jeder Punkt ist schon
     ein Partikel und muss zum Zerfall nur losfliegen.

     WICHTIG zur Aufloesung: die Punkte entstehen in BILDSCHIRMpixeln, nicht in
     Bildpixeln. Zuerst lag das Raster im Quellbild (640 breit) und wurde beim
     Zeichnen auf die Buehne heruntergerechnet — dabei fiel rund jeder dritte
     Punkt weg, und das Ergebnis war duenn und dunkel. Deshalb wird das Raster
     bei jeder Groessenaenderung neu aufgebaut.

     Stellschrauben haengen an der Adresse, wie ?sicht= in index.html:
       ?linien=2..10     Abstand zwischen zwei Linien, in Bildschirmpixeln (4)
       ?punkte=1..5      Punktabstand laengs der Linie (2)
       ?ziel=1e4..4e5    Obergrenze Punktzahl, deckelt grosse Schirme (60000)
       ?relief=0..60     wie stark die Helligkeit auslenkt (16)
       -- Form und Licht --
       ?farbe=rot|blau   Farbklima (rot)
       Helligkeit = ALBEDO mal BELEUCHTUNG.
       ?hmaterial=0..1   Sockel des Albedo (0.25)
       ?hton=0..3        Tonwerte aus dem Foto, fuellt die Flaeche (1.4)
       ?tonradius=4..200 Radius, ueber den der Tonwert gemessen wird (40)
       ?hfoto=0..3       feine Struktur: Brille, Kette, Ringe (0.3)
       ?hdetail=0..60    Verstaerkung dieser Struktur (8)
       ?hdunkel= ?hhell= Gewicht dunkler/heller Kanten (1.5 / 0.3)
       ?licht=0..360     Richtung des Lichts in Grad (135 = links oben)
       ?ambient=0..1     Grundlicht, damit nichts absaeuft (0.2)
       ?nradius=1..60    BASISWEITE der Normalen in px (12) — der wichtigste
                         Regler: klein misst Kanten, gross misst Formen
       ?nskala=5..1500   Steigung je Tiefeneinheit (250)
       ?hrand=0..2       Streiflicht an der Silhouette (0.1)
       ?htiefe=0..2      Glut nach Naehe (0.15)
       ?hoehenlinien=    Tiefenbaender wie auf einer Landkarte (0 = aus)
       ?hell=0.05..3     Gesamthelligkeit (0.45)
       ?zeige=maske|ton|detail|albedo|licht|ndl|rand|nah
                         einen einzelnen Term allein zeichnen — zum Suchen,
                         welcher Summand ein Bild dominiert
       -- Figur und Raum --
       ?figlinien=1..8   Zeilenabstand der Figur (1)
       ?figpunkte=1..5   Punktabstand in der Zeile (1)
       ?fein=0..3        ab welcher Struktur jedes Pixel abgetastet wird (0.28)
       ?figury=0..1      Senkrechte Lage der Figur (0.46)
       ?staub=0..0.5     Anteil Staubpunkte am Budget (0.03)
       ?randlicht=0..1   Helligkeit der Silhouette (1)
       ?tiefe=0..3       Gesamtstaerke der Tiefe (1)
       ?raum=0..4        Tiefe der Figur als Anteil ihrer Entfernung (1)
       ?zfig=0..40       Entfernung der Figur (0 = Vorgabe 8)
       ?brenn=100..3000  Brennweite in px (560)
       ?schwenk=0..60    Amplitude des Eigenschwenks in Grad (10)
       ?schwenktempo=0..8  Tempo des Schwenks
       ?winkel=-60..60   fester Winkel statt Schwenk, fuer Standbilder
       ?tiefenkarte=aus  ohne Karte bauen, mit dem Aufblasen als Rueckfall
       ?maske=bunt|tiefe|beides   Verfahren der Freistellung (beides)
       ?nahtiefe=.05-.95 ab welcher Naehe ein Pixel nie Hintergrund wird (0.42)
       ?zerfall=an       den Zerfall wieder einschalten (aus)
       -- Rest --
       ?haelfte=links    welche Haelfte zerfaellt (Standard: rechts)
       ?drift=20..400    wie weit die Partikel fliegen (150)
       ?einflug=0..600   aus wie weit die Punkte am Anfang einfliegen (220)
       ?eindauer=0..6000 wie lange der Einflug dauert, in ms (1800)
       ?atem=0..1        Tiefe des Ruhepulses in Helligkeit und Groesse (0.35)
       ?tempo=0..4       Geschwindigkeit dieses Pulses (1)
       ?spur=0..90       wie weit Finger/Maus die Punkte auseinandertreibt (30)
       ?spurweite=2..20  Radius der Spur, in Zellen a 8 px (7)
       ?spurdauer=10..400 Lebensdauer eines Spurpunkts, in Bildern (120)
       ?tint=aus         Rotfaerbung aus (fuer ein bereits gefaerbtes Bild)
       ?kontrast=aus     Tonwertspreizung aus (zeigt die Vorlage ungespreizt)
       ?invert=an        Helligkeit umkehren (fuer dunkles Motiv auf hellem Grund)
       ?bild=eng|ganz|platzhalter   andere Vorlage (Standard: person)
       ?passung=ganz     ganzes Bildrechteck hineinpassen
       ?passung=motiv    den Kasten um die PERSON einpassen
       ?kasten=x,y,b,h   Ausschnitt von Hand (Anteile 0..1); ?kasten=auto sucht selbst
       ?passung=fahrt    Motiv fensterhoch, Ansicht faehrt quer mit (empfohlen)
       ?rand=0..0.3      Luft um das Motiv (0.06)
       ?zoom=0.3..3      Groesse der Figur darin (1)
       ?saum=0..0.5      Ausklingen der Bildunterkante (0.18, 0 = harte Kante)
       ?frei=aus         Hintergrund NICHT freistellen
       ?toleranz=.005-.2 wie weich der Hintergrundverlauf sein darf (0.03)
       ?schatten=behalten Schlagschatten NICHT mitentfernen
       ?grau=0..0.4      ab welcher Buntheit etwas als Motiv gilt (0.085)
       ?hgmin=0..0.9     Mindesthelligkeit fuer Hintergrund (0.30)
       ?schaerfe=0..2.5  lokaler Kontrast, hebt Ringe/Kette/Brillenrand (0.7)
       ?radius=1..12     Umfeld dafuer, in Pixeln (4)
       h                 blendet die Messanzeige um -->

<style>

<section class="intro" id="intro">
  <div class="stage" id="stage">
    <canvas id="face"></canvas>
    <div class="hint" id="hint">scrollen</div>
  </div>
</section>
<div class="ende">hier übernähme später der Shop</div>

<div class="hud" id="hud">lädt …</div>

<script>
(() => {
  // ---- Stellschrauben ---------------------------------------------------

  const DAMPING  = 0.085;  // wie index.html — beides soll sich gleich anfuehlen
  const DIS_FROM = 0.55;   // ab hier zerfaellt es
  const DIS_TO   = 1.00;
  const SPREAD   = 0.55;   // zeitliche Staffelung der Partikel
  // -----------------------------------------------------------------------

  const q = new URLSearchParams(location.search);
  const zahl = (k, std, lo, hi) => {
    // Auf null pruefen, nicht auf NaN: Number(null) ist 0, nicht NaN. Ohne
    // diese Zeile lieferte jeder Parameter, dessen Bereich die Null enthaelt
    // (relief, boden, cx, cy), stumm 0 statt seines Standardwerts — der Effekt
    // stand dann ganz ohne Auslenkung da. Gemessen, nicht vermutet.
    const roh = q.get(k);
    if (roh === null || roh.trim() === '') return std;
    const v = Number(roh);
    return Number.isFinite(v) && v >= lo && v <= hi ? v : std;
  };
  const KREISE   = q.get('muster') !== 'zeilen';
  const LINIEN   = Math.round(zahl('linien', 3, 2, 10));
  const PUNKTE   = Math.round(zahl('punkte', 1, 1, 5));
  const RELIEF   = zahl('relief', 10, 0, 60);
  const BODEN    = zahl('boden', 0.05, 0, 0.5);
  // Kurve, mit der die Motivhelligkeit auf die Punkthelligkeit geht. Kleiner
  // als 1 hebt die dunklen Partien — Shirt, Kette, Schattenseite des Gesichts.
  // Der Grundwert BODEN kann das NICHT: er hebt den Hintergrund gleich mit,
  // denn dort ist die Helligkeit exakt 0 und der Abstand zum Shirt bleibt.
  // Diese Kurve laesst die Null in Ruhe und hebt nur, was darueber liegt.
  const GAMMA    = zahl('gamma', 0.6, 0.25, 1.5);
  // Ringmittelpunkt. Bereich absichtlich ueber 0..1 hinaus: liegt er MITTEN im
  // Motiv, entsteht dort ein Strudel aus engen konzentrischen Kreisen — eine
  // Zielscheibe auf der Brust. In der Vorlage sitzt das Zentrum ausserhalb der
  // Figur, deshalb laufen die Ringe dort als weite Boegen durchs Bild.
  const CX       = zahl('cx', 0.42, -1.5, 2.5);
  const CY       = zahl('cy', 1.25, -1.5, 2.5);
  const LINKS    = q.get('haelfte') === 'links';
  const DRIFT    = zahl('drift', 150, 20, 400);
  // Einflug. Ersetzt die frueheren Aufdecklinie: die Punkte stehen nicht schon
  // fertig da und werden freigelegt, sondern kommen aus dem Nichts und finden
  // ihre Position. Vorbild ist das Codrops-Demo "Interactive Particles" — dort
  // laeuft das im Vertex-Shader, hier auf der CPU, siehe SIN unten.
  const EINFLUG  = zahl('einflug', 220, 0, 600);    // Streuung am Start, in px
  const EIN_MS   = zahl('eindauer', 1800, 0, 6000); // Dauer
  const EIN_VERZ = 0.55;   // Anteil der Dauer, ueber den die Punkte gestaffelt starten
  // Dauernde Eigenbewegung. Erster Versuch war ein kleiner Kreis je Punkt —
  // falsch. Im Vorbild ist die seitliche Streuung STATISCH (in ihrem Shader
  // steht in der xy-Zeile kein uTime); bewegt wird die TIEFE:
  //   rndz = random(pindex) + snoise(vec2(pindex*0.1, uTime*0.1));
  //   displaced.z += rndz * (random(pindex) * 2.0 * uDepth);
  // und dazu pulsiert die Punktgroesse mit
  //   psize = snoise(vec2(uTime, pindex) * 0.5) + 2.0.
  // Die Partikel wandern also nach vorn und hinten und werden dabei groesser
  // und kleiner. Eine 2D-Flaeche hat keine Tiefe; was davon uebrig bleibt und
  // dasselbe erzeugt, ist ein Puls in Helligkeit und Groesse. Seitwaerts
  // wandern lassen darf man sie hier ohnehin nicht: das zerfranst die Linien,
  // und die Linien sind bei uns das Motiv.
  // Wert = Tiefe des Pulses, 0.35 heisst plus/minus 35 % Helligkeit.
  const ATEM     = zahl('atem', 0.35, 0, 1);
  const TEMPO    = zahl('tempo', 1, 0, 4);
  // Beruehrungsspur, das eigentliche Kennzeichen des Vorbilds. Drei Punkte,
  // die dort wichtig sind und die ich zuerst alle drei anders hatte:
  //  1. Die Richtung ist NICHT radial vom Finger weg. Im Shader steht
  //     cos(angle)/sin(angle) mit einem Zufallswinkel JE PARTIKEL — sie stieben
  //     jeder in seine eigene Richtung. Radial ergab eine saubere Furche, das
  //     Vorbild fizzelt.
  //  2. Die Staerke kommt aus der quadrierten Bewegungsstrecke zwischen zwei
  //     Zeigerpositionen (`Math.min(dd * 10000, 1)`): ein schneller Wisch
  //     drueckt voll, ein ruhender Finger fast gar nicht.
  //  3. Jeder Spurpunkt lebt 120 Bilder mit einer Glockenkurve — 30 % der Zeit
  //     blendet er auf, 70 % blendet er ab. Reines Abklingen sieht anders aus.
  const SPUR     = zahl('spur', 30, 0, 90);
  const SPUR_R   = Math.round(zahl('spurweite', 7, 2, 20));
  const SPUR_ALT = Math.round(zahl('spurdauer', 120, 10, 400));
  const KONTRAST = q.get('kontrast') !== 'aus';   // Tonwertspreizung
  // Helligkeit umkehren. Der Effekt lenkt nach HELL aus, die Vorlage ist also
  // ein helles Motiv auf dunklem Grund. Rutgers Foto ist umgekehrt gebaut
  // (gemessen: Median 206, Mittel 171 — Wand, weisses Shirt, helle Jacke), da
  // wuerde die Wand die Grate bilden und das Gesicht flach bleiben.
  const INVERT = q.get('invert') === 'an';
  // Einpassung. 'fuellend' schneidet formatfuellend zu (gut fuer einen Kopf),
  // 'ganz' legt das ganze Bild hinein — dann steht die komplette Figur da und
  // ringsum laeuft nur das Linienmuster weiter. Auf Schwarz wirkt das nicht wie
  // ein Briefkasten, sondern wie eine Figur im Raum.
  const GANZ = q.get('passung') === 'ganz';
  // 'motiv' passt den Kasten um die PERSON ein, nicht das Bildrechteck. Ein
  // Querformat-Foto vollstaendig in ein Hochformat-Fenster gelegt ergibt
  // zwangslaeufig ein schmales Band — die leere Wand ringsum ist aber gar nicht
  // der Teil, den man sehen will. Freigestellt wird sie ohnehin, also kann sie
  // auch den Platz raeumen.
  const MOTIV = (q.get('passung') || 'motiv') === 'motiv';
  // 'fahrt': Motiv fensterhoch, Ansicht faehrt beim Scrollen quer darueber.
  // Der einzige Weg, in einem Hochformat-Fenster ein breites Motiv GROSS und
  // VOLLSTAENDIG zu zeigen — nur eben nacheinander statt gleichzeitig.
  const FAHRT = q.get('passung') === 'fahrt';
  // Luft um das Motiv, damit es nicht am Fensterrand klebt.
  const RAND = zahl('rand', 0, 0, 0.3);
  // Feinjustierung der Groesse obendrauf, damit sich die Figur im Bild
  // einrichten laesst, ohne dass ich neu zuschneide.
  const ZOOM = zahl('zoom', 0.8, 0.3, 3);
  // Wie weit die Unterkante des Bildes ausklingt, als Anteil der Bildhoehe.
  // Im Raum wieder an, aber anders gebaut: kein Farbverlauf im Bild (der wuerde
  // die Maske aufweichen), sondern es fallen zur Fotounterkante hin immer mehr
  // Figurpunkte weg. Die Person geht dort in Staub ueber, statt abgeschnitten
  // zu enden.
  const SAUM = zahl('saum', 0.22, 0, 0.5);
  // Hintergrund freistellen — seit dem 29.08.2026 AUS als Vorgabe, `?frei=an`
  // schaltet es wieder ein.
  //
  // Die Freistellung war der Versuch, die Figur auf Schwarz zu stellen. Sie hat
  // aber eine ganze Klasse von Fehlern erzeugt: sie schnitt die beschattete
  // Unterseite des Unterarms weg (der Arm war innen hohl), sie musste den
  // Schlagschatten hinter dem Kopf gesondert behandeln, und sie brauchte drei
  // Regler (`toleranz`, `grau`, `hgmin`), die alle am selben Foto haengen.
  // Mit der Wand im Bild gibt es nichts wegzuschneiden, also auch keine Loecher.
  // Die Figur steht dann als Silhouette vor einer belichteten Wand, der
  // Schlagschatten hinter dem Kopf traegt Tiefe, und das Linienmuster fuellt
  // das ganze Bild statt in Schwarz auszulaufen.
  const FREI = q.get('frei') === 'an';
  const TOL  = zahl('toleranz', 0.012, 0.005, 0.2); // wie weich der Verlauf sein darf
  // Schlagschatten mit entfernen. Sie sind dunkler als die Wand, das reine
  // Helligkeitswachstum bleibt an ihrer Kante stehen — der Schatten zaehlt dann
  // als Motiv und zieht sogar den Motivkasten auf. Die Toleranz hochzudrehen
  // frisst die Person mit. Der belastbare Unterschied ist die FARBE: Wand und
  // Schatten sind grau, Haut, Ringe und Kette sind es nicht.
  const SCHATTEN = q.get('schatten') !== 'behalten';
  const GRAU = zahl('grau', 0.085, 0, 0.4);   // ab wann etwas als grau gilt
  // Wie hell etwas mindestens sein muss, um als Wand durchzugehen. Stand lange
  // auf 0.30 — und riss damit ein Loch in den Unterarm: die beschattete
  // Unterseite ist grau genug und heller als 0.30, galt also als Wand und
  // wurde weggeschnitten. Gemessen: 38 918 helle Pixel gegen 50 162 bei 0.50.
  // Die Wand selbst liegt bei ~0.81, der Abstand ist also reichlich.
  //
  //
  // Bleibt bei 0.30. Der Schlagschatten links vom Kopf (lum 0.267) faellt
  // NICHT ueber diese Schwelle, sondern ueber `istFern` weiter unten — er ist
  // zu dunkel fuer "Wand", aber er liegt in Wandentfernung. `hgmin` zu senken
  // war der erste Anlauf und hat das Shirt angefressen (-7 353 Pixel gegen
  // -3 057 fuer den Schatten selbst); die Begruendung steht bei `istFern`.
  const HGMIN = zahl('hgmin', 0.30, 0, 0.9);
  // Lokaler Kontrast. Kleine helle Details — Ringe, Halskette, Brillenrand —
  // gehen sonst im Umfeld unter: sie sind zwar heller als ihre Nachbarschaft,
  // aber absolut nicht hell genug, um aus der Kurve herauszustechen. Die
  // Gesamthelligkeit anzuheben hilft nicht, das hebt den Hintergrund mit.
  // Hier wird jedes Pixel gegen seine WEICHGEZEICHNETE Umgebung verstaerkt.
  // 1.2 statt 0.7, Umfeld 3 statt 4: die Halskette ist im Foto ein duenner
  // Silberstrang ueber schwarzem Shirt und im Handyformat ein bis zwei Pixel
  // breit. Ueber die Helligkeit ist sie nicht zu holen, nur ueber den Abstand
  // zur direkten Nachbarschaft — und die muss dafuer eng gefasst sein.
  // Hoeher getestet (2.2 bei Umfeld 2): dann bekommt der Arm einen harten Rand
  // und die Flaechen werden koernig.
  const SCHAERFE = zahl('schaerfe', 1.2, 0, 2.5);
  const RADIUS = Math.round(zahl('radius', 3, 1, 12));
  // Ab welchem Ausschlag der lokale Kontrast ueberhaupt greift. Haelt die
  // Wandstruktur draussen und laesst Kette, Ringe und Brillenrand durch.
  const SCHWELLE = zahl('schwelle', 0.012, 0, 0.2);

  // ---- Der Raum ---------------------------------------------------------
  // Die Wand-Fassung liegt eingefroren in _face-wand.html. Hier steht die
  // Figur freigestellt in einem gerechneten Raum: Boden aus Ringen in
  // Perspektive, Figur davor, Staub dazwischen.
  const FARBE = q.get('farbe') === 'blau' ? 'blau' : 'rot';
  // Waagerechte des Horizonts, als Anteil der Buehnenhoehe. Darunter Boden,
  // darueber leerer Raum.
  // Brennweite in Pixeln und Kamerahoehe. Nur ihr Verhaeltnis bestimmt, wie
  // schnell die Ringe zum Horizont zusammenruecken; getrennt, weil f allein
  // die Breite steuert.
  const BRENN = zahl('brenn', 560, 100, 3000);
  // Abstand der Kamera zum Mittelpunkt der Ringe und Weltabstand der Ringe.
  // Staerke des Aufblasens: bis zu welchem Abstand vom Silhouettenrand (in px)
  // die Tiefe auf 1 steigt. Grob die halbe Breite eines Unterarms.
  // 0 = selbst eichen: die halbe Breite der Figur, gemessen als groesster
  // Abstand zum Silhouettenrand. Fest 42 px liess den Oberkoerper voll
  // saettigen (gemessen: Brust 1,000 ueber die ganze Flaeche).
  const AUFBLAS = zahl('aufblas', 0, 0, 200);

  const TONDUNKEL = zahl('tondunkel', 1, 0, 1);
  const HDETAIL = zahl('hdetail', 16, 0, 60);  // Verstaerkung dieser Struktur

  const HLSTAERKE = zahl('hlstaerke', 0.35, 0, 2);
  // Zufallsversatz in der Tiefe. VORGABE 0, und das ist ein Ergebnis, kein

  // ist nicht der teure Teil: teuer sind die drei Float32Array, die er dabei
  // jedesmal neu anlegt.
  const nennerCache = new Map();
  function weichzeichnenMaskiert(quelle, mask, w, h, r) {
    const n = w * h;
    const schl = w + 'x' + h + 'r' + r;
    let mb = nennerCache.get(schl);
    if (!mb) { mb = weichzeichnen(mask, w, h, r); nennerCache.set(schl, mb); }
    const q = new Float32Array(n);
    for (let p = 0; p < n; p++) q[p] = quelle[p] * mask[p];
    weichzeichnen(q, w, h, r, q);        // an Ort und Stelle, siehe unten
    for (let p = 0; p < n; p++) q[p] = mb[p] > 0.002 ? q[p] / mb[p] : quelle[p];
    return q;
  }

  // Der Zwischenpuffer der Zeilenrichtung wird wiederverwendet. Er ist rein
  // intern, kann also nicht mit einem Ergebnis kollidieren — und er war der
  // Grund fuer die Streuung der Aufbauzeit: sechs Weichzeichner-Durchgaenge
  // legten je zwei Float32Array ueber 330 000 Pixel an, zusammen rund 16 MB
  // Muell je Aufbau. Gemessen schwankte der Aufbau dadurch zwischen 246 und
  // 896 ms, obwohl die reine Rechenzeit gleich blieb.
  //
  // `ziel` darf dieselbe Reihe wie `quelle` sein: der Zeilendurchgang hat die
  // Quelle vollstaendig in `tmp` gelesen, bevor der Spaltendurchgang schreibt.
  // Glatte Felder brauchen keine Pixelaufloesung. Ein Weichzeichner mit
  // Radius 40 loescht per Definition alles, was feiner ist als 40 Pixel — ihn
  // trotzdem auf jedem Pixel zu rechnen ist verschenkte Arbeit. In halber
  // Aufloesung kostet er ein Viertel und legt ein Viertel Speicher an.
  // Zurueck geht es bilinear, weil das Feld ohnehin glatt ist.
  function halbieren(a, w, h) {
    const w2 = w >> 1, h2 = h >> 1, aus = new Float32Array(w2 * h2);
    for (let y = 0; y < h2; y++) {
      const z = 2 * y * w, z2 = y * w2;
      for (let x = 0; x < w2; x++) {
        const i = z + 2 * x;
        aus[z2 + x] = (a[i] + a[i + 1] + a[i + w] + a[i + w + 1]) * 0.25;
      }
    }
    return { a: aus, w: w2, h: h2 };
  }
  function verdoppeln(a2, w2, h2, w, h, ziel) {
    const aus = ziel || new Float32Array(w * h);
    for (let y = 0; y < h; y++) {
      const fy = Math.min(h2 - 1.001, y * 0.5);
      const y0 = fy | 0, wy = fy - y0, z0 = y0 * w2, z1 = Math.min(h2 - 1, y0 + 1) * w2;
      const z = y * w;
      for (let x = 0; x < w; x++) {
        const fx = Math.min(w2 - 1.001, x * 0.5);
        const x0 = fx | 0, wx = fx - x0, x1 = Math.min(w2 - 1, x0 + 1);
        const o = a2[z0 + x0] * (1 - wx) + a2[z0 + x1] * wx;
        const u = a2[z1 + x0] * (1 - wx) + a2[z1 + x1] * wx;
        aus[z + x] = o * (1 - wy) + u * wy;
      }
    }
    return aus;
  }

  let wzTmp = null;
  function weichzeichnen(quelle, w, h, r, ziel) {
    const d = 2 * r + 1;
    if (!wzTmp || wzTmp.length < w * h) wzTmp = new Float32Array(w * h);
    const tmp = wzTmp, aus = ziel || new Float32Array(w * h);
    const kx = x => Math.min(w - 1, Math.max(0, x));
    const ky = y => Math.min(h - 1, Math.max(0, y));
    for (let y = 0; y < h; y++) {
      const z = y * w;
      let summe = 0;
      for (let x = -r; x <= r; x++) summe += quelle[z + kx(x)];
      for (let x = 0; x < w; x++) {
        tmp[z + x] = summe / d;
        summe -= quelle[z + kx(x - r)];
        summe += quelle[z + kx(x + r + 1)];
      }
    }
    for (let x = 0; x < w; x++) {
      let summe = 0;
      for (let y = -r; y <= r; y++) summe += tmp[ky(y) * w + x];
      for (let y = 0; y < h; y++) {
        aus[y * w + x] = summe / d;
        summe -= tmp[ky(y - r) * w + x];
        summe += tmp[ky(y + r + 1) * w + x];
      }
    }
    return aus;
  }

  // Kasten um das Motiv, in Anteilen des Bildes (0..1). Dasselbe Verfahren wie
  // die Freistellung unten, nur auf einem groben Abbild: von den Ecken her
  // wachsen lassen, was uebrig bleibt, ist das Motiv.
  function motivKasten() {
    const w0 = 200;
    const h0 = Math.max(1, Math.round(w0 * img.naturalHeight / img.naturalWidth));
    const c = document.createElement('canvas');
    c.width = w0; c.height = h0;
    const cx = c.getContext('2d', { willReadFrequently: true });
    cx.drawImage(img, 0, 0, w0, h0);
    const p = cx.getImageData(0, 0, w0, h0).data;
    const anz0 = w0 * h0;
    const L = new Float32Array(anz0);
    const G = new Float32Array(anz0);   // Buntheit: 0 = grau
    for (let k = 0, i = 0; k < anz0; k++, i += 4) {
      const r = p[i], g = p[i+1], b = p[i+2];
      L[k] = (r * 0.299 + g * 0.587 + b * 0.114) / 255;
      G[k] = (Math.max(r, g, b) - Math.min(r, g, b)) / 255;
    }
    const wand = k => SCHATTEN && G[k] < GRAU && L[k] > HGMIN;

    const bg = new Uint8Array(anz0);
    const st = new Int32Array(anz0);
    let sp = 0;
    const saat = k => { if (!bg[k] && L[k] > 0.45) { bg[k] = 1; st[sp++] = k; } };
    const nimm = (q, l) => !bg[q] && (wand(q) || Math.abs(L[q] - l) < TOL);
    saat(0); saat(w0 - 1); saat((h0 - 1) * w0); saat(anz0 - 1);
    while (sp > 0) {
      const k = st[--sp], l = L[k], x = k % w0;
      if (x > 0)          { const q = k - 1;  if (nimm(q, l)) { bg[q] = 1; st[sp++] = q; } }
      if (x < w0 - 1)     { const q = k + 1;  if (nimm(q, l)) { bg[q] = 1; st[sp++] = q; } }
      if (k >= w0)        { const q = k - w0; if (nimm(q, l)) { bg[q] = 1; st[sp++] = q; } }
      if (k < anz0 - w0)  { const q = k + w0; if (nimm(q, l)) { bg[q] = 1; st[sp++] = q; } }
    }

    let x0 = w0, y0 = h0, x1 = -1, y1 = -1;
    for (let y = 0; y < h0; y++)
      for (let x = 0; x < w0; x++)
        if (!bg[y * w0 + x]) {
          if (x < x0) x0 = x; if (x > x1) x1 = x;
          if (y < y0) y0 = y; if (y > y1) y1 = y;
        }
    // Nichts gefunden (alles als Hintergrund gewachsen): lieber nichts tun als
    // auf einen unsinnigen Kasten skalieren.
    if (x1 < 0 || (x1 - x0) < 4 || (y1 - y0) < 4) return null;
    return { x: x0 / w0, y: y0 / h0,
             w: (x1 - x0 + 1) / w0, h: (y1 - y0 + 1) / h0 };
  }

  // ---- Raster aufbauen --------------------------------------------------
  function aufbauen() {
    const t0 = performance.now();
    H = SH;
    bauSW = SW; bauSH = SH;
    // Bei der Querfahrt ist der Puffer BREITER als die Buehne: die Figur steht
    // fensterhoch, und draw() schiebt beim Scrollen ein Fenster darueber. Sonst
    // ist Puffer gleich Buehne.
    W = SW;

    // Motivkasten und Pufferbreite muessen VOR der Rasterdichte feststehen:
    // die Dichte wird aus der Flaeche gerechnet, und bei der Querfahrt ist der
    // Puffer breiter als die Buehne. Andersherum griff der Deckel ins Leere —
    // gemessen 131 169 Punkte statt der angepeilten 60 000.
    const kasten = (MOTIV || FAHRT) ? (KASTEN || motivKasten()) : null;
    letzterKasten = kasten;

    if (FAHRT && kasten) {
      // Nach der HOEHE des Motivkastens skalieren, nicht nach beidem: dadurch
      // steht die Figur fensterhoch. Die Breite ergibt sich daraus und wird zur
      // Pufferbreite — dort faehrt die Ansicht entlang. Gedeckelt, damit ein
      // extremes Seitenverhaeltnis den Puffer nicht sprengt.
      const sf = SH / (kasten.h * img.naturalHeight) * (1 - RAND) * ZOOM;
      W = Math.max(SW, Math.min(4000, Math.round(img.naturalWidth * sf)));
    }
    mitte = W >> 1;

    // Rasterabstand aus einer ZIELZAHL Punkte ableiten, nicht aus festen
    // Pixeln. Bei festem Abstand waechst die Punktzahl mit der FLAECHE:
    // gemessen 39 730 Punkte auf 375x844 (1,6 ms je Bild), aber 458 732 auf
    // 2545x1440 — 40 ms, also 25 Bilder/s.
    // Ein Faktor aus der HOEHE reichte nicht (immer noch 18,5 ms), denn die
    // Flaeche waechst in zwei Richtungen. Also die Wurzel aus dem Verhaeltnis:
    // damit deckelt sich der Aufwand von selbst, auf jedem Schirm.
    // Unter dem Ziel bleibt k = 1, das Handy sieht also exakt aus wie
    // eingestellt — die Deckelung greift nur nach oben.
    const rohZahl = (W * H) / (LINIEN * PUNKTE);
    const k = Math.max(1, Math.sqrt(rohZahl / ZIEL));
    const linien = Math.max(2, Math.round(LINIEN * k));
    const punkt  = Math.max(1, Math.round(PUNKTE * k));
    const relief = RELIEF * k;
    skala = k;

    // Vorlage formatfuellend in die Buehnengroesse legen, dann daraus die
    // Helligkeiten lesen. Damit stimmt der Zuschnitt in jedem Seitenverhaeltnis,
    // ohne dass draw() spaeter noch etwas verschieben muesste.
    const tmp = document.createElement('canvas');
    tmp.width = W; tmp.height = H;
    const tctx = tmp.getContext('2d', { willReadFrequently: true });
    // Grund erst decken, dann das Bild darauf. Wichtig bei 'ganz': ausserhalb
    // des Bildes waere die Flaeche sonst durchsichtig und damit Helligkeit 0 —
    // mit ?invert=an wuerde daraus 1 und der leere Raum glühte auf.
    //
    // Der Ton kommt aus der ECKE DES FOTOS, nicht aus Weiss oder Schwarz. Mit
    // festem Weiss blieb der Bildrand als sichtbares Rechteck stehen: die Wand
    // im Foto ist eben nicht rein weiss, und die Kante dazwischen sprang ins
    // Auge. So geht der leere Raum nahtlos in den Hintergrund des Fotos ueber.
    const eck = document.createElement('canvas');
    eck.width = eck.height = 8;
    const ectx = eck.getContext('2d', { willReadFrequently: true });
    ectx.drawImage(img, 0, 0, 8, 8);
    const e = ectx.getImageData(0, 0, 1, 1).data;
    tctx.fillStyle = 'rgb(' + e[0] + ',' + e[1] + ',' + e[2] + ')';
    tctx.fillRect(0, 0, W, H);

    // Bei 'motiv' zuerst grob ermitteln, wo die Person ueberhaupt sitzt. Grob
    // reicht: 200 px Breite kosten nichts und der Kasten muss nur auf ein paar
    // Pixel genau stimmen.
    let s, iw, ih, ix, iy;
    if (FAHRT && kasten) {
      s = SH / (kasten.h * img.naturalHeight) * (1 - RAND) * ZOOM;
      iw = img.naturalWidth * s; ih = img.naturalHeight * s;
      ix = (W - iw) / 2;
      iy = H / 2 - (kasten.y + kasten.h / 2) * ih;
    } else if (kasten) {
      // So skalieren, dass der Motivkasten ins Fenster passt, und so
      // verschieben, dass er mittig sitzt. Das Bild ragt dabei ueber den Rand
      // hinaus — das ist gewollt, dort steht ohnehin nur Wand.
      s = Math.min(W / (kasten.w * img.naturalWidth),
                   H / (kasten.h * img.naturalHeight)) * (1 - RAND) * ZOOM;
      iw = img.naturalWidth * s; ih = img.naturalHeight * s;
      ix = W / 2 - (kasten.x + kasten.w / 2) * iw;
      iy = H / 2 - (kasten.y + kasten.h / 2) * ih;
    } else {
      s = (GANZ ? Math.min(W / img.naturalWidth, H / img.naturalHeight)
                : Math.max(W / img.naturalWidth, H / img.naturalHeight)) * ZOOM;
      iw = img.naturalWidth * s; ih = img.naturalHeight * s;
      ix = (W - iw) / 2; iy = (H - ih) / 2;
    }
    // Senkrechte Lage der Figur frei waehlbar. Die Wand wird ohnehin
    // weggeschnitten, also muss das Foto die Buehne nicht mehr fuellen — im
    // Gegenteil: unter der Figur soll Boden sichtbar bleiben. Deshalb kein
    // Einrasten nach unten mehr (das war noetig, solange die Wand im Bild war)
    // und keine fortgesetzte Randzeile.
    if (!FAHRT) {
      iy = FIGY * H - (kasten ? (kasten.y + kasten.h / 2) * ih : ih / 2);
      ix = Math.max(W - iw, Math.min(0, ix));
    }

    tctx.drawImage(img, ix, iy, iw, ih);

    // Die Tiefenkarte mit DEMSELBEN drawImage in ein zweites Canvas legen.
    // Dann passt sie per Konstruktion pixelgenau zum Foto — kein eigener
    // Umrechnungsschritt, der auseinanderlaufen koennte. Der Grund ist
    // Schwarz (= ganz hinten), damit ausserhalb des Fotos nichts nach vorn
    // springt.
    let tief = null;
    if (tiefeDa) {
      const tk = document.createElement('canvas');
      tk.width = W; tk.height = H;
      const kctx = tk.getContext('2d', { willReadFrequently: true });
      kctx.fillStyle = '#000';
      kctx.fillRect(0, 0, W, H);
      kctx.drawImage(tImg, ix, iy, iw, ih);
      tief = kctx.getImageData(0, 0, W, H).data;
    }
    // Fotounterkante in Buehnenpixeln — dort hoert die Person auf, weil das
    // Foto ein Brustbild ist. Der Uebergang in Staub passiert beim Erzeugen
    // der Figurpunkte, nicht hier als Farbverlauf: ein Verlauf im Bild wuerde
    // die Maske mit aufweichen.
    const fotoUnten = iy + ih;

    // Strecke der Querfahrt: ueber das MOTIV, nicht ueber das Bildrechteck.
    // Ueber das Rechteck stand die Ansicht am Anfang auf der leeren Wand links —
    // freigestellt also auf Schwarz, und die ersten Sekunden des Scrollens
    // zeigten nichts. Jetzt startet sie an der linken Kante der Person und
    // endet an der rechten.
    if (FAHRT && kasten && W > SW) {
      const grenze = v => Math.max(0, Math.min(W - SW, v));
      panVon = grenze(ix + kasten.x * iw);
      panBis = grenze(ix + (kasten.x + kasten.w) * iw - SW);
    } else {
      panVon = panBis = 0;
    }

    const px = tctx.getImageData(0, 0, W, H).data;
    const tVorlage = performance.now();

    pcv.width = W; pcv.height = H;
    // Faellt der GL-Pfad aus IRGENDEINEM Grund aus — kein WebGL2, kein
    // Float-Zielpuffer, ein Treiber, der die Shader nicht uebersetzt —, dann
    // laeuft der CPU-Pfad unveraendert weiter. Ein geworfener Shader-Fehler
    // duerfte den Aufbau nicht mitreissen.
    if (GL && !gl && !glAus) {
      try { if (!glStart()) glAus = 'kein WebGL2 mit Float-Zielpuffer'; }
      catch (e) { glAus = String(e.message || e); }
    }
    pimg = pctx.createImageData(W, H);
    buf32 = new Uint32Array(pimg.data.buffer);
    // Tiefenpuffer. Ohne ihn malen die spaeter erzeugten Bodenringe ueber die
    // Schulter, sobald die Figur beim Schwenken zur Seite geht.
    // Helligkeitsspeicher zum Addieren. Ein Feld statt dreier Farbkanaele —
    // moeglich, weil das Bild einfarbig ist.
    acc = new Float32Array(W * H);

    // Feld fuer die Beruehrungsspur, in Pufferpixeln wie alles andere.
    gw = Math.ceil(W / 8); gh = Math.ceil(H / 8);
    F = new Float32Array(gw * gh);
    spurPunkte.length = 0; letzterZeiger = null; spurAktiv = false;

    const anz = W * H;
    const lum = new Float32Array(anz);
    const bunt = new Float32Array(anz);   // Buntheit: 0 = grau
    for (let p = 0, i = 0; p < anz; p++, i += 4) {
      const r = px[i], g = px[i+1], b = px[i+2];
      lum[p] = (r * 0.299 + g * 0.587 + b * 0.114) / 255;
      bunt[p] = (Math.max(r, g, b) - Math.min(r, g, b)) / 255;
    }
    // Wandartig heisst: grau — UND entweder hell genug ODER laut Tiefenkarte
    // weit weg.
    //
    // Das Bereichswachstum bleibt das Verfahren, denn es folgt weichen
    // Verlaeufen und haelt an Kanten; eine Schwelle auf der Tiefenkarte kann
    // das nicht. Zweimal probiert und beide Male am Hals gescheitert: dort
    // liest das Modell den tiefen Schatten unter dem Kiefer als weit weg, und
    // es riss ein Keil aus dem Hals (gemessen 20 statt 830 Punkte). Auch ein
    // UND aus Tiefe und Buntheit half nicht (48) — der Halsschatten ist grau
    // UND weit weg, beide Stimmen liegen dort gleich falsch.
    //
    // Die Tiefe hilft aber genau da, wo die Helligkeitsgrenze zu grob war:
    // der Schlagschatten an der Wand ist grau und DUNKEL, also brauchte es
    // frueher `hgmin`, um ihn zu treffen — und dieselbe Grenze frass dann den
    // beschatteten Unterarm. Der Unterarm ist nah, der Schatten weit weg.
    // Wandartig heisst: grau, hell genug — und laut Tiefenkarte NICHT nah.
    //
    // Die Tiefe taugt hier fuer genau eine Sache: `hgmin` musste einmal von
    // 0.30 auf 0.50 steigen, weil das Wachstum sonst die beschattete
    // Unterseite des Unterarms auffrass (grau und dunkel, wie ein
    // Schlagschatten). Damit blieb aber der Schatten neben dem Kopf stehen.
    // Der Unterarm ist eindeutig NAH (ueber 200 von 255), der Schatten liegt
    // auf der Wand. Also darf `hgmin` wieder herunter, solange Nahes geschuetzt
    // ist.
    //
    // Was die Tiefe hier NICHT darf: selbst entscheiden, was Hintergrund ist.
    // Zweimal probiert, zweimal gescheitert — die linke Halsseite hat in der
    // Karte 47,4 von 255 und die Wand 49,4, also denselben Wert. Das Modell
    // liest den tiefen Schatten am Hals-Schulter-Uebergang als Hintergrund.
    // Als Schwelle riss das einen Keil aus dem Hals (27 statt 830 Punkte, und
    // keine Schwelle half); ins Wachstum gezogen flutete es das ganze Shirt
    // (freigestellt 82 % statt 70), weil ein einziger Einstieg genuegt und die
    // Toleranzregel den Rest erledigt.
    const nahSw = NAHTIEFE * 255;
    const istNah = p => tief && MASKE !== 'bunt' && tief[p * 4] > nahSw;
    // Und die Gegenrichtung: was laut Karte WEITER WEG liegt als alles an der
    // Person, darf auch dann Wand sein, wenn es dunkel ist. Genau das ist der
    // Schlagschatten — er liegt auf der Wand, also in Wandentfernung.
    //
    // Der Regler daran ist der Grund, warum `hgmin` nicht gesenkt werden muss.
    // Erster Anlauf war `hgmin` 0.30 -> 0.15, weil der Schatten mit lum 0.267
    // unter 0.30 liegt. Das hat funktioniert, aber es ist eine GLOBALE
    // Helligkeitsschwelle, und das Shirt liegt mit 0.186 in derselben Gegend:
    // gemessen verlor es 7 353 Pixel, mehr als das Doppelte dessen, was der
    // Schatten ueberhaupt gross ist (3 057). Dazu Hals -1 989, Gesicht -1 453,
    // Haare -256. Moritz hat es im Bild gesehen, bevor ich es gemessen hatte.
    //
    // Der belastbare Unterschied ist nicht die Helligkeit, sondern die TIEFE:
    // Schatten 13..22 von 255, Shirt 137, Hals 55..64. Eine Schwelle bei 0.12
    // (=31) trennt das mit Luft nach beiden Seiten.
    const fernSw = FERNTIEFE * 255;
    const istFern = p => tief && MASKE !== 'bunt' && tief[p * 4] < fernSw;
    const wandArtig = p => SCHATTEN && bunt[p] < GRAU
                        && (lum[p] > HGMIN || istFern(p))
                        && !istNah(p);


    // ---- Maske: was gehoert zur Person? ---------------------------------
    // Frueher hiess das "Hintergrund freistellen" und diente dazu, die Wand auf
    // Helligkeit 0 zu setzen. Jetzt ist es die TRENNUNG zwischen den beiden
    // Ebenen: wo die Maske "Person" sagt, entstehen Figurpunkte, sonst Boden.
    // Damit traegt sie den ganzen Look — ein Loch faellt auf dunklem Grund
    // sofort auf. Deshalb wird sie immer gerechnet, nicht mehr nur auf Wunsch.
    //
    // Verfahren: Bereichswachstum von den ECKEN her, nicht ueber eine feste
    // Schwelle. Die Wand hat einen Verlauf (links deutlich dunkler), eine feste
    // Schwelle schnitte mitten hindurch. Das Wachstum folgt weichen Verlaeufen
    // und bleibt an der harten Kante der Person stehen.
    // Ecken statt ganzer Raender als Saat: die Arme reichen bis an die
    // Bildseiten, ein beliebiges Randpixel koennte also die Person selbst sein.
    const hg = new Uint8Array(anz);           // 1 = Hintergrund
    let frei = 0;
    {
      const stapel = new Int32Array(anz);
      let sp = 0;
      // Saat nur, wo es wirklich hell ist — eine dunkle Ecke duerfte sonst
      // anfangen, die Person aufzufressen.
      const saat = p => { if (!hg[p] && lum[p] > 0.45) { hg[p] = 1; stapel[sp++] = p; } };
      // `istNah` sperrt BEIDE Wege, nicht nur `wandArtig`. Vorher steckte es
      // allein in `wandArtig`, und damit war die Toleranzregel ein Leck: ein
      // einziger Einstieg irgendwo am Rand der Person genuegte, danach lief
      // das Wachstum ueber den weichen Verlauf quer durchs Shirt weiter.
      // Gemessen an genau dieser Klippe — `hgmin` 0.20 -> 0.18 sprang von 68 %
      // auf 81,7 % freigestellt und von 75 460 auf 46 650 Figurpunkte, also
      // die halbe Figur bei zwei Hundertsteln Reglerweg. Was die Tiefenkarte
      // klar als nah ausweist, darf nie Hintergrund werden, egal auf welchem
      // Weg das Wachstum dorthin kommt.
      const nimm = (q, l) => !hg[q] && !istNah(q)
                          && (wandArtig(q) || Math.abs(lum[q] - l) < TOL);
      saat(0); saat(W - 1); saat((H - 1) * W); saat(anz - 1);
      while (sp > 0) {
        const p = stapel[--sp];
        const l = lum[p], x = p % W;
        if (x > 0)       { const q = p - 1; if (nimm(q, l)) { hg[q] = 1; stapel[sp++] = q; } }
        if (x < W - 1)   { const q = p + 1; if (nimm(q, l)) { hg[q] = 1; stapel[sp++] = q; } }
        if (p >= W)      { const q = p - W; if (nimm(q, l)) { hg[q] = 1; stapel[sp++] = q; } }
        if (p < anz - W) { const q = p + W; if (nimm(q, l)) { hg[q] = 1; stapel[sp++] = q; } }
      }
    }
    {
      // Alles unterhalb der Fotokante gehoert nicht zur Person — dort ist gar
      // kein Foto mehr, sondern die Grundfarbe.
      const uy = Math.max(0, Math.min(H, Math.ceil(fotoUnten)));
      for (let p = uy * W; p < anz; p++) hg[p] = 1;
      for (let p = 0; p < anz; p++) if (hg[p]) frei++;
    }
    // Waagerechte Ausdehnung der Figur — daraus wird weiter unten geeicht, wie
    // tief sie im Raum sein darf. Ein Mensch ist grob halb so tief wie breit.
    // Schwerpunkt und Unterkante der Figur. Der Schwerpunkt, nicht die Mitte
    // des Kastens: die Maske ist hier 374 px breit, also so breit wie die
    // ganze Buehne (der Arm laeuft rechts aus dem Foto, die Schulter beruehrt
    // links den Rand). Der Kasten sagt ueber die Lage der Person also nichts.
    let figSx = 0, figAnz = 0;
    for (let y = 0; y < H; y++) {
      const z0 = y * W;
      for (let x = 0; x < W; x++) {
        if (hg[z0 + x]) continue;
        figSx += x; figAnz++;
      }
    }
    const figMitte = figAnz ? figSx / figAnz : W / 2;
    const tFrei = performance.now();

    // ---- Tiefe: die Silhouette aufblasen --------------------------------
    // Aus einem einzigen Foto gibt es keine echte Tiefe. Was es gibt, ist die
    // Silhouette — und je weiter ein Pixel von ihrem Rand entfernt liegt, desto
    // weiter vorn liegt es an einem Koerper. Das ist die Distanztransformation:
    // zwei Durchgaenge ueber das Bild (Chamfer 3-4), danach steht in `dist` der
    // Abstand zum naechsten Hintergrundpixel, in Dritteln eines Pixels.
    // Die Wurzel darauf macht aus der Kegelform eine Woelbung: steil am Rand,
    // flach in der Mitte, wie ein Arm.
    const dist = new Float32Array(anz);
    {
      const GROSS = 1e9;
      for (let p = 0; p < anz; p++) dist[p] = hg[p] ? 0 : GROSS;
      for (let y = 0; y < H; y++) {
        const z0 = y * W;
        for (let x = 0; x < W; x++) {
          const p = z0 + x;
          if (dist[p] === 0) continue;
          let m = dist[p];
          if (x > 0)              m = Math.min(m, dist[p - 1] + 3);
          if (y > 0)              m = Math.min(m, dist[p - W] + 3);
          if (y > 0 && x > 0)     m = Math.min(m, dist[p - W - 1] + 4);
          if (y > 0 && x < W - 1) m = Math.min(m, dist[p - W + 1] + 4);
          dist[p] = m;
        }
      }
      for (let y = H - 1; y >= 0; y--) {
        const z0 = y * W;
        for (let x = W - 1; x >= 0; x--) {
          const p = z0 + x;
          if (dist[p] === 0) continue;
          let m = dist[p];
          if (x < W - 1)              m = Math.min(m, dist[p + 1] + 3);
          if (y < H - 1)              m = Math.min(m, dist[p + W] + 3);
          if (y < H - 1 && x < W - 1) m = Math.min(m, dist[p + W + 1] + 4);
          if (y < H - 1 && x > 0)     m = Math.min(m, dist[p + W - 1] + 4);
          dist[p] = m;
        }
      }
    }
    // Rand der Silhouette: hoechstens anderthalb Pixel vom Hintergrund weg.
    // Faellt als Nebenprodukt der Distanztransformation ab, kostet also nichts.
    const istRand = p => dist[p] > 0 && dist[p] <= 4.5;

    // Tiefe je Pixel, 0 = hinten, 1 = vorn. Zwei Quellen, gleiche Skala.
    const tiefeP = new Float32Array(anz);
    if (tief) {
      // Normiert wird NUR ueber die Figur, mit denselben 2/98-Perzentilen wie
      // die Tonwertspreizung weiter unten. Ueber das ganze Bild gerechnet
      // bestimmte die Wand die Skala und die Person bliebe flach — genau
      // dieser Fehler stand schon einmal in der Spreizung.
      const hist = new Uint32Array(256);
      let z = 0;
      for (let p = 0; p < anz; p++) if (!hg[p]) { hist[tief[p * 4]]++; z++; }
      let u = 0, o = 255;
      if (z > 32) {
        let acc = 0;
        for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= z * 0.02) { u = v; break; } }
        acc = 0;
        for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc >= z * 0.02) { o = v; break; } }
      }
      const spanne = Math.max(1, o - u);
      for (let p = 0; p < anz; p++) tiefeP[p] = clamp01((tief[p * 4] - u) / spanne);
    } else {
      // Rueckfall ohne Karte: die Silhouette aufblasen. Je weiter ein Pixel vom
      // Rand entfernt liegt, desto weiter vorn — die Wurzel macht aus dem Kegel
      // eine Woelbung. Das ist eine Vermutung ueber die Form, keine Messung:
      // duenne Dinge landen hinten, auch wenn sie vorn sind. Deshalb ist die
      // Karte die Vorgabe.
      let dmax = 0;
      for (let p = 0; p < anz; p++) if (dist[p] > dmax && dist[p] < 1e8) dmax = dist[p];
      const aufblas = AUFBLAS > 0 ? AUFBLAS : Math.max(4, dmax / 3);
      for (let p = 0; p < anz; p++) tiefeP[p] = Math.sqrt(clamp01(dist[p] / 3 / aufblas));
    }
    // NORMALE aus der Tiefenkarte, und daraus zwei Felder:
    //   ndl  — N mal L, die eigentliche Beleuchtung.
    //   rand — 1 - nz, wie weit die Flaeche von der Kamera wegkippt.
    //
    // Vorher stand hier `sqrt(dx*dx + dy*dy)`, der BETRAG des Gefaelles. Der
    // ist rotationsinvariant und weiss deshalb nicht, WOHIN eine Flaeche
    // zeigt — er kennt nur "steil" und "flach", also Kante und keine Kante.
    // Damit war jede Helligkeit, die daraus kam, zwangslaeufig ein Umriss.
    // Aus denselben zwei Ableitungen faellt die volle Normale ab; es fehlte
    // nur das Vorzeichen und die Normierung.
    //
    // 1 = gehoert zur Person. Traegt alle drei Weichzeichner unten.
    const drin = new Float32Array(anz);
    for (let p = 0; p < anz; p++) drin[p] = hg[p] ? 0 : 1;
    nennerCache.clear();   // die Maske ist neu, der Nenner also auch
    const dH = halbieren(drin, W, H);   // Maske in halber Aufloesung

    // Ein Durchgang, kein Dreieckskern. Zwei Durchgaenge mit halbem Radius
    // waeren glatter (die Kastenkanten stehen sonst als Stufen in der
    // Beleuchtung), aber im fertigen Bild ist davon nichts zu sehen: die
    // Punktwolke ist selbst koerniger als die Stufe. Kostet dafuer zwei
    // Weichzeichner-Durchgaenge weniger im Aufbau.
    const ndl  = new Float32Array(anz);
    const rand = new Float32Array(anz);
    {
      const tH = halbieren(tiefeP, W, H);
      const zg = weichzeichnenMaskiert(tH.a, dH.a, tH.w, tH.h,
                                       Math.max(1, NRADIUS >> 1));
      const w = LICHT * Math.PI / 180;
      // Licht steht schraeg vor der Figur; z-Anteil fest, damit `licht` nur
      // die Richtung dreht und nicht auch die Gesamthelligkeit aendert.
      let lx = Math.cos(w), ly = -Math.sin(w), lz = 0.85;
      const ll = Math.hypot(lx, ly, lz);
      lx /= ll; ly /= ll; lz /= ll;
      const w2 = tH.w, h2 = tH.h;
      const n2 = new Float32Array(w2 * h2), r2 = new Float32Array(w2 * h2);
      // In halber Aufloesung ist ein Pixel doppelt so breit, die Steigung je
      // Pixel also doppelt so gross — deshalb NSKALA halbieren, damit
      // `?nskala=` dieselbe Bedeutung behaelt wie vorher.
      const sk = NSKALA * 0.5;
      for (let y = 1; y < h2 - 1; y++) {
        const z0 = y * w2;
        for (let x = 1; x < w2 - 1; x++) {
          const q = z0 + x;
          const dx = (zg[q + 1] - zg[q - 1]) * 0.5 * sk;
          const dy = (zg[q + w2] - zg[q - w2]) * 0.5 * sk;
          // N = normalize(-dx, -dy, 1). Die Karte ist inverse Tiefe (hell =
          // nah), also zeigt +z zur Kamera und die Vorzeichen stimmen so.
          const il = 1 / Math.sqrt(dx * dx + dy * dy + 1);
          const nx = -dx * il, ny = -dy * il, nz = il;
          const d = nx * lx + ny * ly + nz * lz;
          n2[q] = d > 0 ? d : 0;
          r2[q] = 1 - nz;
        }
      }
      verdoppeln(n2, w2, h2, W, H, ndl);
      verdoppeln(r2, w2, h2, W, H, rand);
    }
    const tTiefe = performance.now();

    // Lokaler Kontrast MIT SCHWELLE. Ohne Schwelle verstaerkt die
    // Unschaerfemaske jeden Unterschied zur Nachbarschaft — also auch die
    // Struktur der Wand und das Rauschen der Kamera. Vor heller Wand stand
    // dadurch die halbe Buehne voller senkrechter Baender; nachgemessen war es
    // eine Helligkeitsschwankung von rund 6 %, ohne Periodizitaet, und mit
    // `?schaerfe=0` verschwand sie. Nur wollte ich die Schaerfe ja gerade
    // wegen Kette und Ringen.
    // Der Unterschied ist die HOEHE des Ausschlags: Wandstruktur ist flach,
    // eine Kette auf schwarzem Shirt ist ein Sprung. Alles unterhalb der
    // Schwelle bleibt liegen, darueber wird voll verstaerkt.
    // STRUKTUR statt Belichtung. Der Ausschlag gegen die Nachbarschaft wird
    // nicht nur zum Nachschaerfen benutzt, sondern aufgehoben: er ist genau
    // das, was der Hologramm-Look aus dem Foto braucht. Eine ausgefressene
    // Fläche wie der Unterarm ist darin flach (also nichts), eine Kette auf
    // schwarzem Shirt ein Sprung. Deshalb traegt der Arm nicht mehr die halbe
    // Bildhelligkeit, obwohl er im Foto der hellste Fleck ist.
    // ZWEI Massstaebe, und das ist der Kern des Ganzen:
    //   det — kleiner Radius: Kette, Ringe, Brillenrand, Naehte.
    //   ton — GROSSER Radius: die Tonwerte des Gesichts, Stirn gegen
    //         Augenhoehle, Falten im Shirt.
    // Der grosse Radius nimmt die GLOBALE Belichtung heraus, behaelt aber die
    // Modellierung. Genau das war gesucht: der Unterarm ist weiss, weil der
    // Blitz ihn ausgefressen hat — gegen seine eigene Umgebung ist er flach.
    // Das Gesicht ist gegen seine Umgebung stark moduliert und bleibt.
    //
    // Erster Versuch war, das Foto nur ueber den kleinen Radius einzubringen.
    // Kette und Druck kamen damit sauber heraus, aber das GESICHT verschwand:
    // es lebt von Tonwerten, nicht von feinen Kanten.
    const ton = new Float32Array(anz);
    {
      // ASYMMETRISCH: aufhellen voll, abdunkeln nur gedaempft.
      //
      // Ein Weichzeichner mit grossem Radius hebt neben einer hellen Stelle
      // den oertlichen Mittelwert an — und alles Dunklere direkt daneben
      // rutscht dadurch auf null. Das ist der klassische Halo, und er sah hier
      // aus wie ein Schlagschatten: ein dunkler Saum links neben dem hellen
      // Kopf, ein Streifen unter dem hellen Kinn, und ein Umriss um JEDEN
      // hellen Finger. Genau daran war es zu erkennen — eine Wand wirft keinen
      // Schatten um einzelne Finger.
      // Gegenprobe: mit HTON = 0 waren alle drei weg.
      const lH = halbieren(lum, W, H);
      const grobH = weichzeichnenMaskiert(lH.a, dH.a, lH.w, lH.h,
                                          Math.max(1, TONRADIUS >> 1));
      const grob = verdoppeln(grobH, lH.w, lH.h, W, H);
      for (let p = 0; p < anz; p++) {
        const d = lum[p] - grob[p];
        ton[p] = clamp01(0.5 + TONSKALA * (d > 0 ? d : d * TONDUNKEL));
      }
    }

    const det = new Float32Array(anz);
    if (SCHAERFE > 0) {
      const weich = weichzeichnenMaskiert(lum, drin, W, H, RADIUS);
      for (let p = 0; p < anz; p++) {
        let d = lum[p] - weich[p];
        if (d > SCHWELLE) d -= SCHWELLE;
        else if (d < -SCHWELLE) d += SCHWELLE;
        else d = 0;
        det[p] = d;
        lum[p] = clamp01(lum[p] + SCHAERFE * d);
      }
    }
    const tSchaerfe = performance.now();

    // ---- Tonwerte spreizen, NUR ueber dem Motiv -------------------------
    // Vorher lief die Spreizung ueber das ganze Bild. Da mehr als die Haelfte
    // davon Wand war, bestimmten deren Werte die Perzentile, und fuer die
    // Person blieb kaum Spielraum uebrig — die Spreizung tat sichtbar nichts,
    // und ich habe das zuerst nicht nachgeprueft.
    let lo = 0, hi = 1;
    if (KONTRAST) {
      const hist = new Uint32Array(256);
      let z = 0;
      for (let p = 0; p < anz; p++) if (!hg[p]) { hist[(lum[p] * 255) | 0]++; z++; }
      if (z > 32) {
        let acc = 0, u = 0, o = 255;
        for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= z * 0.02) { u = v; break; } }
        acc = 0;
        for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc >= z * 0.02) { o = v; break; } }
        lo = u / 255; hi = Math.max(lo + 0.05, o / 255);
      }
    }
    // KEIN Rauschen auf der Helligkeit. Die Wand hat ueber ihre ganze Breite
    // nur 24 Stufen (gemessen an der Vorlage: 199..226), das sah nach der
    // Ursache der senkrechten Baender aus. Zweimal eingebaut, zweimal
    // nebeneinander verglichen (Staerke 0, 1, 2, 4) — beide Male kein
    // sichtbarer Unterschied. Die Baender kamen erst von der Strichstaerke
    // (der inzwischen geloeschten `dicke`) und dann vom lokalen Kontrast ohne
    // Schwelle (siehe SCHWELLE).
    // Nicht ein drittes Mal einbauen.
    const hell = i => {
      const p = i >> 2;
      if (hg[p]) return 0;                    // Hintergrund traegt nichts bei
      const v = clamp01((lum[p] - lo) / (hi - lo));
      return INVERT ? 1 - v : v;
    };
    freiAnteil = frei / anz;

    // Erst sammeln, dann in typisierte Felder giessen: beim Ringmuster haengt
    // die Punktzahl davon ab, wie viel jedes Rings ueberhaupt in der Buehne
    // liegt — das laesst sich nicht vorher ausrechnen, nur zaehlen.
    // sart: 0 = Figur, 1 = Bodenring, 2 = Staub, 3 = Randlicht der Figur.
    // Kameraparameter. Stehen hier oben, weil schon die Figur ihre Tiefe
    // daraus ableitet.
    // Hauptpunkt der Kamera. Frueher lagen hier Horizont und Ringmittelpunkt
    // des Bodens; ohne Boden ist der Hauptpunkt schlicht die Bildmitte, wie
    // bei einer Lochkamera ueblich.
    const pMx = W / 2, pMy = H / 2;

    // szc: Tiefe VOR DER KAMERA, in Welteinheiten. Damit
    // laesst sich jeder Punkt exakt auf seine Weltposition zurueckrechnen,
    // und alle Sorten drehen sich mit derselben Formel.
    const sx = [], sy = [], sl = [], sz = [], szc = [], sart = [];
    // Entfernung der Figur. Ohne Boden gibt es nichts mehr, woran sie sich
    // ausrichten muesste — und der Ausschlag beim Schwenken haengt gar nicht
    // daran: die Verschiebung ist BRENN·(reliefTiefe/zfig)·sin(w), und weil
    // reliefTiefe als Anteil von zfig definiert ist, kuerzt sich zfig heraus.
    // Der Wert legt also nur fest, wie stark die Perspektive ueberhaupt
    // greift. ?raum= ist der Regler, der wirklich etwas tut.
    const zfig = ZFIG > 0 ? ZFIG : 8;
    // Wie tief die Figur ist, als ANTEIL ihrer Entfernung. Physikalisch
    // gelesen: die Kamera steht HOEHE = 1 ueber dem Boden, eine Welteinheit
    // ist also rund Augenhoehe (1,6 m), und zfig = 2,2 heisst gut 3,5 m
    // Abstand. Ein Mensch ist ungefaehr 30 cm tief, mit vorgestrecktem Arm
    // rund 70 cm — das sind 0,44 Einheiten, also ein knappes Fuenftel.
    //
    // NICHT aus der Maskenbreite ableiten, wie zuerst versucht: die ist hier
    // die ganze Buehne. Daraus wurde eine Figur, die 40 % ihrer Entfernung
    // tief war, und bei 20 Grad schwang sie heftig aus statt zu schwenken.
    // ?raum= regelt nach.
    const reliefTiefe = RAUM * 0.2 * zfig;
    // Weltposition der Drehachse: senkrecht DURCH DIE FIGUR. Vorher lag sie
    // bei bx, also beim Ringmittelpunkt — und der steht mit bodenx=1.9 gut
    // 700 px rechts neben der Buehne. Die Figur schwenkte dadurch weit aus,
    // statt zu stehen und den Raum um sich ziehen zu lassen.
    const xAchse = (figMitte - pMx) * zfig / BRENN;

    // ---- 1. Figur --------------------------------------------------------
    // Zeilenraster, nicht Ringe. Im Vorbild ist die Figur eine MASSE mit feiner
    // waagerechter Struktur; Ringe wuerden hier wieder Linien ergeben, und
    // genau die haben ihr bisher die eigene Kontur genommen.
    const figZiel = Math.max(2000, ZIEL * ANTEIL);
    const motivPx = anz - frei;
    const kFig = Math.max(1, Math.sqrt(motivPx / (FIGLINIEN * FIGPUNKTE) / figZiel));
    const figLinien = ZEIGE === 'maske' ? 1 : Math.max(1, Math.round(FIGLINIEN * kFig));
    const figPunkt  = ZEIGE === 'maske' ? 1 : Math.max(1, Math.round(FIGPUNKTE * kFig));
    // Uebergang in Staub an der Fotounterkante: das Foto ist ein Brustbild, die
    // Person hoert dort an einer schnurgeraden Kante auf. Statt eines
    // Farbverlaufs im Bild (der die Maske aufweichen wuerde) fallen hier
    // einfach immer mehr Punkte weg, je naeher die Kante kommt.
    // Helligkeit eines Figurpunktes. Nicht mehr die Belichtung des Fotos,
    // sondern die Form: wie nah, wie schraeg — und ein Hauch Vorlage fuer
    // Kette, Ringe und Brille.
    const hlSkala = HLINIEN;
    // Struktur an dieser Stelle: Gefaelle der Tiefe plus feiner Bildkontrast.
    // Traegt doppelt — sie bestimmt die Helligkeit UND wie dicht abgetastet wird.
    // DUNKLE und HELLE Kanten getrennt gewichtet. Augenbrauen, Brillenrand,
    // Pupillen, Nasenloecher und die Kette im Gegenlicht sind alle DUNKLER als
    // ihre Umgebung; das Korn der Haare und Glanzlichter auf der Haut sind
    // heller. Beide gleich zu verstaerken (der reine Betrag) liess das Haar
    // das Gesicht uebertoenen — mit Schwelle 0 war der Kopf eine helle Masse.
    // Dunkle Kanten hell zu zeichnen ist ausserdem genau das, was ein Scan
    // tut: er zeichnet Konturen, nicht Beleuchtung.
    // Feine Struktur aus dem Foto — dunkle und helle Kanten getrennt
    // gewichtet (Augenbrauen, Brillenrand, Pupillen sind dunkler als ihre
    // Umgebung, Haarkorn und Glanzlichter heller).
    const detail = p => {
      const d = det[p];
      return clamp01((d < 0 ? -d * HDUNKEL : d * HHELL) * HDETAIL);
    };
    // Wo wird dicht abgetastet: wo Struktur ist, egal aus welcher Quelle.
    const struktur = p => HFOTO * detail(p) + rand[p];

    const hologramm = (p, nah, l) => {
      // Einzelne Terme sichtbar machen. Ohne das rate ich, welcher Summand
      // ein Bild dominiert — und genau daran habe ich drei Runden verloren:
      // erst war die Maske schuld, dann ein Halo, dann `hkante`, und keines
      // davon stimmte. Ein Term, ein Bild, keine Vermutung.
      switch (ZEIGE) {
        case 'maske':  return 1;
        case 'ton':    return ton[p];
        case 'detail': return detail(p);
        case 'albedo': return (HMATERIAL + HTON * ton[p] + HFOTO * detail(p)) * 0.5;
        case 'licht':  return HAMBIENT + (1 - HAMBIENT) * ndl[p];
        case 'ndl':    return ndl[p];
        case 'rand':   return rand[p];
        case 'nah':    return nah;
      }
      // ALBEDO mal BELEUCHTUNG. Das Foto sagt WAS es ist, die Normale sagt
      // WIE es steht. Getrennt gehalten ist das der ganze Unterschied zum
      // "Foto mit Punkten drauf": die Beleuchtung kommt nicht mehr aus der
      // Kamera, sondern aus der Form.
      const albedo = HMATERIAL + HTON * ton[p] + HFOTO * detail(p);
      const licht  = HAMBIENT + (1 - HAMBIENT) * ndl[p];
      // Streiflicht additiv, nicht multiplikativ: eine Silhouette leuchtet
      // auch dort, wo kein Licht hinfaellt — das macht das Hologramm.
      let b = albedo * licht
            + HRAND * rand[p]
            + HTIEFE * nah * nah;
      if (hlSkala > 0) {
        // Dreieckswelle ueber die Tiefe: gleichmaessige Baender, ohne Sprung
        // an der Nahtstelle. Ein Sinus waere hier eine Tabelle wert, aber das
        // laeuft nur beim Aufbau.
        const f = nah * hlSkala % 1;
        b += HLSTAERKE * (1 - Math.abs(f * 2 - 1));
      }
      return HELL * b;   // nicht geklemmt: das Addieren deckelt selbst
    };

    const saumBand = Math.max(1, ih * SAUM);
    const saumVon = fotoUnten - saumBand;
    // Jede Zeile und jede Spalte durchgehen, aber nur einen Teil davon
    // behalten: das grobe Raster ueberall, jedes Pixel dort, wo Struktur ist.
    for (let y = 0; y < H; y++) {
      const z0 = y * W;
      const aufZeile = (y % figLinien) === 0;
      const halt = (SAUM > 0 && y > saumVon)
                 ? clamp01((fotoUnten - y) / saumBand) : 1;
      for (let x = 0; x < W; x++) {
        const p = z0 + x;
        if (hg[p]) continue;
        if (!(FEIN > 0 && struktur(p) > FEIN)
            && !(aufZeile && (x % figPunkt) === 0)) continue;
        if (halt < 1 && Math.random() > halt * halt) continue;
        const l = hell(p * 4);
        // Tiefe: Abstand zum Silhouettenrand, in Pixeln (dist zaehlt Drittel).
        // Die Wurzel macht aus dem Kegel eine Woelbung — steil am Rand, flach
        // in der Mitte, wie ein Arm.
        const nah = tiefeP[p];
        // STOCHASTISCH abtasten statt auf dem Gitter. Die Punkte entstehen
        // sonst auf ganzen Pixeln, und dann kann auch das Subpixel-Splatting
        // unten nichts verteilen: bei Spaltenabstand 2 bleibt jede zweite
        // Spalte leer und das Bild ist senkrecht gestreift. Ein Zufallsversatz
        // innerhalb der eigenen Rasterzelle kostet nichts, aendert die
        // Punktzahl nicht und tauscht das Streifenmuster gegen Koernung —
        // und Koernung ist bei einer Punktwolke genau das Richtige.
        sx.push(x + (Math.random() - 0.5) * figPunkt);
        sy.push(y - l * relief + (Math.random() - 0.5) * figLinien);
        sl.push(hologramm(p, nah, l));
        sz.push(nah * TIEFE);
        // Streuung in der Tiefe: ohne sie ist die Figur eine Haut, mit ihr
        // eine Wolke. Beim Schwenken ist das der Unterschied zwischen einem
        // kippenden Blatt und einem Koerper.
        szc.push(zfig - (nah + (Math.random() - 0.5) * WOLKE) * reliefTiefe);
        sart.push(0);
      }
    }

    // Randlicht in einem EIGENEN Durchgang, jedes Randpixel einzeln. Ueber das
    // Zeilenraster oben ging das nicht: die Silhouette ist ein Pixel breit, und
    // bei Zeilenabstand 2 traf sie nur jede zweite Zeile — gemessen 497 Punkte
    // fuer den ganzen Umriss, also eine gestrichelte Linie statt einer Kante.
    // Ein voller Durchgang ueber das Bild kostet einmalig ein paar Millisekunden.
    // Laeuft immer, auch bei `?randlicht=0`. Der Regler ist die HELLIGKEITS-
    // untergrenze, nicht der Schalter fuer die Abtastung — die dichte Kante
    // braucht das Bild in jedem Fall, sonst zerfaellt die Silhouette wieder
    // zur gestrichelten Linie. Kostet 940 von 84 500 Punkten.
    {
      for (let y = 0; y < H; y++) {
        const z0 = y * W;
        const halt = (SAUM > 0 && y > saumVon)
                   ? clamp01((fotoUnten - y) / saumBand) : 1;
        for (let x = 0; x < W; x++) {
          const p = z0 + x;
          if (!istRand(p)) continue;
          if (halt < 1 && Math.random() > halt * halt) continue;
          const nah = tiefeP[p];
          sx.push(x); sy.push(y);
          // Nicht hier klemmen — das erledigt die Zusammenstellung weiter
          // unten einmal fuer alle Randpunkte. Zweimal geklemmt war es vorher.
          sl.push(hologramm(p, nah, hell(p * 4)));
          sz.push(nah * TIEFE);
          szc.push(zfig - nah * reliefTiefe); sart.push(3);
        }
      }
    }

    // ---- 2. Staub --------------------------------------------------------
    // Frei im Raum um die Figur, nicht mehr auf einer Bodenebene: es gibt
    // keinen Boden mehr. Gewuerfelt wird in WELTkoordinaten in einem Quader
    // um sie herum, damit die Koerner beim Schwenken richtig mitwandern —
    // ein Staubkorn dicht vor ihr muss weiter laufen als eines dahinter.
    const staubZiel = Math.round(ZIEL * STAUB / Math.max(1, k * k));
    for (let i = 0; i < staubZiel; i++) {
      const Z = zfig * (0.45 + Math.random() * 1.6);
      const gx = pMx + (Math.random() - 0.5) * W * 2.2 * Z / zfig;
      const gy = pMy + (Math.random() - 0.5) * H * 1.6 * Z / zfig;
      if (gx < -W || gx > 2 * W || gy < -H || gy > 2 * H) continue;
      sx.push(gx); sy.push(gy);
      sl.push(STAUBHELL * (0.15 + Math.random() * 0.5));
      sz.push(0); szc.push(Z); sart.push(2);
    }

    sorten = { figur: 0, rand: 0, staub: 0 };
    for (let i = 0; i < sart.length; i++) {
      const a = sart[i];
      if (a === 0) sorten.figur++; else if (a === 3) sorten.rand++;
      else sorten.staub++;
    }
    pBx = pMx; pYh = pMy; pZax = zfig; pXax = xAchse;
    raumWerte = { zfig: +zfig.toFixed(2), xAchse: +xAchse.toFixed(2),
                  reliefTiefe: +reliefTiefe.toFixed(2),
                  figMitteX: Math.round(figMitte),
                  hauptpunkt: Math.round(pMx) + ',' + Math.round(pMy) };
    const tRaster = performance.now();

    n = sx.length;
    Dx = new Float32Array(n); Dy = new Float32Array(n);
    Dr1 = new Float32Array(n); Dr2 = new Float32Array(n);
    Dd = new Float32Array(n); Dh = new Float32Array(n);
    Ep = new Uint16Array(n);   // Phase der Eigenbewegung
    Ee = new Uint8Array(n);    // Verzoegerung im Einflug, 0..255
    Dz = new Float32Array(n);  // Tiefe, 0 = Bodenebene
    // Punktsorte bleibt erhalten (0 Figur, 1 Boden, 2 Staub, 3 Randlicht).
    // Ohne das laesst sich hinterher nichts mehr nach Sorte auswerten —
    // und genau das brauchte die Messung Hand gegen Brust.
    Dart = new Uint8Array(n);
    Dzc = new Float32Array(n);   // Entfernung zur Kamera, in Welteinheiten
    DzcB = new Float32Array(n);  // dasselbe / BRENN, damit je Bild EINE Division bleibt

    for (let k = 0; k < n; k++) {
      Dx[k] = sx[k]; Dy[k] = sy[k]; Dz[k] = sz[k];
      Dzc[k] = szc[k]; DzcB[k] = szc[k] / BRENN;
      const art = sart[k];
      Dart[k] = art;

      // sl traegt beim Hologramm schon die fertige Helligkeit aus der
      // Geometrie. Hier kommt nur noch zweierlei dazu:
      //
      // RANDLICHT als Untergrenze fuer die Silhouette, damit die Kontur eine
      // durchgehende Kante bleibt und nicht zur Punktreihe zerfaellt.
      //
      // Der MATERIALSOCKEL stand frueher hier obendrauf. Er gehoert ins
      // Albedo und steckt jetzt dort (HMATERIAL in `hologramm`) — hier
      // addiert waere er ein zweites Mal drin und wuerde ausserdem die
      // Beleuchtung umgehen: eine unbeleuchtete Flaeche saehe genauso hell
      // aus wie eine beleuchtete, und damit waere die ganze Modellierung
      // wieder weg. Genau diese Art doppelter Term war der Grund, warum sich
      // die Regler gegenseitig aufgehoben haben.
      let b = sl[k];
      if (art === 3) b = Math.max(RANDLICHT, b);

      Dh[k] = b;   // nur die Helligkeit; die Farbe kommt aus der Rampe

      // Zerfall. u laeuft von 0 in der Mitte bis 1 am aeusseren Rand der
      // zerfallenden Seite; aussen loest sich zuerst auf, das liest sich als
      // Erosion statt als Spaltung.
      //
      // Die Franse ist der Punkt: eine harte Trennung bei x >= Mitte liess eine
      // schnurgerade senkrechte Kante mitten im Gesicht stehen. Mit einem
      // kleinen Zufall auf der Grenze zerfallen einzelne Punkte schon diesseits
      // der Mitte und andere jenseits noch nicht — der Rand franst aus, wie in
      // der Vorlage. 99 heisst: dieser Punkt steht und bewegt sich nie.
      const u = LINKS ? (mitte - sx[k]) / Math.max(1, mitte)
                      : (sx[k] - mitte) / Math.max(1, W - mitte);
      const franse = (Math.random() - 0.5) * 0.34;
      Dd[k] = (u + franse) <= 0 ? 99
            : (1 - clamp01(u)) * 0.7 + Math.random() * 0.35;
      Dr1[k] = Math.random(); Dr2[k] = Math.random();

      Ep[k] = (Math.random() * 1024) | 0;
      // Staffelung des Einflugs. Ueberwiegend zufaellig, mit leichter Neigung
      // zur stehenden Seite hin: die Figur setzt sich von der Seite her
      // zusammen, die spaeter NICHT zerfaellt. Waere die Neigung stark, waere es
      // wieder eine Linie, die durchs Bild laeuft — genau das soll weg.
      const pos = LINKS ? sx[k] / W : 1 - sx[k] / W;
      Ee[k] = clamp01(0.35 * pos + 0.65 * Math.random()) * 255;
    }

    // Die Punktdaten stehen — einmal in die GPU-Puffer, danach je Bild nur
    // noch Uniforms.
    if (GL && gl && !glAus) {
      try { glMasse(W, H); glFuellen(); glBereit = true; }
      catch (e) { glAus = String(e.message || e); glBereit = false; }
    }

    bauZeit = performance.now() - t0;
    const e2 = performance.now();
    bauPhasen = {
      vorlage:  Math.round(tVorlage - t0),
      maske:    Math.round(tFrei - tVorlage),
      tiefe:    Math.round(tTiefe - tFrei),
      schaerfe: Math.round(tSchaerfe - tTiefe),
      raster:   Math.round(tRaster - tSchaerfe),
      felder:   Math.round(e2 - tRaster)
    };
    bereit = true;
  }

  // Der Aufbau kostet je nach Buehnengroesse zweistellige Millisekunden. Beim
  // Ziehen am Fensterrand feuert der ResizeObserver dutzendfach — deshalb wird
  // nur die Leinwand sofort angepasst und das Raster verzoegert neu gebaut.
  let bauTimer = 0;

  // Buehne messen und die Leinwand darauf stellen. Getrennt von resize(), weil
  // der Pruefhaken unten dasselbe braucht: baut man neu, ohne vorher zu messen,
  // entsteht das Raster wieder in der alten Groesse.
  function messen() {
    const r = stage.getBoundingClientRect();
    cssW = r.width; cssH = r.height;
    SW = Math.max(1, Math.round(cssW));
    SH = Math.max(1, Math.round(cssH));
    const neu = SW !== bauSW || SH !== bauSH;
    // dpr bewusst 1: die Punkte sind feines Korn, bei dpr 2 kostete alles das
    // Vierfache fuer keinen sichtbaren Gewinn.
    //
    // Nur zuweisen, wenn sich wirklich etwas geaendert hat: eine Zuweisung an
    // cv.width LOESCHT die Leinwand, auch wenn derselbe Wert draufsteht. Der
    // ResizeObserver feuert aber staendig — auf dem Handy schon, wenn die
    // Adressleiste auf- und zugeht. Bisher fiel das nicht auf, weil das
    // naechste Bild sofort wieder zeichnet; sichtbar wurde es erst, als die
    // Schleife fuer Standbilder angehalten war und das Bild schwarz blieb.
    if (cv.width !== SW || cv.height !== SH) {
      cv.width = SW; cv.height = SH;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }
    return neu;
  }

  function resize() {
    const neu = messen();
    if (!geladen) return;
    if (!bereit) { aufbauen(); draw(eased); return; }
    if (neu) {
      clearTimeout(bauTimer);
      bauTimer = setTimeout(() => { aufbauen(); draw(eased); }, 120);
    }
  }

  // ---- Beruehrungsspur --------------------------------------------------
  // Ein Zeigerereignis legt einen neuen Spurpunkt an. Seine Staerke kommt aus
  // der quadrierten Strecke seit der letzten Position, genau wie im Vorbild
  // (`Math.min(dd * 10000, 1)`, dort in Bildanteilen). Ein Prozent der Breite
  // ergibt volle Kraft; ein ruhender Finger legt gar nichts an.
  function stempeln(schirmX, schirmY) {
    if (!F || SPUR <= 0) return;
    // Zeiger in Pufferkoordinaten: die Buehne zeigt den Puffer um panX versetzt.
    const bx = schirmX - panX, by = schirmY;
    if (letzterZeiger) {
      const dx = bx - letzterZeiger[0], dy = by - letzterZeiger[1];
      const eins = W * 0.012;
      const kraft = Math.min((dx * dx + dy * dy) / (eins * eins), 1);
      if (kraft > 0.02) {
        spurPunkte.push({ x: bx, y: by, alter: 0, kraft });
        // Deckel: mehr als das passt in SPUR_ALT Bilder ohnehin nicht sinnvoll
        // uebereinander, und die Liste wird sonst bei einem langen Wisch lang.
        if (spurPunkte.length > 80) spurPunkte.shift();
      }
    }
    letzterZeiger = [bx, by];
  }

  // Feld aus der Punktliste neu zeichnen, einmal je Bild. Jeder Punkt altert
  // dabei und traegt mit einer Glockenkurve bei: die ersten 30 % seines Lebens
  // blendet er auf, die restlichen 70 % ab. Genau das macht, dass die Spur dem
  // Finger nachwaechst, statt nur zu verblassen.
  function spurFeld() {
    if (!F) return;
    if (!spurPunkte.length) {
      if (spurAktiv) { F.fill(0); spurAktiv = false; }
      return;                              // ruhig: die Spur kostet gar nichts
    }
    F.fill(0);
    for (let i = spurPunkte.length - 1; i >= 0; i--) {
      const p = spurPunkte[i];
      if (++p.alter > SPUR_ALT) { spurPunkte.splice(i, 1); continue; }
      const l = p.alter / SPUR_ALT;
      const staerke = p.kraft * (l < 0.3
        ? Math.sin(l / 0.3 * 1.5708)                    // auf
        : Math.sin((1 - (l - 0.3) / 0.7) * 1.5708));    // ab
      const cx = p.x / 8, cy = p.y / 8;
      const x0 = Math.max(0, Math.floor(cx - SPUR_R)), x1 = Math.min(gw - 1, Math.ceil(cx + SPUR_R));
      const y0 = Math.max(0, Math.floor(cy - SPUR_R)), y1 = Math.min(gh - 1, Math.ceil(cy + SPUR_R));
      for (let gy = y0; gy <= y1; gy++) {
        const zeile = gy * gw, dy = gy - cy;
        for (let gx = x0; gx <= x1; gx++) {
          const dx = gx - cx;
          const d = Math.sqrt(dx * dx + dy * dy);
          if (d > SPUR_R) continue;
          const k = zeile + gx;
          const v = staerke * (1 - d / SPUR_R);
          if (v > F[k]) F[k] = v;          // groesster Wert gewinnt, nicht Summe
        }
      }
    }
    spurAktiv = true;
  }

  function readScroll() {
    const rect = intro.getBoundingClientRect();
    const total = intro.offsetHeight - stage.offsetHeight;
    target = total <= 0 ? 0 : clamp01(-rect.top / total);
  }

  // ---- Zeichnen ---------------------------------------------------------
  // ponytail: der Pixelpuffer haengt an der vollen Buehnengroesse. Auf 2545x1440
  // sind das 3,7 Mio. Felder loeschen und 14,6 MB je Bild uebertragen — gemessen
  // 14,8 ms Median, waehrend die Punktschleife dort nur noch einen Bruchteil
  // kostet. Bis 1920 bleibt es unter 7 ms, und laut Plan laeuft am Desktop
  // ohnehin das Video. Decke: ab etwa 2000 px Breite wird der Puffer teuer.
  // Ausbauweg, falls der Effekt doch auf grosse Schirme soll: Puffer auf ~1400
  // px deckeln und beim Zeichnen hochskalieren (imageSmoothingEnabled = false,
  // die Punkte werden dann groebere Bloecke — was zum Look passt).

  // ---- WebGL2-Pfad (?gl=an) ---------------------------------------------
  // Dieselben Punktdaten, dieselbe Rechnung — nur laeuft sie je Punkt im
  // Vertex-Shader statt in JavaScript, und ein Punkt ist ein WEICHER Sprite
  // statt eines harten Pixels. Das ist der eigentliche Gewinn: die CPU kann
  // gar keinen weichen Punkt zeichnen, ohne fuer jeden neun Pixel anzufassen.
  //
  // Gemessen auf dieser Maschine (Intel UHD 620, 390x844, weiche Sprites,
  // additiv): 55 000 Punkte 1.21 ms, 200 000 3.52 ms, 400 000 5.19 ms. Der
  // CPU-Pfad liegt bei 84 000 Punkten und 4.5 ms.
  //
  // WICHTIG und ebenfalls gemessen: 400 000 Positionen je Bild hochzuladen
  // kostet 30 ms. Die Puffer werden deshalb EINMAL beim Aufbau gefuellt, und
  // alles Bewegliche (Winkel, Einflug, Zerfall, Puls) sind Uniforms.
  //
  // Zwei Durchgaenge, wie im Vorbild (Codrops/UntilLabs):
  //   1. Punkte additiv in eine Float-Textur — gesammelt wird eine reine
  //      HELLIGKEIT, genau wie `acc` im CPU-Pfad.
  //   2. Vollbild-Durchgang, der die Farbrampe darauf anwendet.
  // Ohne den zweiten Durchgang ginge die Rampe verloren: additives Blenden
  // kann keine nichtlineare Kennlinie nachbilden, und gerade die laesst
  // ueberlagerte Punkte weiss ausgluehen.
  const GL = q.get('gl') === 'an';
  const PGROESSE = zahl('punktgroesse', 2.6, 1, 12);
  let gcv = null, gl = null, glProg = null, glRampe = null, glFbo = null,
      glTex = null, glSpur = null, glVoll = null, glLeer = null,
      glBuf = {}, glU = {}, glW = 0, glH = 0;

  const glShader = (typ, src) => {
    const s = gl.createShader(typ);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
      throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const glProgramm = (vs, fs) => {
    const p = gl.createProgram();
    gl.attachShader(p, glShader(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, glShader(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS))
      throw new Error(gl.getProgramInfoLog(p));
    return p;
  };

  const VS = `#version 300 es
  in vec4 aPos;   // x, y, zc, zc/BRENN
  in vec4 aVar;   // Helligkeit, Zerfallsrang, zufall1, zufall2
  in vec2 aPh;    // Pulsphase 0..1, Einflugverzoegerung 0..1
  uniform vec2 uSchirm;      // W, H
  uniform vec2 uDreh;        // cos, sin
  uniform vec4 uKamera;      // bx, yh, zAchse, xAchse
  uniform float uBrenn, uEin, uDis, uAtem, uT, uGroesse, uPegel;
  uniform vec4 uFlug;        // EINFLUG, EIN_VERZ, DRIFT, SPREAD
  uniform float uRichtung;
  uniform sampler2D uSpur;
  uniform float uSpurStaerke;
  out float vHell;
  const float TAU = 6.283185307;
  void main() {
    float x = aPos.x, y = aPos.y, a = 1.0;
    float z0 = aPos.z, zc = z0;

    // Schwenk: Lochkamera, exakt zurueckgerechnet — keine Kleinwinkelnaeherung.
    if (uDreh.y != 0.0) {
      float dX = (x - uKamera.x) * aPos.w - uKamera.w;
      float dZ = zc - uKamera.z;
      float Xr = uKamera.w + dX * uDreh.x + dZ * uDreh.y;
      zc = uKamera.z - dX * uDreh.y + dZ * uDreh.x;
      if (zc < 0.05) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
      float s = 1.0 / zc;
      x = uKamera.x + Xr * uBrenn * s;
      y = uKamera.y + (y - uKamera.y) * z0 * s;
    }

    if (uEin < 1.0) {
      float g = (uEin - aPh.y * uFlug.y) / (1.0 - uFlug.y);
      if (g <= 0.0) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
      if (g < 1.0) {
        float r = 1.0 - g, rest = r * r * r;
        float w = TAU * aVar.z;
        float d = rest * uFlug.x * (0.3 + aVar.w * 1.4);
        x += d * cos(w); y += d * sin(w);
        a = g * (2.0 - g);
      }
    }

    if (uDis > 0.0 && aVar.y < 90.0) {
      float kante = uDis * (1.0 + uFlug.w);
      float p = clamp(kante - aVar.y * uFlug.w, 0.0, 1.0);
      if (p >= 1.0) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
      float e = p * p;
      x += uRichtung * e * uFlug.z * (0.35 + aVar.z * 1.3);
      y += e * uFlug.z * 0.55 * (aVar.w - 0.65);
      a *= 1.0 - p;
    }

    // Beruehrungsspur: das Feld gibt nur die STAERKE, die Richtung bringt
    // jeder Punkt als eigenen Zufallswinkel mit — wie im CPU-Pfad.
    if (uSpurStaerke > 0.0) {
      float f = texture(uSpur, vec2(x, y) / uSchirm).r;
      if (f > 0.0) {
        float w = TAU * aVar.z;
        float d = f * uSpurStaerke;
        x += d * cos(w); y += d * sin(w);
        a += f;
      }
    }

    if (uAtem > 0.0) a += uAtem * sin(TAU * (aPh.x + uT));

    // Der weiche Sprite verteilt dieselbe Helligkeit ueber mehrere Pixel,
    // deshalb der Pegel: sonst haette ?hell= im GL-Pfad eine andere Bedeutung
    // als im CPU-Pfad und jeder Vergleich waere wertlos.
    vHell = aVar.x * max(a, 0.0) * uPegel;
    gl_PointSize = uGroesse * clamp(z0 / zc, 0.6, 2.2);
    // y der Leinwand zeigt nach unten, das Geraetekoordinatensystem nach oben.
    vec2 ndc = vec2(x, y) / uSchirm * 2.0 - 1.0;
    gl_Position = vec4(ndc.x, -ndc.y, 0.0, 1.0);
  }`;

  const FS = `#version 300 es
  precision highp float;
  in float vHell;
  out vec4 o;
  void main() {
    // Weicher Abfall zum Rand. Genau das kann der CPU-Pfad nicht: dort ist
    // ein Punkt ein Pixel mit harter Kante, und Licht hat keine Kanten.
    float d = length(gl_PointCoord - 0.5);
    float a = pow(1.0 - smoothstep(0.0, 0.5, d), 1.5);
    o = vec4(vHell * a, 0.0, 0.0, 1.0);
  }`;

  const VOLL_VS = `#version 300 es
  out vec2 vUv;
  void main() {
    vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
    vUv = p; gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
  }`;
  const VOLL_FS = `#version 300 es
  precision highp float;
  in vec2 vUv;
  uniform sampler2D uAcc;
  uniform sampler2D uRampe;
  out vec4 o;
  void main() {
    // KEIN Spiegeln hier. Der Vertex-Shader dreht y bereits um (die Leinwand
    // zaehlt nach unten, das Geraetekoordinatensystem nach oben); ein zweites
    // Mal an dieser Stelle hob das auf und stellte die Figur auf den Kopf.
    float v = texture(uAcc, vUv).r;
    o = vec4(texture(uRampe, vec2(clamp(v, 0.0, 1.0), 0.5)).rgb, 1.0);
  }`;

  function glStart() {
    gcv = document.createElement('canvas');
    gl = gcv.getContext('webgl2', { alpha: false, antialias: false });
    if (!gl) return false;
    if (!gl.getExtension('EXT_color_buffer_float')) return false;  // Float-FBO noetig
    glProg = glProgramm(VS, FS);
    glVoll = glProgramm(VOLL_VS, VOLL_FS);
    for (const nm of ['uSchirm','uDreh','uKamera','uBrenn','uEin','uDis','uAtem',
                      'uT','uGroesse','uPegel','uFlug','uRichtung','uSpur','uSpurStaerke'])
