<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gesichts-Intro — Prototyp</title>

<!-- Prototyp, nicht Teil der Seite. Wie _bands.html: hier wird der Look
     entschieden, index.html wird erst angefasst, wenn er sitzt.

     VORBILD: die Frequency-Modulation-Komponente von decayingsun. Auf einem
     seiner Screenshots sieht man beides uebereinander — oben das echte Foto,
     unten das Ergebnis. Das ist der ganze Trick, und er ist keine KI:

       Ueber das Bild laufen Linien (Ringe oder Zeilen). Jeder Punkt einer Linie
       wird ausgelenkt, je heller die Vorlage an dieser Stelle ist. Ueber hellen
       Flaechen draengen sich die Linien zusammen und stehen als Grat — das
       modelliert die Form. Im Dunkeln bleiben duenne, gepunktete Boegen stehen;
       sie verschwinden nicht, sie werden nur schwach.

     Das ist eine Rechnung, kein generiertes Bild: aus jedem Foto exakt
     reproduzierbar. Deshalb braucht dieser Effekt weder Figma Weave noch
     TouchDesigner.

     Zweiter Kniff: Linien und Partikel sind DASSELBE. Jeder Punkt einer Linie
     ist schon ein Partikel und muss zum Zerfall nur losfliegen. Deshalb gibt es
     keine zwei Ebenen, die aneinander passen muessen, und keine Naht in der
     Mitte, die auseinanderlaufen kann.

     WICHTIG zur Aufloesung: die Punkte entstehen in BILDSCHIRMpixeln, nicht in
     Bildpixeln. Zuerst lag das Raster im Quellbild (640 breit) und wurde beim
     Zeichnen auf die Buehne heruntergerechnet — dabei fiel rund jeder dritte
     Punkt weg, und das Ergebnis war duenn und dunkel. Deshalb wird das Raster
     bei jeder Groessenaenderung neu aufgebaut.

     Stellschrauben haengen an der Adresse, wie ?sicht= in index.html:
       ?muster=zeilen    waagerechte Zeilen statt Ringe (Standard: kreise)
       ?linien=2..10     Abstand zwischen zwei Linien, in Bildschirmpixeln (4)
       ?punkte=1..5      Punktabstand laengs der Linie (2)
       ?dicke=1..3       Strichstaerke in hellen Zonen (2)
       ?ziel=1e4..4e5    Obergrenze Punktzahl, deckelt grosse Schirme (60000)
       ?relief=0..60     wie stark die Helligkeit auslenkt (16)
       ?boden=0..0.5     Grundhelligkeit der Linien im Dunkeln (0.13)
       ?cx= ?cy=         Mittelpunkt der Ringe, 0..1 der Buehne (0.58 / 0.52)
       ?haelfte=links    welche Haelfte zerfaellt (Standard: rechts)
       ?scan=0.1..0.9    wann die Aufdecklinie durch ist (0.45)
       ?drift=20..400    wie weit die Partikel fliegen (150)
       ?tint=aus         Rotfaerbung aus (fuer ein bereits gefaerbtes Bild)
       ?kontrast=aus     Tonwertspreizung aus (zeigt die Vorlage ungespreizt)
       ?invert=an        Helligkeit umkehren (fuer dunkles Motiv auf hellem Grund)
       ?bild=eng|ganz|platzhalter   andere Vorlage (Standard: person)
       ?passung=ganz     ganzes Bildrechteck hineinpassen
       ?passung=motiv    den Kasten um die PERSON einpassen
       ?kasten=x,y,b,h   Ausschnitt von Hand (Anteile 0..1); ?kasten=auto sucht selbst
       ?passung=fahrt    Motiv fensterhoch, Ansicht faehrt quer mit (empfohlen)
       ?rand=0..0.3      Luft um das Motiv (0.06)
       ?zoom=0.3..3      Groesse der Figur darin (1)
       ?saum=0..0.5      Ausklingen der Bildunterkante (0.18, 0 = harte Kante)
       ?frei=aus         Hintergrund NICHT freistellen
       ?toleranz=.005-.2 wie weich der Hintergrundverlauf sein darf (0.03)
       ?schatten=behalten Schlagschatten NICHT mitentfernen
       ?grau=0..0.4      ab welcher Buntheit etwas als Motiv gilt (0.085)
       ?hgmin=0..0.9     Mindesthelligkeit fuer Hintergrund (0.30)
       ?schaerfe=0..2.5  lokaler Kontrast, hebt Ringe/Kette/Brillenrand (0.7)
       ?radius=1..12     Umfeld dafuer, in Pixeln (4)
       h                 blendet die Messanzeige um -->

<style>
  :root {
    --ground: #0B0510;
    --stage-h: 100svh;   /* svh, nicht vh: sonst springt es, wenn die
                            Adressleiste des Handys auf- und zugeht */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--ground); }
  body {
    color: #E8E4EE;
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    /* Waagerechtes Scrollen ist die Abnahmebedingung aus AGENTS.md. */
    overflow-x: hidden;
  }

  .intro  { height: 360svh; position: relative; }
  .stage  { position: sticky; top: 0; height: var(--stage-h); overflow: hidden; }
  #face { display: block; width: 100%; height: 100%; }

  .hint {
    position: absolute; z-index: 3; pointer-events: none;
    left: 50%; bottom: 6svh; transform: translateX(-50%);
    font-size: .75rem; letter-spacing: .18em; text-transform: uppercase;
    color: #8B8095; white-space: nowrap; transition: opacity .3s;
  }
  .hud {
    position: fixed; z-index: 9; left: 10px; top: 10px;
    padding: 8px 10px; border-radius: 6px;
    background: rgba(11,5,16,.72); color: #C9C1D4;
    font-size: 11px; line-height: 1.5; white-space: pre; pointer-events: none;
  }
  .hud.off { display: none; }
  @media (pointer: coarse) { .hud { display: none; } }

  .ende {
    height: 60svh; display: grid; place-items: center;
    color: #6E6478; font-size: .75rem; letter-spacing: .18em; text-transform: uppercase;
  }
</style>
</head>
<body>

<section class="intro" id="intro">
  <div class="stage" id="stage">
    <canvas id="face"></canvas>
    <div class="hint" id="hint">scrollen</div>
  </div>
</section>
<div class="ende">hier übernähme später der Shop</div>

<div class="hud" id="hud">lädt …</div>

<script>
(() => {
  // ---- Stellschrauben ---------------------------------------------------

  const DAMPING  = 0.085;  // wie index.html — beides soll sich gleich anfuehlen
  const DIS_FROM = 0.55;   // ab hier zerfaellt es
  const DIS_TO   = 1.00;
  const SPREAD   = 0.55;   // zeitliche Staffelung der Partikel
  // -----------------------------------------------------------------------

  const q = new URLSearchParams(location.search);
  const zahl = (k, std, lo, hi) => {
    // Auf null pruefen, nicht auf NaN: Number(null) ist 0, nicht NaN. Ohne
    // diese Zeile lieferte jeder Parameter, dessen Bereich die Null enthaelt
    // (relief, boden, cx, cy), stumm 0 statt seines Standardwerts — der Effekt
    // stand dann ganz ohne Auslenkung da. Gemessen, nicht vermutet.
    const roh = q.get(k);
    if (roh === null || roh.trim() === '') return std;
    const v = Number(roh);
    return Number.isFinite(v) && v >= lo && v <= hi ? v : std;
  };
  const KREISE   = q.get('muster') !== 'zeilen';
  const LINIEN   = Math.round(zahl('linien', 3, 2, 10));
  const PUNKTE   = Math.round(zahl('punkte', 1, 1, 5));
  const RELIEF   = zahl('relief', 10, 0, 60);
  const BODEN    = zahl('boden', 0.05, 0, 0.5);
  // Ringmittelpunkt. Bereich absichtlich ueber 0..1 hinaus: liegt er MITTEN im
  // Motiv, entsteht dort ein Strudel aus engen konzentrischen Kreisen — eine
  // Zielscheibe auf der Brust. In der Vorlage sitzt das Zentrum ausserhalb der
  // Figur, deshalb laufen die Ringe dort als weite Boegen durchs Bild.
  const CX       = zahl('cx', 0.42, -1.5, 2.5);
  const CY       = zahl('cy', 1.25, -1.5, 2.5);
  const LINKS    = q.get('haelfte') === 'links';
  const SCAN_TO  = zahl('scan', 0.45, 0.1, 0.9);
  const DRIFT    = zahl('drift', 150, 20, 400);
  const TINT     = q.get('tint') !== 'aus';
  const KONTRAST = q.get('kontrast') !== 'aus';   // Tonwertspreizung
  // Helligkeit umkehren. Der Effekt lenkt nach HELL aus, die Vorlage ist also
  // ein helles Motiv auf dunklem Grund. Rutgers Foto ist umgekehrt gebaut
  // (gemessen: Median 206, Mittel 171 — Wand, weisses Shirt, helle Jacke), da
  // wuerde die Wand die Grate bilden und das Gesicht flach bleiben.
  const INVERT = q.get('invert') === 'an';
  // Einpassung. 'fuellend' schneidet formatfuellend zu (gut fuer einen Kopf),
  // 'ganz' legt das ganze Bild hinein — dann steht die komplette Figur da und
  // ringsum laeuft nur das Linienmuster weiter. Auf Schwarz wirkt das nicht wie
  // ein Briefkasten, sondern wie eine Figur im Raum.
  const GANZ = q.get('passung') === 'ganz';
  // 'motiv' passt den Kasten um die PERSON ein, nicht das Bildrechteck. Ein
  // Querformat-Foto vollstaendig in ein Hochformat-Fenster gelegt ergibt
  // zwangslaeufig ein schmales Band — die leere Wand ringsum ist aber gar nicht
  // der Teil, den man sehen will. Freigestellt wird sie ohnehin, also kann sie
  // auch den Platz raeumen.
  const MOTIV = (q.get('passung') || 'motiv') === 'motiv';
  // 'fahrt': Motiv fensterhoch, Ansicht faehrt beim Scrollen quer darueber.
  // Der einzige Weg, in einem Hochformat-Fenster ein breites Motiv GROSS und
  // VOLLSTAENDIG zu zeigen — nur eben nacheinander statt gleichzeitig.
  const FAHRT = q.get('passung') === 'fahrt';
  // Luft um das Motiv, damit es nicht am Fensterrand klebt.
  const RAND = zahl('rand', 0, 0, 0.3);
  // Feinjustierung der Groesse obendrauf, damit sich die Figur im Bild
  // einrichten laesst, ohne dass ich neu zuschneide.
  const ZOOM = zahl('zoom', 1.25, 0.3, 3);
  // Wie weit die Unterkante des Bildes ausklingt, als Anteil der Bildhoehe.
  const SAUM = zahl('saum', 0.18, 0, 0.5);
  const FREI = q.get('frei') !== 'aus';           // Hintergrund freistellen
  const TOL  = zahl('toleranz', 0.012, 0.005, 0.2); // wie weich der Verlauf sein darf
  // Schlagschatten mit entfernen. Sie sind dunkler als die Wand, das reine
  // Helligkeitswachstum bleibt an ihrer Kante stehen — der Schatten zaehlt dann
  // als Motiv und zieht sogar den Motivkasten auf. Die Toleranz hochzudrehen
  // frisst die Person mit. Der belastbare Unterschied ist die FARBE: Wand und
  // Schatten sind grau, Haut, Ringe und Kette sind es nicht.
  const SCHATTEN = q.get('schatten') !== 'behalten';
  const GRAU = zahl('grau', 0.085, 0, 0.4);   // ab wann etwas als grau gilt
  const HGMIN = zahl('hgmin', 0.30, 0, 0.9);  // und wie hell es mindestens sein muss
  // Lokaler Kontrast. Kleine helle Details — Ringe, Halskette, Brillenrand —
  // gehen sonst im Umfeld unter: sie sind zwar heller als ihre Nachbarschaft,
  // aber absolut nicht hell genug, um aus der Kurve herauszustechen. Die
  // Gesamthelligkeit anzuheben hilft nicht, das hebt den Hintergrund mit.
  // Hier wird jedes Pixel gegen seine WEICHGEZEICHNETE Umgebung verstaerkt.
  const SCHAERFE = zahl('schaerfe', 0.7, 0, 2.5);
  const RADIUS = Math.round(zahl('radius', 4, 1, 12));

  // Umschaltbar ueber ?bild=, damit sich Vorlagen direkt vergleichen lassen.
  // Feste Liste statt freiem Pfad: der Wert kaeme sonst ungeprueft aus der
  // Adresse in ein src-Attribut.
  const BILDER = { person: 'person.webp', eng: 'person-eng.webp',
                   ganz: 'person-ganz.webp',
                   zwei: 'rutger2.webp', zweieng: 'rutger2-eng.webp',
                   zweivoll: 'rutger2-voll.webp', personvoll: 'person-voll.webp' };
  const SRC = BILDER[q.get('bild')] || 'rutger2-voll.webp';
  // Strichstaerke. Der entscheidende Regler fuer die Dichte — decayingsuns
  // eigenes Bedienfeld hat ihn als 'Linethickness'. Ein-Pixel-Punkte decken
  // bei Linienabstand 4 nur rund ein Achtel der Flaeche ab; gemessen waren
  // nur 11 % der Buehne hell, obwohl die Spitzen schon 255 erreichten. Erst
  // dickere Punkte in den Lichtern schliessen die Grate.
  const DICKE    = Math.round(zahl('dicke', 2, 1, 3));
  // Obergrenze fuer die Punktzahl. Daraus wird der Rasterabstand gerechnet,
  // damit grosse Schirme nicht in die Knie gehen (siehe aufbauen()).
  const ZIEL     = zahl('ziel', 170000, 10000, 400000);
  // Bildausschnitt von Hand, in Anteilen des Bildes: ?kasten=x,y,b,h.
  // Der automatisch gefundene Kasten umfasst ALLES, was zur Person gehoert —
  // also auch den Unterarm, der rechts aus dem Bild laeuft, und die Schulter
  // ganz links. Dadurch wird der Kasten breiter als hoch, und in einem
  // Hochformat-Fenster bleibt die Figur zwangslaeufig klein. Ein von Hand
  // gesetzter, hochkanter Ausschnitt zeigt dieselben Teile deutlich groesser.
  const KASTEN = (() => {
    // Voreinstellung ist der Ausschnitt fuer rutger2-voll.webp; ?kasten=auto
    // schaltet auf die automatische Suche zurueck (noetig bei anderen Fotos).
    const roh = q.get('kasten') ?? '0.50,0.13,0.47,0.87';
    if (roh === 'auto') return null;
    const r = roh.split(',').map(Number);
    return r.length === 4 && r.every(v => Number.isFinite(v)) && r[2] > 0 && r[3] > 0
         ? { x: r[0], y: r[1], w: r[2], h: r[3] } : null;
  })();

  const cv    = document.getElementById('face');
  const ctx   = cv.getContext('2d', { alpha: false });
  const intro = document.getElementById('intro');
  const stage = document.getElementById('stage');
  const hint  = document.getElementById('hint');
  const hud   = document.getElementById('hud');

  const clamp01 = v => Math.min(1, Math.max(0, v));
  const reduce  = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let cssW = 0, cssH = 0;
  let target = 0, eased = 0, geladen = false, bereit = false;
  let W = 0, H = 0, mitte = 0;      // Puffer (kann breiter sein als die Buehne)
  let SW = 0, SH = 0;               // Buehne, also das, was man sieht
  let bauSW = 0, bauSH = 0;         // Masse, mit denen zuletzt gebaut wurde

  // Zeichenflaeche in Bildschirmpixeln (dpr 1). Zwei Gruende: die Punkte sind
  // feines Korn, bei dpr 2 kostete alles das Vierfache fuer keinen sichtbaren
  // Gewinn — und das Raster soll in der Einheit sitzen, in der es gesehen wird.
  const pcv  = document.createElement('canvas');
  const pctx = pcv.getContext('2d');
  let pimg = null, buf32 = null;

  // Punkte als getrennte typisierte Felder statt Objekte: ein Feld von
  // zehntausenden Objekten wuerde den Speicherbereiniger bei jedem Bild
  // beschaeftigen.
  let n = 0, Dx, Dy, Dr1, Dr2, Dd, Drgb, Ds;
  let skala = 1;   // Rasterfaktor gegenueber der Bezugshoehe 844
  let freiAnteil = 0;   // Anteil freigestellter Flaeche, zur Kontrolle
  let letzterKasten = null;   // zuletzt ermittelter Motivkasten, zur Kontrolle
  let panVon = 0, panBis = 0; // Strecke der Querfahrt, in Pufferpixeln
  let bauZeit = 0;

  const img = new Image();
  img.decoding = 'async';
  img.onload = () => { geladen = true; resize(); requestAnimationFrame(tick); };
  img.onerror = () => { hud.textContent = 'Bild nicht ladbar: ' + SRC; };
  img.src = SRC;

  // Trennbarer Kastenweichzeichner. Zwei eindimensionale Durchgaenge mit
  // laufender Summe statt eines echten Kerns: die Kosten haengen nicht am
  // Radius, und genauer muss es fuer eine Kontrastverstaerkung nicht sein.
  function weichzeichnen(quelle, w, h, r) {
    const d = 2 * r + 1;
    const tmp = new Float32Array(w * h), aus = new Float32Array(w * h);
    const kx = x => Math.min(w - 1, Math.max(0, x));
    const ky = y => Math.min(h - 1, Math.max(0, y));
    for (let y = 0; y < h; y++) {
      const z = y * w;
      let summe = 0;
      for (let x = -r; x <= r; x++) summe += quelle[z + kx(x)];
      for (let x = 0; x < w; x++) {
        tmp[z + x] = summe / d;
        summe -= quelle[z + kx(x - r)];
        summe += quelle[z + kx(x + r + 1)];
      }
    }
    for (let x = 0; x < w; x++) {
      let summe = 0;
      for (let y = -r; y <= r; y++) summe += tmp[ky(y) * w + x];
      for (let y = 0; y < h; y++) {
        aus[y * w + x] = summe / d;
        summe -= tmp[ky(y - r) * w + x];
        summe += tmp[ky(y + r + 1) * w + x];
      }
    }
    return aus;
  }

  // Kasten um das Motiv, in Anteilen des Bildes (0..1). Dasselbe Verfahren wie
  // die Freistellung unten, nur auf einem groben Abbild: von den Ecken her
  // wachsen lassen, was uebrig bleibt, ist das Motiv.
  function motivKasten() {
    const w0 = 200;
    const h0 = Math.max(1, Math.round(w0 * img.naturalHeight / img.naturalWidth));
    const c = document.createElement('canvas');
    c.width = w0; c.height = h0;
    const cx = c.getContext('2d', { willReadFrequently: true });
    cx.drawImage(img, 0, 0, w0, h0);
    const p = cx.getImageData(0, 0, w0, h0).data;
    const anz0 = w0 * h0;
    const L = new Float32Array(anz0);
    const G = new Float32Array(anz0);   // Buntheit: 0 = grau
    for (let k = 0, i = 0; k < anz0; k++, i += 4) {
      const r = p[i], g = p[i+1], b = p[i+2];
      L[k] = (r * 0.299 + g * 0.587 + b * 0.114) / 255;
      G[k] = (Math.max(r, g, b) - Math.min(r, g, b)) / 255;
    }
    const wand = k => SCHATTEN && G[k] < GRAU && L[k] > HGMIN;

    const bg = new Uint8Array(anz0);
    const st = new Int32Array(anz0);
    let sp = 0;
    const saat = k => { if (!bg[k] && L[k] > 0.45) { bg[k] = 1; st[sp++] = k; } };
    const nimm = (q, l) => !bg[q] && (wand(q) || Math.abs(L[q] - l) < TOL);
    saat(0); saat(w0 - 1); saat((h0 - 1) * w0); saat(anz0 - 1);
    while (sp > 0) {
      const k = st[--sp], l = L[k], x = k % w0;
      if (x > 0)          { const q = k - 1;  if (nimm(q, l)) { bg[q] = 1; st[sp++] = q; } }
      if (x < w0 - 1)     { const q = k + 1;  if (nimm(q, l)) { bg[q] = 1; st[sp++] = q; } }
      if (k >= w0)        { const q = k - w0; if (nimm(q, l)) { bg[q] = 1; st[sp++] = q; } }
      if (k < anz0 - w0)  { const q = k + w0; if (nimm(q, l)) { bg[q] = 1; st[sp++] = q; } }
    }

    let x0 = w0, y0 = h0, x1 = -1, y1 = -1;
    for (let y = 0; y < h0; y++)
      for (let x = 0; x < w0; x++)
        if (!bg[y * w0 + x]) {
          if (x < x0) x0 = x; if (x > x1) x1 = x;
          if (y < y0) y0 = y; if (y > y1) y1 = y;
        }
    // Nichts gefunden (alles als Hintergrund gewachsen): lieber nichts tun als
    // auf einen unsinnigen Kasten skalieren.
    if (x1 < 0 || (x1 - x0) < 4 || (y1 - y0) < 4) return null;
    return { x: x0 / w0, y: y0 / h0,
             w: (x1 - x0 + 1) / w0, h: (y1 - y0 + 1) / h0 };
  }

  // ---- Raster aufbauen --------------------------------------------------
  function aufbauen() {
    const t0 = performance.now();
    H = SH;
    bauSW = SW; bauSH = SH;
    // Bei der Querfahrt ist der Puffer BREITER als die Buehne: die Figur steht
    // fensterhoch, und draw() schiebt beim Scrollen ein Fenster darueber. Sonst
    // ist Puffer gleich Buehne.
    W = SW;

    // Motivkasten und Pufferbreite muessen VOR der Rasterdichte feststehen:
    // die Dichte wird aus der Flaeche gerechnet, und bei der Querfahrt ist der
    // Puffer breiter als die Buehne. Andersherum griff der Deckel ins Leere —
    // gemessen 131 169 Punkte statt der angepeilten 60 000.
    const kasten = (MOTIV || FAHRT) ? (KASTEN || motivKasten()) : null;
    letzterKasten = kasten;

    if (FAHRT && kasten) {
      // Nach der HOEHE des Motivkastens skalieren, nicht nach beidem: dadurch
      // steht die Figur fensterhoch. Die Breite ergibt sich daraus und wird zur
      // Pufferbreite — dort faehrt die Ansicht entlang. Gedeckelt, damit ein
      // extremes Seitenverhaeltnis den Puffer nicht sprengt.
      const sf = SH / (kasten.h * img.naturalHeight) * (1 - RAND) * ZOOM;
      W = Math.max(SW, Math.min(4000, Math.round(img.naturalWidth * sf)));
    }
    mitte = W >> 1;

    // Rasterabstand aus einer ZIELZAHL Punkte ableiten, nicht aus festen
    // Pixeln. Bei festem Abstand waechst die Punktzahl mit der FLAECHE:
    // gemessen 39 730 Punkte auf 375x844 (1,6 ms je Bild), aber 458 732 auf
    // 2545x1440 — 40 ms, also 25 Bilder/s.
    // Ein Faktor aus der HOEHE reichte nicht (immer noch 18,5 ms), denn die
    // Flaeche waechst in zwei Richtungen. Also die Wurzel aus dem Verhaeltnis:
    // damit deckelt sich der Aufwand von selbst, auf jedem Schirm.
    // Unter dem Ziel bleibt k = 1, das Handy sieht also exakt aus wie
    // eingestellt — die Deckelung greift nur nach oben.
    const rohZahl = (W * H) / (LINIEN * PUNKTE);
    const k = Math.max(1, Math.sqrt(rohZahl / ZIEL));
    const linien = Math.max(2, Math.round(LINIEN * k));
    const punkt  = Math.max(1, Math.round(PUNKTE * k));
    const relief = RELIEF * k;
    const dicke  = Math.max(1, Math.round(DICKE * k));
    skala = k;

    // Vorlage formatfuellend in die Buehnengroesse legen, dann daraus die
    // Helligkeiten lesen. Damit stimmt der Zuschnitt in jedem Seitenverhaeltnis,
    // ohne dass draw() spaeter noch etwas verschieben muesste.
    const tmp = document.createElement('canvas');
    tmp.width = W; tmp.height = H;
    const tctx = tmp.getContext('2d', { willReadFrequently: true });
    // Grund erst decken, dann das Bild darauf. Wichtig bei 'ganz': ausserhalb
    // des Bildes waere die Flaeche sonst durchsichtig und damit Helligkeit 0 —
    // mit ?invert=an wuerde daraus 1 und der leere Raum glühte auf.
    //
    // Der Ton kommt aus der ECKE DES FOTOS, nicht aus Weiss oder Schwarz. Mit
    // festem Weiss blieb der Bildrand als sichtbares Rechteck stehen: die Wand
    // im Foto ist eben nicht rein weiss, und die Kante dazwischen sprang ins
    // Auge. So geht der leere Raum nahtlos in den Hintergrund des Fotos ueber.
    const eck = document.createElement('canvas');
    eck.width = eck.height = 8;
    const ectx = eck.getContext('2d', { willReadFrequently: true });
    ectx.drawImage(img, 0, 0, 8, 8);
    const e = ectx.getImageData(0, 0, 1, 1).data;
    tctx.fillStyle = 'rgb(' + e[0] + ',' + e[1] + ',' + e[2] + ')';
    tctx.fillRect(0, 0, W, H);

    // Bei 'motiv' zuerst grob ermitteln, wo die Person ueberhaupt sitzt. Grob
    // reicht: 200 px Breite kosten nichts und der Kasten muss nur auf ein paar
    // Pixel genau stimmen.
    let s, iw, ih, ix, iy;
    if (FAHRT && kasten) {
      s = SH / (kasten.h * img.naturalHeight) * (1 - RAND) * ZOOM;
      iw = img.naturalWidth * s; ih = img.naturalHeight * s;
      ix = (W - iw) / 2;
      iy = H / 2 - (kasten.y + kasten.h / 2) * ih;
    } else if (kasten) {
      // So skalieren, dass der Motivkasten ins Fenster passt, und so
      // verschieben, dass er mittig sitzt. Das Bild ragt dabei ueber den Rand
      // hinaus — das ist gewollt, dort steht ohnehin nur Wand.
      s = Math.min(W / (kasten.w * img.naturalWidth),
                   H / (kasten.h * img.naturalHeight)) * (1 - RAND) * ZOOM;
      iw = img.naturalWidth * s; ih = img.naturalHeight * s;
      ix = W / 2 - (kasten.x + kasten.w / 2) * iw;
      iy = H / 2 - (kasten.y + kasten.h / 2) * ih;
    } else {
      s = (GANZ ? Math.min(W / img.naturalWidth, H / img.naturalHeight)
                : Math.max(W / img.naturalWidth, H / img.naturalHeight)) * ZOOM;
      iw = img.naturalWidth * s; ih = img.naturalHeight * s;
      ix = (W - iw) / 2; iy = (H - ih) / 2;
    }
    tctx.drawImage(img, ix, iy, iw, ih);

    // Strecke der Querfahrt: ueber das MOTIV, nicht ueber das Bildrechteck.
    // Ueber das Rechteck stand die Ansicht am Anfang auf der leeren Wand links —
    // freigestellt also auf Schwarz, und die ersten Sekunden des Scrollens
    // zeigten nichts. Jetzt startet sie an der linken Kante der Person und
    // endet an der rechten.
    if (FAHRT && kasten && W > SW) {
      const grenze = v => Math.max(0, Math.min(W - SW, v));
      panVon = grenze(ix + kasten.x * iw);
      panBis = grenze(ix + (kasten.x + kasten.w) * iw - SW);
    } else {
      panVon = panBis = 0;
    }

    // Unterkante ausklingen lassen. Das Foto ist ein Hueftbild — ohne das endet
    // die Figur an einer schnurgeraden waagerechten Linie, dem Rand der
    // Fotografie. Mit dem Verlauf geht sie in den Grundton ueber und loest sich
    // ins Linienmuster auf, statt abgeschnitten zu wirken.
    if (SAUM > 0) {
      const yb = Math.min(H, iy + ih);
      const band = Math.max(1, ih * SAUM);
      const g = tctx.createLinearGradient(0, yb - band, 0, yb);
      g.addColorStop(0, 'rgba(' + e[0] + ',' + e[1] + ',' + e[2] + ',0)');
      g.addColorStop(1, 'rgba(' + e[0] + ',' + e[1] + ',' + e[2] + ',1)');
      tctx.fillStyle = g;
      tctx.fillRect(0, yb - band, W, band);
    }
    const px = tctx.getImageData(0, 0, W, H).data;

    pcv.width = W; pcv.height = H;
    pimg = pctx.createImageData(W, H);
    buf32 = new Uint32Array(pimg.data.buffer);

    const anz = W * H;
    const lum = new Float32Array(anz);
    const bunt = new Float32Array(anz);   // Buntheit: 0 = grau
    for (let p = 0, i = 0; p < anz; p++, i += 4) {
      const r = px[i], g = px[i+1], b = px[i+2];
      lum[p] = (r * 0.299 + g * 0.587 + b * 0.114) / 255;
      bunt[p] = (Math.max(r, g, b) - Math.min(r, g, b)) / 255;
    }
    const wandArtig = p => SCHATTEN && bunt[p] < GRAU && lum[p] > HGMIN;


    // ---- Hintergrund freistellen ----------------------------------------
    // Der eigentliche Grund, warum dieses Foto vorher nicht trug: die WAND ist
    // heller als die Person (gemessen: Median 206). Bei einer Auslenkung nach
    // Helligkeit bildet also der Hintergrund die Grate. Die Umkehr drehte das
    // um, liess dann aber die SCHATTEN modellieren — Jackenfalten gluehten, das
    // Gesicht blieb flach. Symptom behandelt, nicht Ursache.
    //
    // Ist die Wand weg, ist die Person das Hellste im Bild, es modellieren
    // wieder die Lichter, und die Umkehr wird ueberfluessig. Das ist genau die
    // Anordnung der Vorlage: helles Motiv auf Schwarz.
    //
    // Verfahren: Bereichswachstum von den ECKEN her, nicht ueber eine feste
    // Schwelle. Die Wand hat einen Verlauf (links deutlich dunkler), eine feste
    // Schwelle schnitte mitten hindurch. Das Wachstum folgt weichen Verlaeufen
    // und bleibt an der harten Kante der Person stehen.
    // Ecken statt ganzer Raender als Saat: die Arme reichen bis an die
    // Bildseiten, ein beliebiges Randpixel koennte also die Person selbst sein.
    const hg = new Uint8Array(anz);           // 1 = Hintergrund
    let frei = 0;
    if (FREI) {
      const stapel = new Int32Array(anz);
      let sp = 0;
      // Saat nur, wo es wirklich hell ist — eine dunkle Ecke duerfte sonst
      // anfangen, die Person aufzufressen.
      const saat = p => { if (!hg[p] && lum[p] > 0.45) { hg[p] = 1; stapel[sp++] = p; } };
      const nimm = (q, l) => !hg[q] && (wandArtig(q) || Math.abs(lum[q] - l) < TOL);
      saat(0); saat(W - 1); saat((H - 1) * W); saat(anz - 1);
      while (sp > 0) {
        const p = stapel[--sp];
        const l = lum[p], x = p % W;
        if (x > 0)       { const q = p - 1; if (nimm(q, l)) { hg[q] = 1; stapel[sp++] = q; } }
        if (x < W - 1)   { const q = p + 1; if (nimm(q, l)) { hg[q] = 1; stapel[sp++] = q; } }
        if (p >= W)      { const q = p - W; if (nimm(q, l)) { hg[q] = 1; stapel[sp++] = q; } }
        if (p < anz - W) { const q = p + W; if (nimm(q, l)) { hg[q] = 1; stapel[sp++] = q; } }
      }
      for (let p = 0; p < anz; p++) if (hg[p]) frei++;
    }

    if (SCHAERFE > 0) {
      const weich = weichzeichnen(lum, W, H, RADIUS);
      for (let p = 0; p < anz; p++)
        lum[p] = clamp01(lum[p] + SCHAERFE * (lum[p] - weich[p]));
    }

    // ---- Tonwerte spreizen, NUR ueber dem Motiv -------------------------
    // Vorher lief die Spreizung ueber das ganze Bild. Da mehr als die Haelfte
    // davon Wand war, bestimmten deren Werte die Perzentile, und fuer die
    // Person blieb kaum Spielraum uebrig — die Spreizung tat sichtbar nichts,
    // und ich habe das zuerst nicht nachgeprueft.
    let lo = 0, hi = 1;
    if (KONTRAST) {
      const hist = new Uint32Array(256);
      let z = 0;
      for (let p = 0; p < anz; p++) if (!hg[p]) { hist[(lum[p] * 255) | 0]++; z++; }
      if (z > 32) {
        let acc = 0, u = 0, o = 255;
        for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= z * 0.02) { u = v; break; } }
        acc = 0;
        for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc >= z * 0.02) { o = v; break; } }
        lo = u / 255; hi = Math.max(lo + 0.05, o / 255);
      }
    }
    const hell = i => {
      const p = i >> 2;
      if (hg[p]) return 0;                    // Hintergrund traegt nichts bei
      const v = clamp01((lum[p] - lo) / (hi - lo));
      return INVERT ? 1 - v : v;
    };
    freiAnteil = frei / anz;

    // Erst sammeln, dann in typisierte Felder giessen: beim Ringmuster haengt
    // die Punktzahl davon ab, wie viel jedes Rings ueberhaupt in der Buehne
    // liegt — das laesst sich nicht vorher ausrechnen, nur zaehlen.
    const sx = [], sy = [], sl = [];

    if (KREISE) {
      const cx = CX * W, cy = CY * H;
      // Bis in die weiteste Ecke, sonst blieben Ecken der Buehne leer.
      const rMax = Math.hypot(Math.max(cx, W - cx), Math.max(cy, H - cy));
      for (let r = linien; r <= rMax; r += linien) {
        // Winkelschritt aus der Bogenlaenge: sonst saessen die Punkte innen
        // dicht und aussen weit auseinander.
        const schritt = punkt / r;
        for (let a = 0; a < Math.PI * 2; a += schritt) {
          const co = Math.cos(a), si = Math.sin(a);
          const mx = (cx + r * co) | 0, my = (cy + r * si) | 0;
          if (mx < 0 || mx >= W || my < 0 || my >= H) continue;
          const l = hell((my * W + mx) * 4);
          // Auslenkung RADIAL nach innen, je heller. Das ist der Effekt.
          const rr = r - l * relief;
          sx.push(cx + rr * co); sy.push(cy + rr * si); sl.push(l);
        }
      }
    } else {
      for (let y = 0; y < H; y += linien)
        for (let x = 0; x < W; x += punkt) {
          const l = hell((y * W + x) * 4);
          sx.push(x); sy.push(y - l * relief); sl.push(l);   // nach oben
        }
    }

    n = sx.length;
    Dx = new Float32Array(n); Dy = new Float32Array(n);
    Dr1 = new Float32Array(n); Dr2 = new Float32Array(n);
    Dd = new Float32Array(n); Drgb = new Uint32Array(n);
    Ds = new Uint8Array(n);

    for (let k = 0; k < n; k++) {
      Dx[k] = sx[k]; Dy[k] = sy[k];

      // Helligkeit mit Boden: im Dunkeln bleiben die Linien als schwache
      // Boegen stehen, statt zu verschwinden. Genau das macht die Vorlage —
      // der schwarze Hintergrund ist dort von duennen Ringen durchzogen.
      const b = BODEN + (1 - BODEN) * Math.pow(sl[k], 0.85);
      let r, g, bl;
      if (TINT) {
        // Rot zieht frueh auf voll, Gruen und Blau erst in den Lichtern: dort
        // kippt es ins Weissglut, ohne dass die Mitteltoene rosa werden.
        r  = Math.round(255 * Math.min(1, b * 1.25));
        g  = Math.round(255 * Math.pow(b, 2.2) * 0.85);
        bl = Math.round(255 * Math.pow(b, 3.4) * 0.75);
      } else {
        const i = ((Math.min(H - 1, Math.max(0, sy[k] | 0)) * W)
                 + Math.min(W - 1, Math.max(0, sx[k] | 0))) * 4;
        r = px[i]; g = px[i+1]; bl = px[i+2];
      }
      Drgb[k] = (bl << 16) | (g << 8) | r;   // little endian: 0xAABBGGRR
      // Helle Punkte werden dicker und schliessen sich zu Graten, dunkle
      // bleiben einzeln stehen — daher die duennen Boegen im Hintergrund.
      Ds[k] = Math.max(1, Math.min(dicke, Math.round(b * dicke)));

      // Zerfall. u laeuft von 0 in der Mitte bis 1 am aeusseren Rand der
      // zerfallenden Seite; aussen loest sich zuerst auf, das liest sich als
      // Erosion statt als Spaltung.
      //
      // Die Franse ist der Punkt: eine harte Trennung bei x >= Mitte liess eine
      // schnurgerade senkrechte Kante mitten im Gesicht stehen. Mit einem
      // kleinen Zufall auf der Grenze zerfallen einzelne Punkte schon diesseits
      // der Mitte und andere jenseits noch nicht — der Rand franst aus, wie in
      // der Vorlage. 99 heisst: dieser Punkt steht und bewegt sich nie.
      const u = LINKS ? (mitte - sx[k]) / Math.max(1, mitte)
                      : (sx[k] - mitte) / Math.max(1, W - mitte);
      const franse = (Math.random() - 0.5) * 0.34;
      Dd[k] = (u + franse) <= 0 ? 99
            : (1 - clamp01(u)) * 0.7 + Math.random() * 0.35;
      Dr1[k] = Math.random(); Dr2[k] = Math.random();
    }

    bauZeit = performance.now() - t0;
    bereit = true;
  }

  // Der Aufbau kostet je nach Buehnengroesse zweistellige Millisekunden. Beim
  // Ziehen am Fensterrand feuert der ResizeObserver dutzendfach — deshalb wird
  // nur die Leinwand sofort angepasst und das Raster verzoegert neu gebaut.
  let bauTimer = 0;

  // Buehne messen und die Leinwand darauf stellen. Getrennt von resize(), weil
  // der Pruefhaken unten dasselbe braucht: baut man neu, ohne vorher zu messen,
  // entsteht das Raster wieder in der alten Groesse.
  function messen() {
    const r = stage.getBoundingClientRect();
    cssW = r.width; cssH = r.height;
    SW = Math.max(1, Math.round(cssW));
    SH = Math.max(1, Math.round(cssH));
    const neu = SW !== bauSW || SH !== bauSH;
    // dpr bewusst 1: die Punkte sind feines Korn, bei dpr 2 kostete alles das
    // Vierfache fuer keinen sichtbaren Gewinn.
    cv.width = SW; cv.height = SH;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    return neu;
  }

  function resize() {
    const neu = messen();
    if (!geladen) return;
    if (!bereit) { aufbauen(); draw(eased); return; }
    if (neu) {
      clearTimeout(bauTimer);
      bauTimer = setTimeout(() => { aufbauen(); draw(eased); }, 120);
    }
  }

  function readScroll() {
    const rect = intro.getBoundingClientRect();
    const total = intro.offsetHeight - stage.offsetHeight;
    target = total <= 0 ? 0 : clamp01(-rect.top / total);
  }

  // ---- Zeichnen ---------------------------------------------------------
  // ponytail: der Pixelpuffer haengt an der vollen Buehnengroesse. Auf 2545x1440
  // sind das 3,7 Mio. Felder loeschen und 14,6 MB je Bild uebertragen — gemessen
  // 14,8 ms Median, waehrend die Punktschleife dort nur noch einen Bruchteil
  // kostet. Bis 1920 bleibt es unter 7 ms, und laut Plan laeuft am Desktop
  // ohnehin das Video. Decke: ab etwa 2000 px Breite wird der Puffer teuer.
  // Ausbauweg, falls der Effekt doch auf grosse Schirme soll: Puffer auf ~1400
  // px deckeln und beim Zeichnen hochskalieren (imageSmoothingEnabled = false,
  // die Punkte werden dann groebere Bloecke — was zum Look passt).
  function punkte(dis) {
    buf32.fill(0);
    const kante = dis * (1 + SPREAD);
    const richtung = LINKS ? -1 : 1;

    for (let i = 0; i < n; i++) {
      let x = Dx[i], y = Dy[i];

      // Wer zerfaellt, steht schon beim Aufbau fest (Dd = 99 heisst: steht).
      // An der Ursprungsposition entschieden, nicht an der aktuellen — sonst
      // frieren Punkte ein, sobald sie die Mitte ueberqueren.
      let p = 0;
      if (dis > 0 && Dd[i] < 90) {
        p = clamp01(kante - Dd[i] * SPREAD);
        if (p >= 1) continue;            // verloschen
        const e = p * p;                 // beschleunigt statt gleichfoermig
        x += richtung * e * DRIFT * (0.35 + Dr1[i] * 1.3);
        y += e * DRIFT * 0.55 * (Dr2[i] - 0.65);   // leicht nach oben versetzt
      }

      const xi = x | 0, yi = y | 0;
      if (xi < 0 || xi >= W || yi < 0 || yi >= H) continue;
      const farbe = Drgb[i] | ((255 - ((p * 255) | 0)) << 24);

      // Im Flug duenner werden: ein fliegender 2x2-Block sieht aus wie Konfetti,
      // ein einzelnes Pixel wie Staub.
      const bs = p > 0.3 ? 1 : Ds[i];
      if (bs === 1) { buf32[yi * W + xi] = farbe; continue; }
      for (let by = 0; by < bs; by++) {
        const yy = yi + by; if (yy >= H) break;
        const zeile = yy * W;
        for (let bx = 0; bx < bs; bx++) {
          const xx = xi + bx; if (xx >= W) break;
          buf32[zeile + xx] = farbe;
        }
      }
    }
    pctx.putImageData(pimg, 0, 0);
  }

  function draw(t) {
    if (!bereit) return;

    const scan = clamp01(t / SCAN_TO);
    const dis  = clamp01((t - DIS_FROM) / (DIS_TO - DIS_FROM));

    ctx.fillStyle = '#0B0510';
    ctx.fillRect(0, 0, SW, SH);

    punkte(dis);

    // Querfahrt: das Fenster wandert ueber den breiteren Puffer. Eine eigene
    // Daempfung braucht es nicht — t ist bereits der gedaempfte Scrollwert.
    const panX = W > SW ? -Math.round(panVon + (panBis - panVon) * clamp01(t)) : 0;

    // Die Aufdecklinie laeuft ueber die sichtbare Hoehe. Da die Punktflaeche
    // genau die Buehne ist, ist das hier schlicht H.
    const scanY = scan * SH;

    ctx.save();
    // Ist die Linie durch, faellt der Beschnitt weg: ein Clip ueber die ganze
    // Flaeche kostet sonst in jedem Bild etwas fuer nichts.
    if (scan < 1) { ctx.beginPath(); ctx.rect(0, 0, SW, scanY); ctx.clip(); }
    ctx.drawImage(pcv, panX, 0);   // 1:1, kein Punkt geht verloren; panX = Querfahrt
    ctx.restore();

    if (scan > 0 && scan < 1) {
      const hoehe = Math.max(2, SH * 0.012);
      const g = ctx.createLinearGradient(0, scanY - hoehe * 6, 0, scanY + hoehe);
      g.addColorStop(0,   'rgba(255,40,40,0)');
      g.addColorStop(0.8, 'rgba(255,60,50,.28)');
      g.addColorStop(1,   'rgba(255,150,130,.85)');
      ctx.fillStyle = g;
      ctx.fillRect(0, scanY - hoehe * 6, SW, hoehe * 7);
    }
  }

  // ---- Schleife ---------------------------------------------------------
  const zeiten = [];
  function tick() {
    const t0 = performance.now();

    eased += (target - eased) * (reduce ? 1 : DAMPING);
    if (Math.abs(target - eased) < 0.0002) eased = target;
    draw(eased);
    hint.style.opacity = String(Math.max(0, 1 - eased * 6));

    // Gemessen, nicht geschaetzt: Median statt Mittelwert, damit ein einzelner
    // Ausreisser (Speicherbereinigung) das Bild nicht faelscht.
    zeiten.push(performance.now() - t0);
    if (zeiten.length > 200) zeiten.shift();
    if (zeiten.length > 20 && (zeiten.length & 15) === 0) {
      const s = [...zeiten].sort((a, b) => a - b);
      hud.textContent =
        'Fortschritt ' + (eased * 100).toFixed(1) + ' %\n' +
        'Muster ' + (KREISE ? 'Ringe' : 'Zeilen') +
          '   Punkte ' + n.toLocaleString('de') + '\n' +
        'Linie ' + LINIEN + '  Punkt ' + PUNKTE +
          '  Relief ' + RELIEF + '  Boden ' + BODEN + '\n' +
        'Bildzeit Median ' + s[s.length >> 1].toFixed(2) + ' ms\n' +
        '          95 %   ' + s[Math.floor(s.length * 0.95)].toFixed(2) + ' ms\n' +
        'Flaeche ' + W + '×' + H + '  Aufbau ' + bauZeit.toFixed(0) + ' ms\n' +
        'h = Anzeige aus';
    }
    requestAnimationFrame(tick);
  }

  addEventListener('scroll', readScroll, { passive: true });
  new ResizeObserver(() => { resize(); readScroll(); }).observe(stage);
  addEventListener('keydown', e => { if (e.key === 'h') hud.classList.toggle('off'); });
  readScroll();

  // Fuer die Messung von aussen (Screenshots an festen Punkten).
  window.__face = {
    springe(v) { target = clamp01(v); eased = target; draw(eased); },
    // Baut das Raster sofort neu, ohne die 120-ms-Entprellung abzuwarten.
    // Nur fuer Messungen: im Hintergrund-Tab streckt der Browser jeden Timer
    // auf eine Sekunde, und die Abnahme ueber sieben Breiten lief damit in
    // die Zeitgrenze der Fernsteuerung.
    neuAufbau() { messen(); aufbauen(); draw(eased);
                  return { n, W, H, aufbauMs: Math.round(bauZeit) }; },
    zahlen() {
      const s = [...zeiten].sort((a, b) => a - b);
      return { n, W, H, muster: KREISE ? 'ringe' : 'zeilen',
               skala: +skala.toFixed(2), freigestelltProzent: +(freiAnteil*100).toFixed(1),
               kasten: letzterKasten, buehne: SW + 'x' + SH, puffer: W + 'x' + H,
               fahrt: Math.round(panVon) + '..' + Math.round(panBis),
               linien: Math.round(LINIEN * skala), punkte: Math.round(PUNKTE * skala),
               aufbauMs: Math.round(bauZeit),
               median: s[s.length >> 1], p95: s[Math.floor(s.length * .95)] };
    }
  };
})();
</script>
</body>
</html>
